/* ============================================================
   TOKENS — padrão Apple (HIG). Três estados de tema:
   :root                       -> claro (base, sempre definido)
   prefers-color-scheme: dark  -> escuro, salvo se o usuário fixou claro
   [data-theme="escuro"]       -> escuro forçado
   ============================================================ */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --fill:#EFEFF4;
  --fill2:#E3E3E8;
  --ink:#000000;
  --ink2:rgba(60,60,67,.88);
  --muted:rgba(60,60,67,.60);
  --faint:rgba(60,60,67,.30);
  --line:#E5E5EA;
  --line2:#D1D1D6;
  --tint:#007AFF;
  --tint-soft:rgba(0,122,255,.12);
  --danger:#D70015;
  --warn:#B25000;
  --ok:#0B7A34;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --r:14px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="claro"]){
    --bg:#000000;
    --card:#1C1C1E;
    --fill:#1C1C1E;
    --fill2:#2C2C2E;
    --ink:#FFFFFF;
    --ink2:rgba(235,235,245,.88);
    --muted:rgba(235,235,245,.60);
    --faint:rgba(235,235,245,.30);
    --line:#38383A;
    --line2:#48484A;
    --tint:#0A84FF;
    --tint-soft:rgba(10,132,255,.20);
    --danger:#FF6961;
    --warn:#FFB340;
    --ok:#30D158;
    --shadow:none;
  }
}
:root[data-theme="escuro"]{
  --bg:#000000;
  --card:#1C1C1E;
  --fill:#1C1C1E;
  --fill2:#2C2C2E;
  --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.88);
  --muted:rgba(235,235,245,.60);
  --faint:rgba(235,235,245,.30);
  --line:#38383A;
  --line2:#48484A;
  --tint:#0A84FF;
  --tint-soft:rgba(10,132,255,.20);
  --danger:#FF6961;
  --warn:#FFB340;
  --ok:#30D158;
  --shadow:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* rede de segurança: SVG sem medida explícita estoura no Safari */
svg{width:20px;height:20px;flex:none}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:16px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   ESTRUTURA
   ============================================================ */
#app{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg);
  height:100vh;      /* reserva para navegadores sem dvh */
  height:100dvh;
  overflow:hidden;
}
#hdr{grid-row:1}
#main{grid-row:2;position:relative;min-height:0;overflow:hidden}
#tabs{grid-row:3}

/* cabeçalho */
#hdr{
  /* O iOS desenha uma faixa de vidro logo abaixo da barra de status em apps da
     tela de início: o que ficar ali embaixo sai esfumaçado. Descemos o conteúdo
     do cabeçalho para fora dela, tirando do espaço de baixo para o custo em
     altura útil ficar em 4px em vez de 12px. */
  padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 4px;
  display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:4px;
}
.hbtn{
  min-height:38px;padding:0 8px;display:flex;align-items:center;gap:3px;
  color:var(--tint);font-size:16px;border-radius:10px;
}
.hbtn.right{justify-content:flex-end;text-align:right}
/* colunas fixas: esconder um botão não pode empurrar o título para a coluna 1 */
#hleft{grid-column:1}
.htitle{grid-column:2}
#hright{grid-column:3}
.hbtn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hbtn[hidden]{display:none}
/* A marca usa o azul de acento nos dois temas — o token --tint já muda sozinho
   (#007AFF no claro, #0A84FF no escuro). Branca no escuro competia com o título,
   que também é branco; azul ela conversa com os pontinhos de passo e com a aba ativa. */
.hbtn.logo{pointer-events:none;justify-content:flex-start;padding-left:6px;color:var(--tint)}
/* precisa vencer `.hbtn svg{width:19px}`, que é mais específico que `.marca` */
.hbtn .marca,.marca{width:26px;height:26px;flex:none}
.htitle{text-align:center;min-width:0}
.htitle .t{font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:5px}
.dot{width:16px;height:3px;border-radius:2px;background:var(--line2)}
.dot.on{background:var(--tint)}
.dot.done{background:var(--tint);opacity:.45}

/* telas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.scroll.pad-top{padding-top:4px}

/* abas */
#tabs{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:.5px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted)}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:500;letter-spacing:.01em}
.tab[aria-selected="true"]{color:var(--tint)}

/* ============================================================
   GRADE DE CARDS (telas 1 e 2)
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows,4),minmax(0,1fr));
  gap:9px;padding:2px 12px 12px;height:100%;
}
.cardbtn{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:13px 13px 12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  min-width:0;min-height:0;transition:transform .08s ease,background .12s;
}
.cardbtn:active{transform:scale(.97);background:var(--fill2)}
.cardbtn .badge{
  width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:24px;line-height:1;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 32%, transparent);
  flex:none;
}
.cardbtn .nm{
  font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.2;
  overflow-wrap:break-word;hyphens:auto;min-width:0;text-wrap:balance;
}
.grid[data-rows="5"] .cardbtn{padding:11px 12px 10px}
.grid[data-rows="5"] .cardbtn .badge{width:38px;height:38px;border-radius:9px;font-size:20px}
.grid[data-rows="5"] .cardbtn .nm{font-size:14px}
.grid[data-rows="3"] .cardbtn .badge{width:52px;height:52px;border-radius:13px;font-size:28px}
.grid[data-rows="3"] .cardbtn .nm{font-size:17px}
.cardbtn.more .badge{background:var(--fill2);box-shadow:none;color:var(--muted)}
.cardbtn.more .badge svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.grid[data-rows="5"] .cardbtn.more .badge svg{width:20px;height:20px}

/* ============================================================
   TELA DE VALOR
   ============================================================ */
/* flex, não grid: com trilhas auto + fr o navegador distribuía a folga nas
   linhas de cima e os chips inchavam */
.val{display:flex;flex-direction:column;gap:9px;padding:0 12px 12px;height:100%}
.val>.amount,.val>.chips,.val>.descbox{flex:none}
.val>.pad{flex:1;min-height:0}
.amount{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px 13px}
.amount .k{font-size:12px;color:var(--muted)}
.amount .n{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-top:1px}
.amount .cur{font-size:21px;font-weight:600;color:var(--muted)}
.amount .fig{font-size:46px;font-weight:600;letter-spacing:-.035em;line-height:1.08;color:var(--ink)}
.amount .fig.zero{color:var(--faint)}
.amount .dec{color:var(--muted);transition:color .12s}
.amount .dec.typed{color:inherit}
/* linha derivada do parcelamento: é ela que impede digitar o valor da parcela
   achando que é o total */
.amount .parc{display:flex;align-items:center;gap:7px;margin:7px 0 0;padding-top:8px;
  border-top:.5px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.amount .parc b{color:var(--ink2);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:9px 12px;min-width:0}
.chip .k{display:block;font-size:11px;color:var(--muted)}
.chip .v{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v.sem{font-weight:400;color:var(--muted)}
.chip:active{background:var(--fill2)}
.descbox{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 14px}
.descbox input{width:100%;font-size:15px}
.descbox input::placeholder{color:var(--muted)}
.pad{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{
  background:var(--card);border-radius:11px;box-shadow:var(--shadow);
  padding:8px 0;text-align:center;color:var(--tint);font-size:15px;font-weight:500;
}
.quick button:active{background:var(--fill2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr)) auto;gap:8px;min-height:0}
.key{
  background:var(--card);border-radius:12px;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;
  transition:background .1s,transform .06s;
}
.key:active{background:var(--fill2);transform:scale(.96)}
.key.comma{font-size:32px;font-weight:500;padding-bottom:16px}
.key.back{color:var(--tint)}
.key.back svg{width:27px;height:27px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.key.go{
  grid-column:1/-1;background:var(--tint);color:#fff;font-size:17px;font-weight:600;
  padding:16px 0;border-radius:13px;letter-spacing:-.01em;box-shadow:none;
}
.key.go:disabled{opacity:.35}
.key:disabled{opacity:.35}

/* ============================================================
   LISTAS AGRUPADAS (padrão iOS)
   ============================================================ */
.glabel{font-size:12.5px;color:var(--muted);padding:18px 4px 7px;text-transform:none;letter-spacing:0}
.glabel:first-child{padding-top:6px}
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:12px 14px;width:100%;position:relative;
}
.grow+.grow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.grow.tap:active{background:var(--fill2)}
.grow .r1{font-size:16px;letter-spacing:-.01em}
.grow .r2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.grow .val{font-size:15px;color:var(--muted);white-space:nowrap}
.chev{width:8px;height:13px;stroke:var(--faint);stroke-width:2.4;fill:none;flex:none}
.grow.danger .r1{color:var(--danger)}
.grow .right{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:15px}

/* segmentado */
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px}
.seg button{
  flex:1;text-align:center;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:500;
  color:var(--ink);white-space:nowrap;transition:background .15s;
}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}

/* ============================================================
   CONSULTA
   ============================================================ */
.topbar{padding:0 16px 10px;display:flex;flex-direction:column;gap:9px}
.searchwrap{background:var(--fill2);border-radius:10px;padding:8px 11px;display:flex;align-items:center;gap:7px}
.searchwrap svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2.2;fill:none;flex:none}
.searchwrap input{flex:1;font-size:15px;min-width:0}
.periodbar{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:6px}
.periodbar .pb{display:grid;place-items:center;height:32px;border-radius:9px;color:var(--tint);background:var(--fill2)}
.periodbar .pb:disabled{opacity:.3}
.periodbar .pb svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.periodbar .lbl{text-align:center;font-size:15px;font-weight:600;letter-spacing:-.01em}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:1px 16px 10px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{
  flex:none;background:var(--fill2);border-radius:999px;padding:6px 12px;
  font-size:13px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.fchip[aria-pressed="true"]{background:var(--tint);color:#fff}
.fchip .sw{width:8px;height:8px;border-radius:3px;background:var(--sw);flex:none}
.fchip[aria-pressed="true"] .sw{background:rgba(255,255,255,.85)}
.fchip.filt{color:var(--tint)}
.fchip.filt[data-on="1"]{background:var(--tint);color:#fff}

.totbar{
  margin:0 16px 12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 15px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
}
.totbar .k{font-size:12px;color:var(--muted)}
.totbar .v{font-size:25px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:1px}
.totbar .c{font-size:12px;color:var(--muted);text-align:right;line-height:1.45}

.daygrp{margin-bottom:15px}
.dayhd{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 6px}
.dayhd .d{font-size:12.5px;color:var(--muted)}
.dayhd .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.swipe{position:relative;overflow:hidden}
.swipe .del{
  position:absolute;inset:0;background:var(--danger);color:#fff;
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 26px;font-size:15px;font-weight:600;white-space:nowrap;
}
.swipe.armado .del{justify-content:flex-start}
.erow{
  position:relative;background:var(--card);
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:11px 14px;width:100%;
  transition:transform .18s ease;touch-action:pan-y;
}
.erow:active{background:var(--fill2)}
.erow .ic{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.erow .tx{min-width:0;display:block}
.erow .t1{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .t2{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.erow .vl{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.pbadge{display:inline-block;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  padding:1px 6px;border-radius:6px;margin-left:7px;vertical-align:1px;
  background:var(--fill2);color:var(--muted)}
.erow .t1 .pbadge{background:color-mix(in srgb, var(--c) 20%, var(--card));color:var(--ink2)}

/* ============================================================
   RESUMO
   ============================================================ */
.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.hero .k{font-size:12.5px;color:var(--muted)}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.08;margin-top:3px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums}
.delta.up{color:var(--warn)}
.delta.down{color:var(--ok)}
.delta.flat{color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.tile{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 13px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:18px;font-weight:600;letter-spacing:-.025em;margin-top:2px;font-variant-numeric:tabular-nums}
/* comprometido à frente: sem ele, o parcelamento faria o mês parecer menor
   sem dizer para onde o resto foi */
.compr{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-top:9px}
.compr .k{font-size:12.5px;color:var(--muted)}
.compr .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.compr .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.compr .cbars{display:flex;gap:6px;margin-top:11px;align-items:flex-end;height:56px}
.compr .cbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.compr .cbar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--tint);opacity:.5}
.compr .cbar em{font-style:normal;font-size:10px;color:var(--muted)}
/* escolha das parcelas */
.parcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.parcgrid button{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:13px 0;
  text-align:center;font-size:17px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.parcgrid button:active{background:var(--fill2)}
.parcgrid button small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
.parcgrid button[aria-pressed="true"]{background:var(--tint);color:#fff;box-shadow:none}
.parcgrid button[aria-pressed="true"] small{color:rgba(255,255,255,.82)}
/* revisão de recorrentes */
.rrev{display:grid;grid-template-columns:34px minmax(0,1fr) auto 26px;gap:10px;align-items:center;
  padding:11px 14px;width:100%;position:relative;background:var(--card);text-align:left}
.rrev+.rrev::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.rrev .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent)}
.rrev .nm{display:block;font-size:15.5px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrev .sb{display:block;font-size:12px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrev .vl{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrev input.vin{width:96px;text-align:right;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--fill2);border-radius:8px;padding:6px 8px}
.rrev .ck{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;
  background:var(--tint);color:#fff;font-size:13px;font-weight:700}
.rrev[aria-pressed="false"] .ck{background:var(--fill2);color:transparent}
.rrev[aria-pressed="false"] .nm,.rrev[aria-pressed="false"] .vl{color:var(--muted)}
.skiprow{display:block;background:var(--card);padding:0 14px 11px;position:relative}
.skiprow button.dan{color:var(--danger);font-size:12.5px;padding:4px 0}
/* meses pulados, no detalhe do molde */
.msk{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;background:var(--card);position:relative;width:100%;text-align:left}
.msk+.msk::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.msk .mn{font-size:15.5px}
.msk .mr{font-size:14px;color:var(--tint);font-weight:500;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:2px}
.barrow{padding:10px 0;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline}
.barrow:active{opacity:.6}
.barrow .bn{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:7px;min-width:0;letter-spacing:-.01em}
.barrow .bn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bv{font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.barrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--fill2);overflow:hidden;margin-top:3px}
.barrow .fill{display:block;height:100%;min-width:4px;background:var(--c);border-radius:0 4px 4px 0}
.barrow .bp{grid-column:1/-1;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ============================================================
   BANNER / VAZIO / TOAST
   ============================================================ */
.banner{
  margin:0 16px 12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  border:.5px solid var(--line2);
  border:.5px solid color-mix(in srgb, var(--warn) 45%, transparent);
}
.banner .bt{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.banner .bs{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.banner .ba{background:var(--tint);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.banner .bx{color:var(--muted);padding:6px;margin:-6px}

.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:9px}
.empty .e1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.empty .e2{font-size:14px;color:var(--muted);max-width:32ch;line-height:1.45}
.empty .eb{margin-top:6px;background:var(--tint);color:#fff;border-radius:999px;padding:11px 20px;font-size:15px;font-weight:600}
.empty.alert .e1{color:var(--danger)}

#toast{
  position:fixed;left:12px;right:12px;z-index:60;
  bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
  background:var(--card);border:.5px solid var(--line);border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.22);
  padding:12px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  animation:up .22s cubic-bezier(.2,.8,.25,1);
}
#toast .tt{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
#toast .ts{font-size:12.5px;color:var(--muted);margin-top:1px}
#toast .tu{color:var(--tint);font-size:15px;font-weight:600;white-space:nowrap}
@keyframes up{from{transform:translateY(14px);opacity:0}}

/* ============================================================
   FOLHAS
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  background:var(--bg);border-radius:14px 14px 0 0;
  max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  animation:rise .26s cubic-bezier(.2,.85,.25,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@keyframes rise{from{transform:translateY(100%)}}
.sheet-h{
  display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:6px;
  padding:14px 12px 10px;
}
.sheet-h .st{text-align:center;font-size:16px;font-weight:600;letter-spacing:-.02em}
.sheet-h .sa{color:var(--tint);font-size:16px}
.sheet-h .sa.right{text-align:right}
.sheet-h .sa.strong{font-weight:600}
.sheet-h{flex:none}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;display:flex;flex-direction:column}
/* sem isto o flex encolhe a lista até caber e nada rola — os itens ficam achatados */
.sheet-b>*{flex:0 0 auto}
.opt{
  display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;
  background:var(--card);padding:11px 14px;width:100%;position:relative;
}
.opt+.opt::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.opt:active{background:var(--fill2)}
.opt .ic{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c,var(--fill2)) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c,transparent) 30%, transparent);
}
.opt .nm{font-size:16px;letter-spacing:-.01em;min-width:0}
.opt .nm small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.opt .tag{font-size:12px;color:var(--muted);white-space:nowrap}
.optwrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.dayopts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dayopt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 14px}
.dayopt.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden}
/* o campo de data cobre o card inteiro e fica invisível: tocar em qualquer
   ponto abre o calendário, não só em cima do valor */
.dayopt.wide input[type="date"]{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  -webkit-appearance:none;appearance:none;font-size:16px;
}
.dayopt.wide .cal{font-size:22px;line-height:1}
/* mesma ideia no formulário de edição: o campo inteiro é a área de toque */
.field.data{position:relative}
.field.data input[type="date"]{position:relative;z-index:1;width:100%}
.dayopt .n{font-size:18px;font-weight:600;letter-spacing:-.02em}
.dayopt .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.dayopt[aria-pressed="true"]{outline:2px solid var(--tint);outline-offset:-2px}

/* formulário */
.field{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;margin-bottom:9px}
.field .k{display:block;font-size:11.5px;color:var(--muted)}
.field input,.field select{width:100%;font-size:16px;margin-top:2px;background:none}
.field input[type="date"]{font-variant-numeric:tabular-nums}
.field.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.field .v{display:block;font-size:16px;margin-top:2px}
.btnfull{
  display:block;width:100%;text-align:center;background:var(--tint);color:#fff;
  border-radius:13px;padding:14px;font-size:17px;font-weight:600;margin-top:6px;
}
.btnfull.sec{background:var(--fill2);color:var(--tint)}
.btnfull.dan{background:var(--fill2);color:var(--danger)}
.btnfull:disabled{opacity:.4}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;padding:10px 4px 0}

/* reordenação */
.reorder{position:relative}
.rrow{
  display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:11px;align-items:center;
  background:var(--card);padding:11px 14px;position:relative;touch-action:pan-y;
}
.rrow+.rrow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.rrow.drag{z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.22);border-radius:10px;opacity:.97}
.rrow .hnd{color:var(--faint);padding:8px;margin:-8px;cursor:grab;touch-action:none}
.rrow .hnd svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rrow .ic{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.rrow .nm{font-size:15.5px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ct{font-size:12px;color:var(--muted);white-space:nowrap}
.cutline{
  display:flex;align-items:center;gap:9px;padding:7px 14px;background:var(--fill);
  font-size:11.5px;color:var(--muted);position:relative;
}
.cutline::before,.cutline::after{content:"";flex:1;height:.5px;background:var(--line2)}

/* arranque */
#boot{position:fixed;inset:0;z-index:90;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:32px 26px;text-align:center}
#boot .bt{font-size:19px;font-weight:600;letter-spacing:-.02em}
#boot .bs{font-size:14px;color:var(--muted);max-width:34ch;line-height:1.45}
#boot.erro .bt{color:var(--danger)}
#boot .rel{text-align:left;font-size:13.5px;line-height:1.5;display:flex;flex-direction:column;gap:9px;
  background:var(--card);border-radius:12px;padding:14px 15px;max-width:36ch;width:100%}
#boot .dl{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;word-break:break-word}
#boot .si{color:var(--ok);font-weight:700}
#boot .nao{color:var(--danger);font-weight:700}

/* util */
.sp{height:10px}
.center{text-align:center}
.hide{display:none!important}

/* ---------- v11: entradas e saídas ---------- */
/* Bloco de saldo do Resumo. Só existe quando houve entrada no mês — sem entrada,
   aquela tela fica exatamente como era antes. */
.saldo{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px 13px;margin-bottom:9px}
.saldo .lin{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:5px 0}
.saldo .lin+.lin{border-top:.5px solid var(--line)}
.saldo .lin.tot{border-top:1px solid var(--line2);margin-top:3px;padding-top:9px}
.saldo .lb{font-size:13.5px;color:var(--muted);min-width:0}
.saldo .lin.tot .lb{font-size:15px;color:var(--ink);font-weight:600}
.saldo .vv{font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.saldo .lin.tot .vv{font-size:23px;letter-spacing:-.03em}
/* verde = dinheiro que entrou ou voltou; vermelho = saldo negativo */
.vin{color:var(--ok)}
.vneg{color:var(--ok)}
.saldo .vneg{color:var(--danger)}
.erow .vl.vin,.erow .vl.vneg{color:var(--ok)}
.erow .t2 b{color:var(--ok);font-weight:600}
.msk .mr.vin{color:var(--ok)}
.msk .mr.vneg{color:var(--danger)}
/* O ± na fileira dos atalhos: separado dos somadores por um respiro, porque
   os três primeiros somam dinheiro e este inverte o sentido. */
.quick{grid-template-columns:1fr 1fr 1fr 14px 1fr}
.quick .gap{height:1px}
.quick .sig{font-size:17px;font-weight:700;letter-spacing:.02em}
.quick .sig[aria-pressed="true"]{background:color-mix(in srgb,var(--danger) 15%,var(--card));
  color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 45%,transparent)}
/* Os três avisos do estorno: número vermelho com sinal, ± aceso, botão trocado. */
.amount .n.neg .cur,.amount .n.neg .fig{color:var(--danger)}
.amount .n.rec .cur,.amount .n.rec .fig{color:var(--ok)}
.key.go.dan{background:var(--danger)}
.chip:disabled{opacity:.38}
.field.off{opacity:.55}
.field.off select{pointer-events:none}
/* seletor de lado na lista — só aparece quando existe lançamento de entrada */
.seg{display:flex;background:var(--fill2);border-radius:9px;padding:2px;gap:2px;margin:0 4px 8px}
.seg button{flex:1;font-size:13.5px;font-weight:600;padding:6px 0;border-radius:7px;color:var(--ink2)}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.10);color:var(--ink)}
</style>
</head>

<script>
/* Diagnóstico de arranque. Registrado antes de tudo: se o script principal
   for cortado, não for lido ou explodir, esta tela conta o que aconteceu. */
window.__diag={inicial:true,fim:false,erro:null};
(function(){
  function esc(t){return String(t).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
  function linha(ok,txt){return '<div class="dl"><span class="'+(ok?'si':'nao')+'">'+(ok?'✓':'✗')+'</span>'+esc(txt)+'</div>';}
  function relatar(){
    var b=document.getElementById('boot');
    if(!b)return;
    var tam=0;
    try{tam=document.documentElement.outerHTML.length;}catch(e){}
    var abas=document.getElementById('tabs');
    var d=window.__diag;
    b.className='erro';
    b.innerHTML='<div class="bt">O app não iniciou</div>'+
      '<div class="rel">'+
      linha(true,'Script de arranque rodou')+
      linha(d.fim,d.fim?'Arquivo chegou até o fim':'ARQUIVO CORTADO antes do fim')+
      linha(tam>100000,'Bytes recebidos: '+tam.toLocaleString('pt-BR')+'  (esperado ~112.000)')+
      linha(typeof SEED!=='undefined','Dados das categorias: '+(typeof SEED!=='undefined'?('carregados, '+SEED.length+' categorias'):'não chegaram'))+
      linha(!!(abas&&abas.children.length),'Interface desenhada: '+((abas&&abas.children.length)?'sim':'não'))+
      linha(!d.erro,d.erro?('ERRO: '+d.erro):'Nenhum erro de JavaScript')+
      '</div>'+
      '<div class="bs">Tire um print desta tela e mande para o Claude.</div>';
  }
  window.addEventListener('error',function(e){
    window.__diag.erro=(e.message||'erro')+(e.lineno?(' · linha '+e.lineno):'');
    relatar();
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__diag.erro='Promessa: '+e.reason;relatar();
  });
  function agendar(){setTimeout(relatar,400);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',agendar);
  else agendar();
  setTimeout(relatar,2500);
})();
</script>

":"out-2","n":"Família","e":"👨‍👩‍👧"},{"id":"out-3","n":"Não classificado","e":"🏷️"}]},{"id":"sal","n":"Salários e benefícios","e":"💼","c":"#0B7A34","tipo":"e","subs":[{"id":"sal-1","n":"Salário","e":"💵"},{"id":"sal-2","n":"13º e férias","e":"🎄"},{"id":"sal-3","n":"PLR e bônus","e":"🏆"},{"id":"sal-4","n":"Crédito alimentação","e":"🍽️"},{"id":"sal-5","n":"Crédito saúde","e":"🩺"},{"id":"sal-6","n":"Trabalho autônomo","e":"🧑‍💻"},{"id":"sal-7","n":"Outros rendimentos","e":"➕"}]},{"id":"ven","n":"Vendas","e":"🏷️","c":"#0E7490","tipo":"e","subs":[{"id":"ven-1","n":"Item usado","e":"📦"},{"id":"ven-2","n":"Outros","e":"🏷️"}]},{"id":"oen","n":"Outras entradas","e":"💰","c":"#4D7C0F","tipo":"e","subs":[{"id":"oen-1","n":"Restituição de imposto","e":"🧾"},{"id":"oen-2","n":"Outros","e":"💰"}]}];

/* ============================================================
   Despesas — app pessoal de registro e controle
   Arquivo único · dados em localStorage · padrão Apple (HIG)
   ============================================================ */
(function(){
"use strict";

/* ---------------- utilidades ---------------- */
var KEY='despesas.v1';
var SCHEMA=4;
var MAXPARC=24;      /* acima disso o app recusa: não é uso previsto */
var MAXRETRO=24;     /* pendências de recorrência nunca olham além de 24 meses atrás */
var BUILD='2026-09-17.1';   /* carimbo de versão, trocado a cada geração */

function el(h){var d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function brl(c){return (c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var DOW=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

/* datas SEMPRE locais: nunca ISO com fuso, senão 23h50 vira o dia seguinte */
function ymd(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hoje(){return ymd(new Date());}
function ontem(){var d=new Date();d.setDate(d.getDate()-1);return ymd(d);}
function parseYmd(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function mkey(s){return String(s).slice(0,7);}
function mesLabel(mk){var p=mk.split('-');return MES[+p[1]-1]+' de '+p[0];}
function mesCurto(mk){var p=mk.split('-');return MESC[+p[1]-1]+'/'+String(p[0]).slice(2);}
function addMes(mk,n){var p=mk.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return ymd(d).slice(0,7);}
function diaLabel(s){
  if(s===hoje())return 'hoje · '+(+s.slice(8))+' '+MESC[+s.slice(5,7)-1];
  if(s===ontem())return 'ontem · '+(+s.slice(8))+' '+MESC[+s.slice(5,7)-1];
  var d=parseYmd(s);
  return DOW[d.getDay()]+' · '+(+s.slice(8))+' '+MESC[+s.slice(5,7)-1];
}
function porExtenso(s){
  return (+s.slice(8))+' de '+MES[+s.slice(5,7)-1]+' de '+s.slice(0,4);
}
function diasEntre(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function diasNoMes(mk){var p=mk.split('-');return new Date(+p[0],+p[1],0).getDate();}

/* ============================================================
   PARCELAMENTO
   Uma compra parcelada continua sendo UM registro: `v` é o total
   da compra e `par` o número de parcelas. O valor da parcela e a
   data de cada uma são derivados, nunca gravados.
   ============================================================ */
function nParc(e){
  var n=(e&&e.par)?(parseInt(e.par,10)||1):1;
  return (n>=2&&n<=MAXPARC)?n:1;
}
/* Divide o total em n parcelas inteiras de centavos. A sobra vai na
   PRIMEIRA, como fazem as operadoras. A soma fecha sempre com o total. */
function fatiar(total,n){
  var base=Math.floor(total/n),resto=total-base*n,out=[];
  for(var i=0;i<n;i++)out.push(base+(i===0?resto:0));
  return out;
}
/* Mesma data i meses à frente, presa ao último dia quando o mês é curto:
   31/01 + 1 mês é 28/02, nunca 03/03 — o setMonth cru erraria isso. */
function addMesData(s,i){
  var dia=+s.slice(8);
  var alvo=new Date(+s.slice(0,4),+s.slice(5,7)-1+i,1);
  var ult=new Date(alvo.getFullYear(),alvo.getMonth()+1,0).getDate();
  alvo.setDate(Math.min(dia,ult));
  return ymd(alvo);
}
/* Expande um lançamento nas suas ocorrências — uma por parcela.
   Uma ocorrência tem a mesma forma de um lançamento, então lista,
   resumo e filtros não precisam saber o que é uma parcela.
   `oid` é sempre o id da COMPRA: é por ele que se edita e se exclui. */
function ocorrenciasDe(e){
  var n=nParc(e);
  /* `rec`/`comp` viajam junto: sem eles a tela não sabe que aquele lançamento
     veio de uma recorrência, e passa a oferecer "Tornar recorrente" de novo. */
  if(n<2)return [{id:e.id,oid:e.id,d:e.d,cat:e.cat,sub:e.sub,v:e.v,pay:e.pay,
                  desc:e.desc,ts:e.ts,pi:1,pn:1,dc:e.d,vt:e.v,
                  rec:e.rec||null,comp:e.comp||null}];
  var vs=fatiar(e.v,n),out=[];
  for(var i=0;i<n;i++){
    out.push({id:e.id+'#'+(i+1),oid:e.id,d:addMesData(e.d,i),cat:e.cat,sub:e.sub,
              v:vs[i],pay:e.pay,desc:e.desc,ts:e.ts,pi:i+1,pn:n,dc:e.d,vt:e.v,
              rec:e.rec||null,comp:e.comp||null});
  }
  return out;
}
function ocorrencias(){
  var out=[];
  for(var i=0;i<DB.exp.length;i++){
    var o=ocorrenciasDe(DB.exp[i]);
    for(var j=0;j<o.length;j++)out.push(o[j]);
  }
  return out;
}
function compraDe(o){
  var id=o.oid||o.id;
  for(var i=0;i<DB.exp.length;i++)if(DB.exp[i].id===id)return DB.exp[i];
  return null;
}
/* rótulo curto "3/6", vazio quando é à vista */
function seloParc(o){return (o&&o.pn>1)?(o.pi+'/'+o.pn):'';}
/* o que ainda vai vencer depois do mês mk */
function comprometido(mk){
  var por={},tot=0,n=0,compras={},ult=null;
  ocorrencias().forEach(function(o){
    if(o.pn<2)return;
    /* Este bloco é dívida assumida. Uma venda parcelada a receber é o oposto
       disso, então entrada nunca entra aqui — nem parcelada. */
    if(eEntrada(o.cat))return;
    var m=mkey(o.d);
    if(m<=mk)return;
    por[m]=(por[m]||0)+o.v;tot+=o.v;n++;compras[o.oid]=1;
    if(!ult||m>ult)ult=m;
  });
  var meses=Object.keys(por).sort().map(function(m){return {m:m,v:por[m]};});
  return {tot:tot,n:n,compras:Object.keys(compras).length,ate:ult,meses:meses};
}

/* ============================================================
   RECORRÊNCIAS
   Um molde NÃO é uma despesa: ele é previsão. Só vira lançamento
   quando você confirma, e só então entra em qualquer soma.
   Por isso nada aqui se parece com ocorrenciasDe(): parcela é fato
   consumado, recorrência é aposta sobre um mês que talvez nem venha.
   ============================================================ */
function rec(id){
  var L=DB.rec||[];
  for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];
  return null;
}
/* Data da competência: o dia do molde, preso ao último dia do mês curto. */
function dataComp(r,comp){
  var dia=Math.max(1,Math.min(31,parseInt(r.dia,10)||1));
  var ult=new Date(+comp.slice(0,4),+comp.slice(5,7),0).getDate();
  return comp+'-'+String(Math.min(dia,ult)).padStart(2,'0');
}
/* Competências que este molde produz: de `inicio` até o MÊS ATUAL, nunca além.
   Anual só no mês configurado. Nunca mais que MAXRETRO meses para trás. */
function compsDe(r){
  var out=[],ate=mkey(hoje());
  var piso=addMes(ate,-(MAXRETRO-1));
  var m=r.inicio||ate;
  if(m<piso)m=piso;
  if(r.ate&&r.ate<ate)ate=r.ate;
  var mesAnual=Math.max(1,Math.min(12,parseInt(r.mes,10)||1));
  var guarda=0;
  while(m<=ate&&guarda++<MAXRETRO+2){
    if(r.freq!=='anual'||(+m.slice(5,7))===mesAnual)out.push(m);
    m=addMes(m,1);
  }
  return out;
}
/* Para um molde variável, a melhor estimativa é o ÚLTIMO mês confirmado —
   não o valor do molde, que envelhece na primeira conta de luz. */
function valorSugerido(r){
  if(r.fixo!==false)return r.v;
  var ultimo=null;
  for(var i=0;i<DB.exp.length;i++){
    var e=DB.exp[i];
    if(e.rec!==r.id||!e.comp)continue;
    if(!ultimo||e.comp>ultimo.comp)ultimo=e;
  }
  return ultimo?ultimo.v:r.v;
}
/* A regra que decide tudo: está pendente quando NÃO existe lançamento com
   aquele molde e aquela competência, e ela não foi pulada. Sem mapa de
   controle — é isso que faz "excluí para refazer" funcionar de graça. */
function pendentes(){
  var out=[],L=DB.rec||[];
  for(var i=0;i<L.length;i++){
    var r=L[i],pul=r.pulados||[],feitos={};
    for(var k=0;k<DB.exp.length;k++){
      var e=DB.exp[k];
      if(e.rec===r.id&&e.comp)feitos[e.comp]=1;
    }
    var cs=compsDe(r);
    for(var j=0;j<cs.length;j++){
      var c=cs[j];
      if(feitos[c]||pul.indexOf(c)>=0)continue;
      out.push({rec:r.id,comp:c,d:dataComp(r,c),n:r.n,cat:r.cat,sub:r.sub,
                fixo:r.fixo!==false,v:valorSugerido(r),pay:r.pay||null,desc:r.desc||''});
    }
  }
  out.sort(function(a,b){return a.comp<b.comp?-1:(a.comp>b.comp?1:(a.n<b.n?-1:1));});
  return out;
}
/* quantos lançamentos já confirmados vieram deste molde */
function confirmadosDe(id){
  var n=0;
  for(var i=0;i<DB.exp.length;i++)if(DB.exp[i].rec===id&&DB.exp[i].comp)n++;
  return n;
}
function pularComp(r,comp){
  r.pulados=r.pulados||[];
  if(r.pulados.indexOf(comp)<0)r.pulados.push(comp);
  r.pulados.sort();
}
function reativarComp(r,comp){
  r.pulados=(r.pulados||[]).filter(function(c){return c!==comp;});
}

/* tinta legível sobre uma cor qualquer (serve para cores criadas por você) */
function lum(hex){
  var h=hex.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var f=function(v){v=parseInt(v,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(h.slice(0,2))+.7152*f(h.slice(2,4))+.0722*f(h.slice(4,6));
}
function tinta(hex){try{return lum(hex)>.30?'#101319':'#FFFFFF';}catch(e){return '#FFFFFF';}}

/* ---------------- armazenamento ---------------- */
var DB=null;
var avisoGravacao=false;

function novoDB(){
  return {
    v:SCHEMA,
    cats:SEED.map(function(c){
      return {id:c.id,n:c.n,e:c.e,c:c.c,arq:false,tipo:c.tipo||null,
        subs:c.subs.map(function(s){return {id:s.id,n:s.n,e:s.e,arq:false};})};
    }),
    ordem:SEED.map(function(c){return c.id;}),
    exp:[],
    rec:[],
    prefs:{tema:'auto',dens:'auto',ultBackup:null,inicio:hoje(),topSubs:{},bannerOff:null}
  };
}
function carregar(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){raw=null;}
  if(!raw){DB=novoDB();salvar();return;}
  try{
    var d=JSON.parse(raw);
    var antes=d.v||1;
    DB=migrar(d);
    /* grava a subida de formato na hora: se ficasse só em memória, um backup
       exportado depois sairia carimbado com o formato velho. */
    if(DB.v!==antes)salvar();
  }catch(e){
    DB=novoDB();
  }
}
function migrar(d){
  if(!d||typeof d!=='object')return novoDB();
  if(!d.v)d.v=SCHEMA;
  /* formato 1 -> 2: nada a converter. Lançamento sem `par` é à vista,
     que é exatamente como o formato 1 gravava tudo. */
  if(d.v<SCHEMA)d.v=SCHEMA;
  d.cats=d.cats||[];d.exp=d.exp||[];d.prefs=d.prefs||{};
  /* formato 2 -> 3: só cria a coleção de moldes. Nenhum lançamento é tocado. */
  d.rec=d.rec||[];
  /* formato 3 -> 4: entradas. Nada a converter — categoria sem `tipo` é saída,
     que é exatamente o que toda categoria gravada até aqui significa. Nenhum
     lançamento é lido, nenhum valor é reescrito. */
  d.ordem=d.ordem||d.cats.map(function(c){return c.id;});
  /* garante que a ordem cobre todas as categorias e só elas */
  var ids=d.cats.map(function(c){return c.id;});
  d.ordem=d.ordem.filter(function(id){return ids.indexOf(id)>=0;});
  ids.forEach(function(id){if(d.ordem.indexOf(id)<0)d.ordem.push(id);});
  var p=d.prefs;
  if(!p.tema)p.tema='auto';
  if(!p.dens)p.dens='auto';
  if(p.ultBackup===undefined)p.ultBackup=null;
  if(!p.inicio)p.inicio=hoje();
  if(!p.topSubs)p.topSubs={};
  return d;
}
function salvar(){
  try{
    localStorage.setItem(KEY,JSON.stringify(DB));
    avisoGravacao=false;
    return true;
  }catch(e){
    /* nunca falhar em silêncio: achar que salvou e não ter salvo é pior que o erro */
    if(!avisoGravacao){
      avisoGravacao=true;
      alerta('Não foi possível salvar','O armazenamento do navegador recusou a gravação. Pode ser cota cheia ou navegação privada. Exporte um backup agora e verifique — o que está na tela ainda não foi gravado.');
    }
    return false;
  }
}

/* ---------------- acessores ---------------- */
function cat(id){for(var i=0;i<DB.cats.length;i++)if(DB.cats[i].id===id)return DB.cats[i];return null;}
function sub(c,id){if(!c)return null;for(var i=0;i<c.subs.length;i++)if(c.subs[i].id===id)return c.subs[i];return null;}

/* ---------------- lado: entrada ou saída ----------------
   O lado mora na CATEGORIA, nunca no lançamento. Categoria sem `tipo` é saída,
   e é isso que faz base antiga continuar valendo sem migrar um byte.
   Cada lado soma o seu; a subtração acontece uma vez só, no fim. Nenhum lugar
   do código inverte sinal. */
function eEntrada(id){var c=cat(id);return !!(c&&c.tipo==='e');}
function saidasDe(l){return l.filter(function(o){return !eEntrada(o.cat);});}
function entradasDe(l){return l.filter(function(o){return eEntrada(o.cat);});}
function somaDe(l){return l.reduce(function(a,b){return a+b.v;},0);}
function saldoDe(l){return somaDe(entradasDe(l))-somaDe(saidasDe(l));}
function temEntrada(l){for(var i=0;i<l.length;i++)if(eEntrada(l[i].cat))return true;return false;}
/* valor com sinal para exibição: "− 300,00", "+ 8.900,00".
   O sinal vem do VALOR, nunca do lado — senão um mês em que os estornos superam
   as compras imprime "− -250,00", que foi exatamente o defeito que o teste
   do filtro de lado pegou. */
function brlSin(v,mais){return (v<0?'− ':(mais?'+ ':''))+brl(Math.abs(v));}
function brlSinRS(v){return (v<0?'− R$ ':'+ R$ ')+brl(Math.abs(v));}
function catsOrdenadas(incluirArq){
  return DB.ordem.map(cat).filter(function(c){return c&&(incluirArq||!c.arq);});
}
function subsAtivas(c){return c?c.subs.filter(function(s){return !s.arq;}):[];}
function nomeCat(id){var c=cat(id);return c?c.n:'—';}
function nomeSub(cid,sid){var c=cat(cid);var s=sub(c,sid);return s?s.n:(c?c.n:'—');}
function emojiSub(cid,sid){var c=cat(cid);var s=sub(c,sid);return s?s.e:(c?c.e:'❓');}
function corCat(id){var c=cat(id);return c?c.c:'#78716C';}

/* ---------------- densidade ---------------- */
function densAtual(){
  if(DB.prefs.dens&&DENS[DB.prefs.dens])return DENS[DB.prefs.dens];
  return DENS[densAuto()];
}
function densAuto(){
  var m=document.getElementById('main');
  var h=(m&&m.clientHeight)||window.innerHeight-170;
  /* alvo: cartão em torno de 180 px de altura. Num iPhone padrão isso dá
     Equilibrado; num SE, Amplo; num Pro Max, Compacto. */
  var r=Math.round(h/180);
  r=Math.max(3,Math.min(5,r));
  return '2x'+r;
}
/* regra: se tudo cabe, não existe card de lista */
function layout(total){
  var G=densAtual(),vagas=G.c*G.r;
  if(total<=vagas)return {c:G.c,r:G.r,vagas:vagas,mostra:total,card:false};
  return {c:G.c,r:G.r,vagas:vagas,mostra:vagas-1,card:true};
}

/* ---------------- ranking de sub-categorias ---------------- */
function scoreSubs(c){
  var lim=new Date();lim.setDate(lim.getDate()-90);var limS=ymd(lim);
  var sc={};
  c.subs.forEach(function(s){sc[s.id]=0;});
  DB.exp.forEach(function(e){
    if(e.cat!==c.id)return;
    if(sc[e.sub]===undefined)return;
    sc[e.sub]+=(e.d>=limS?3:1);
  });
  return sc;
}
/* histerese: quem já está entre os visíveis só perde o lugar quando é
   de fato ultrapassado — a grade não pode dançar a cada registro */
function topSubs(c,n){
  var ativos=subsAtivas(c);
  if(ativos.length<=n)return ativos;
  var sc=scoreSubs(c);
  var idx={};ativos.forEach(function(s,i){idx[s.id]=i;});
  var prev=(DB.prefs.topSubs[c.id]||[]).filter(function(id){return idx[id]!==undefined;}).slice(0,n);
  var slots=prev.slice();
  var fora=ativos.filter(function(s){return slots.indexOf(s.id)<0;})
                 .sort(function(a,b){return (sc[b.id]-sc[a.id])||(idx[a.id]-idx[b.id]);});
  var k=0;
  while(slots.length<n&&k<fora.length)slots.push(fora[k++].id);
  for(;k<fora.length;k++){
    var ch=fora[k],pior=-1,piorSc=Infinity;
    for(var i=0;i<slots.length;i++){if(sc[slots[i]]<piorSc){piorSc=sc[slots[i]];pior=i;}}
    if(pior>=0&&sc[ch.id]>piorSc)slots[pior]=ch.id;else break;
  }
  DB.prefs.topSubs[c.id]=slots;
  return slots.map(function(id){return ativos[idx[id]];});
}

function filtrados(){
  /* lê OCORRÊNCIAS, não lançamentos: uma compra em 6× aparece no mês de cada
     parcela. À vista a ocorrência é o próprio lançamento, então nada muda. */
  var out=ocorrencias();
  if(S.periodo==='mes')out=out.filter(function(e){return mkey(e.d)===S.mesLista;});
  else if(S.periodo==='ano')out=out.filter(function(e){return e.d.slice(0,4)===S.mesLista.slice(0,4);});
  if(S.fLado==='saida')out=saidasDe(out);
  else if(S.fLado==='entrada')out=entradasDe(out);
  if(S.fCat)out=out.filter(function(e){return e.cat===S.fCat;});
  if(S.fSub)out=out.filter(function(e){return e.sub===S.fSub;});
  if(S.fPay)out=out.filter(function(e){return e.pay===S.fPay;});
  if(S.fMin!=null)out=out.filter(function(e){return e.v>=S.fMin;});
  if(S.fMax!=null)out=out.filter(function(e){return e.v<=S.fMax;});
  if(S.fBusca){
    var q=S.fBusca.toLowerCase();
    out=out.filter(function(e){
      return (e.desc||'').toLowerCase().indexOf(q)>=0
        ||nomeSub(e.cat,e.sub).toLowerCase().indexOf(q)>=0
        ||nomeCat(e.cat).toLowerCase().indexOf(q)>=0;
    });
  }
  if(S.ordena==='valor')out.sort(function(a,b){return b.v-a.v;});
  else if(S.ordena==='cat')out.sort(function(a,b){
    var d=nomeCat(a.cat).localeCompare(nomeCat(b.cat),'pt-BR');
    return d||(b.d<a.d?-1:1);});
  else out.sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:b.ts-a.ts);});
  return out;
}
function filtrosAtivos(){return !!(S.fSub||S.fPay||S.fMin!=null||S.fMax!=null);}

/* A base só ganha o seletor de lado quando existe lançamento de entrada. Sem

function baseTemEntrada(){
  for(var i=0;i<DB.exp.length;i++)if(eEntrada(DB.exp[i].cat))return true;
  return false;
}
/* Quando a lista mistura os dois lados, "total" vira SALDO e a média deixa de
   fazer sentido — soma de coisas de sinais opostos dividida por contagem não
   diz nada. No lugar dela vão os dois lados em separado. */
function resumoLista(vis){
  if(!temEntrada(vis)){
    var t=somaDe(vis);
    return {v:'R$ '+brl(t),
            c:vis.length+(vis.length===1?' lançamento':' lançamentos')+'<br>média R$ '+
              brl(vis.length?Math.round(t/vis.length):0)};
  }
  var e=somaDe(entradasDe(vis)),sa=somaDe(saidasDe(vis)),sal=e-sa;
  return {v:(sal<0?'− R$ ':'R$ ')+brl(Math.abs(sal)),
          c:vis.length+(vis.length===1?' lançamento':' lançamentos')+
            '<br>'+brlSin(e,true)+' · '+brlSin(-sa,true)};
}
function totalLinha(itens){
  if(!temEntrada(itens))return 'R$ '+brl(somaDe(itens));
  var v=saldoDe(itens);
  return (v<0?'− R$ ':'R$ ')+brl(Math.abs(v));
}

function linhas(itens,comData){
  var w=el('<div class="optwrap"></div>');
  itens.forEach(function(e){
    var c=cat(e.cat)||{c:'#78716C',n:'—'};
    var meta=[];
    /* Numa parcela a segunda linha é curta de propósito e começa pelo que
       importa: o total e o prazo da compra. Sem isso é fácil ler R$ 80 de
       parcela como uma compra de R$ 80 — e o espaço é pouco, então o nome
       da categoria sai (o emoji e a cor já a identificam). */
    if(e.pn>1){
      meta.push(e.pn+'× de R$ '+brl(e.vt),'compra '+(+e.dc.slice(8))+' '+MESC[+e.dc.slice(5,7)-1]);
      if(comData)meta.push(diaLabel(e.d));
    }else{
      meta.push(c.n);
      if(comData)meta.push(diaLabel(e.d));
      if(e.pay)meta.push(e.pay);
    }
    var ent=eEntrada(e.cat);
    /* O sinal já grita, mas "− 300,00" verde numa lista de entradas verdes se
       confunde. A etiqueta no subtítulo é o que separa estorno de entrada. */
    if(!ent&&e.v<0)meta.push('estorno');
    if(e.desc)meta.push(e.desc);
    var selo=seloParc(e);
    var box=el('<div class="swipe"><div class="del">Excluir</div></div>');
    var r=el('<button class="erow" style="--c:'+c.c+'"><span class="ic">'+emojiSub(e.cat,e.sub)+'</span>'+
      '<span class="tx"><span class="t1">'+esc(nomeSub(e.cat,e.sub))+
        (selo?'<span class="pbadge">'+selo+'</span>':'')+'</span>'+
        '<span class="t2">'+esc(meta.join(' · '))+'</span></span>'+
      '<span class="vl tnum '+(ent?'vin':(e.v<0?'vneg':''))+'">'+brlSin(e.v,ent)+'</span></button>');
    box.querySelector('.del').onclick=function(){excluirLancamento(e);};
    box.appendChild(r);
    arrastarParaExcluir(box,r,function(){acoesLancamento(e);},function(){excluirLancamento(e);});
    w.appendChild(box);
  });
  return w;
}
/* Deslizar para a esquerda: até o meio do caminho revela o botão Excluir;
   passando do limiar, soltar exclui direto — como nas listas do iOS.
   Só engata em gesto horizontal, para não brigar com a rolagem vertical. */
function arrastarParaExcluir(box,row,aoTocar,aoExcluir){
  var ABRE=-88, ARMA=-165, MAX=-250;
  var x0=0,y0=0,dx=0,ativo=false,eixo=null,aberto=false,moveu=false,armado=false;
  var rot=box.querySelector('.del');
  function pos(v){row.style.transform='translateX('+v+'px)';}
  function armar(on){
    if(on===armado)return;
    armado=on;
    box.classList.toggle('armado',on);
    rot.textContent=on?'Soltar para excluir':'Excluir';
  }
  row.addEventListener('pointerdown',function(ev){
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    x0=ev.clientX;y0=ev.clientY;ativo=true;eixo=null;moveu=false;dx=aberto?ABRE:0;
  });
  row.addEventListener('pointermove',function(ev){
    if(!ativo)return;
    var ax=ev.clientX-x0,ay=ev.clientY-y0;
    if(!eixo){
      if(Math.abs(ax)<7&&Math.abs(ay)<7)return;
      eixo=Math.abs(ax)>Math.abs(ay)?'x':'y';
      if(eixo==='x'){try{row.setPointerCapture(ev.pointerId);}catch(err){}}
    }
    if(eixo!=='x')return;
    moveu=true;
    dx=Math.max(MAX,Math.min(0,ax+(aberto?ABRE:0)));
    row.style.transition='none';pos(dx);
    armar(dx<=ARMA);
  });
  function fim(){
    if(!ativo)return;ativo=false;
    row.style.transition='';
    if(eixo==='x'){
      if(dx<=ARMA){ pos(-row.offsetWidth); armar(false); aoExcluir(); eixo=null; return; }
      aberto=dx<-44;pos(aberto?ABRE:0);
    }
    armar(false);
    eixo=null;
  }
  row.addEventListener('pointerup',fim);
  row.addEventListener('pointercancel',fim);
  row.addEventListener('click',function(ev){
    if(moveu){ev.preventDefault();return;}
    if(aberto){aberto=false;pos(0);return;}
    aoTocar();
  });
}

function telaResumo(){
  var s=el('<section class="screen"></section>');
  var mk=S.mesSum;
  /* "Gasto em setembro" = o que VENCE em setembro. Uma parcela conta no mês
     dela, não no mês da compra. É a leitura de caixa. */
  var todas=ocorrencias();
  var noMes=todas.filter(function(e){return mkey(e.d)===mk;});
  /* A partir daqui TUDO que já existia continua lendo `doMes`, que agora é só
     saídas. É essa linha que garante o contrato da v11: o "Gasto em <mês>", a
     comparação, a média, a projeção, o ticket e o ranking nunca veem entrada. */
  var doMes=saidasDe(noMes);
  var entMes=entradasDe(noMes);
  var tot=somaDe(doMes);
  var totEnt=somaDe(entMes);
  var ant=addMes(mk,-1);
  var totAnt=somaDe(saidasDe(todas.filter(function(e){return mkey(e.d)===ant;})));

  var pb=el('<div class="topbar"><div class="periodbar"><button class="pb">'+ICO.esq+'</button>'+
    '<div class="lbl">'+mesLabel(mk)+'</div><button class="pb">'+ICO.dir+'</button></div></div>');
  var bb=pb.querySelectorAll('.pb');
  bb[0].onclick=function(){S.mesSum=addMes(mk,-1);render();};
  bb[1].onclick=function(){S.mesSum=addMes(mk,1);render();};
  s.appendChild(pb);

  /* A faixa vem ANTES do estado vazio: quem acabou de criar os moldes e ainda
     não lançou nada é justamente quem mais precisa ver a cobrança. */
  if(!DB.exp.length){
    var sc0=el('<div class="scroll"></div>');
    var br0=bannerRecorrentes();
    if(br0){br0.style.margin='0 0 12px';sc0.appendChild(br0);}
    sc0.appendChild(vazio('Nenhum lançamento encontrado',
      'Se você já usou o app neste aparelho, o armazenamento pode ter sido limpo. Restaure um backup antes de começar de novo.',
      'Restaurar backup',function(){S.aba='cfg';render();setTimeout(restaurarJSON,120);},true));
    s.appendChild(sc0);return s;
  }

  var sc=el('<div class="scroll"></div>');
  var br=bannerRecorrentes();
  if(br){br.style.margin='0 0 12px';sc.appendChild(br);}
  var b=bannerFechamento();
  if(b){b.style.margin='0 0 12px';sc.appendChild(b);}

  /* O bloco de saldo só existe quando houve entrada no mês. Sem entrada, esta
     tela fica byte a byte como era antes da v11 — que é o combinado. */
  if(entMes.length){
    var sal=totEnt-tot;
    sc.appendChild(el('<div class="saldo">'+
      '<div class="lin"><span class="lb">Entradas</span><span class="vv vin tnum">'+brlSinRS(totEnt)+'</span></div>'+
      '<div class="lin"><span class="lb">Saídas</span><span class="vv tnum">'+brlSinRS(-tot)+'</span></div>'+
      '<div class="lin tot"><span class="lb">Saldo de '+mesLabel(mk).split(' de ')[0]+'</span>'+
      '<span class="vv tnum '+(sal<0?'vneg':'vin')+'">'+brlSin(sal)+'</span></div></div>'));
  }

  if(!doMes.length){
    sc.appendChild(vazio('Sem despesas em '+mesLabel(mk).split(' de ')[0],
      entMes.length?'Houve entrada neste mês, mas nenhuma saída.':'Nada foi lançado neste mês.',
      'Ir para hoje',function(){S.mesSum=mkey(hoje());render();}));
    s.appendChild(sc);return s;
  }

  var eMesAtual=(mk===mkey(hoje()));
  var diasCorridos=eMesAtual?(+hoje().slice(8)):diasNoMes(mk);
  var media=Math.round(tot/Math.max(1,diasCorridos));
  var proj=eMesAtual?media*diasNoMes(mk):tot;

  var cls='flat',arw='',txt='sem mês anterior para comparar';
  if(totAnt>0){
    var p=(tot-totAnt)/totAnt*100;
    cls=p>=0.05?'up':(p<=-0.05?'down':'flat');
    arw=p>=0.05?'▲':(p<=-0.05?'▼':'≈');
    txt=Math.abs(p).toFixed(1).replace('.',',')+'% vs. '+mesCurto(ant)+' (R$ '+brl(totAnt)+')';
  }
  sc.appendChild(el('<div class="hero"><div class="k">Gasto em '+mesLabel(mk).split(' de ')[0]+
    (eMesAtual?(' · '+diasCorridos+(diasCorridos===1?' dia':' dias')):'')+'</div>'+
    '<div class="big tnum">R$ '+brl(tot)+'</div>'+
    '<div class="delta '+cls+'"><span>'+arw+'</span>'+esc(txt)+'</div></div>'));

  sc.appendChild(el('<div class="tiles">'+
    '<div class="tile"><div class="k">Média diária</div><div class="v tnum">R$ '+brl(media)+'</div></div>'+
    '<div class="tile"><div class="k">'+(eMesAtual?'Projeção do mês':'Total do mês')+'</div><div class="v tnum">R$ '+brl(proj)+'</div></div>'+
    '<div class="tile"><div class="k">Lançamentos</div><div class="v tnum">'+doMes.length+'</div></div>'+
    '<div class="tile"><div class="k">Ticket médio</div><div class="v tnum">R$ '+brl(Math.round(tot/doMes.length))+'</div></div></div>'));

  /* Sem este bloco o parcelamento faria o mês parecer menor sem dizer para
     onde o resto foi. Só aparece quando existe parcela futura. */
  var cmp=comprometido(mk);
  if(cmp.tot>0){
    var mx=cmp.meses.reduce(function(a,m){return Math.max(a,m.v);},1);
    var sp=cmp.meses.slice(0,6).map(function(m){
      return '<span class="cbar"><i style="height:'+Math.round(6+m.v/mx*30)+'px"></i>'+
             '<em>'+MESC[+m.m.slice(5,7)-1]+'</em></span>';
    }).join('');
    sc.appendChild(el('<div class="compr"><div class="k">Comprometido à frente</div>'+
      '<div class="v tnum">R$ '+brl(cmp.tot)+'</div>'+
      '<div class="s">'+cmp.n+(cmp.n===1?' parcela':' parcelas')+' de '+cmp.compras+
        (cmp.compras===1?' compra':' compras')+' · até '+mesCurto(cmp.ate)+'</div>'+
      '<div class="cbars">'+sp+'</div></div>'));
  }

  sc.appendChild(el('<div class="glabel">Por categoria</div>'));
  var agg={};doMes.forEach(function(e){agg[e.cat]=(agg[e.cat]||0)+e.v;});
  var rank=Object.keys(agg).map(function(k){return {id:k,v:agg[k]};}).sort(function(a,b){return b.v-a.v;});
  var max=rank[0].v;
  var bars=el('<div class="bars"></div>');
  rank.forEach(function(r){
    var c=cat(r.id)||{e:'❓',n:'—',c:'#78716C'};
    var pc=(r.v/tot*100);
    var b2=el('<button class="barrow" style="--c:'+c.c+'">'+
      '<span class="bn"><span>'+c.e+'</span><em>'+esc(c.n)+'</em></span>'+
      '<span class="bv tnum">R$ '+brl(r.v)+'</span>'+
      '<span class="track"><span class="fill" style="width:'+(r.v/max*100).toFixed(2)+'%"></span></span>'+
      '<span class="bp tnum">'+pc.toFixed(1).replace('.',',')+'% do mês</span></button>');
    b2.onclick=function(){folhaDetalheCat(r.id,mk);};
    bars.appendChild(b2);
  });
  sc.appendChild(bars);

  /* Bloco próprio, e de propósito NÃO é o mesmo do ranking: misturar os dois
     faria o Salário virar a maior "saída" do mês. */
  if(entMes.length){
    var agE={};entMes.forEach(function(e){agE[e.cat]=(agE[e.cat]||0)+e.v;});
    var rkE=Object.keys(agE).map(function(k){return {id:k,v:agE[k]};})
      .sort(function(a,b){return b.v-a.v;});
    sc.appendChild(el('<div class="glabel">Entradas por categoria</div>'));
    var we=el('<div class="optwrap"></div>');
    rkE.forEach(function(r){
      var ce=cat(r.id)||{e:'❓',n:'—'};
      var row=el('<div class="msk"><span class="mn">'+ce.e+' '+esc(ce.n)+'</span>'+
        '<span class="mr tnum '+(r.v<0?'vneg':'vin')+'">'+brlSin(r.v,true)+'</span></div>');
      we.appendChild(row);
    });
    sc.appendChild(we);
  }

  s.appendChild(sc);
  return s;
}

  if(btxt){var b=el('<button class="eb">'+esc(btxt)+'</button>');b.onclick=fn;e.appendChild(b);}

/* ---------------- camadas: folhas, toast, alerta ---------------- */
var layers=document.getElementById('layers');
var toastTimer=null;

function fecharFolhas(){
  Array.prototype.slice.call(layers.querySelectorAll('.scrim,.sheet')).forEach(function(n){n.remove();});
}
function folha(titulo,montar,opts){
  opts=opts||{};
  var scrim=el('<div class="scrim"></div>');
  scrim.onclick=function(){if(!opts.fixa)fecharFolhas();};
  var sh=el('<div class="sheet"><div class="sheet-h">'+
    '<button class="sa">'+(opts.cancelar||'Cancelar')+'</button>'+
    '<div class="st">'+esc(titulo)+'</div>'+
    '<span class="sa right"></span></div><div class="sheet-b"></div></div>');
  sh.querySelector('.sa').onclick=function(){fecharFolhas();if(opts.aoFechar)opts.aoFechar();};
  if(opts.acao){
    var a=el('<button class="sa right strong">'+esc(opts.acao)+'</button>');
    a.onclick=function(){opts.aoAgir(sh);};
    sh.querySelector('.sheet-h').replaceChild(a,sh.querySelector('.sa.right'));
  }
  montar(sh.querySelector('.sheet-b'),sh);
  layers.appendChild(scrim);layers.appendChild(sh);
  return sh;
}
function toast(t,s,btxt,fn){
  var old=document.getElementById('toast');if(old)old.remove();
  if(toastTimer)clearTimeout(toastTimer);
  var n=el('<div id="toast"><div><div class="tt">'+esc(t)+'</div><div class="ts">'+esc(s)+'</div></div></div>');
  if(btxt){
    var b=el('<button class="tu">'+esc(btxt)+'</button>');
    b.onclick=function(){n.remove();fn();};
    n.appendChild(b);
  }
  layers.appendChild(n);
  toastTimer=setTimeout(function(){if(n.parentNode)n.remove();},5000);
}
function alerta(titulo,msg){
  folha(titulo,function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+esc(msg)+'</div>'));
    var ok=el('<button class="btnfull">Entendi</button>');
    ok.onclick=fecharFolhas;b.appendChild(ok);
  },{cancelar:'Fechar'});
}
function confirmar2(titulo,msg,rotulo,perigo,fn){
  folha(titulo,function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+esc(msg)+'</div>'));
    var ok=el('<button class="btnfull'+(perigo?' dan':'')+'">'+esc(rotulo)+'</button>');
    ok.onclick=function(){fecharFolhas();fn();};
    b.appendChild(ok);
    var no=el('<button class="btnfull sec">Cancelar</button>');
    no.onclick=fecharFolhas;b.appendChild(no);

}

function listaOpcoes(itens,ocultosAte,onPick,corDe,rodape){
  var wrap=el('<div class="optwrap"></div>');
  itens.forEach(function(it,i){
    var naTela=i<ocultosAte;
    var o=el('<button class="opt" data-n="'+esc(String(it.n).toLowerCase())+'" data-natela="'+(naTela?1:0)+'" style="--c:'+corDe(it)+'">'+
      '<span class="ic">'+it.e+'</span><span class="nm">'+esc(it.n)+'</span>'+
      (naTela?'<span class="tag">já na tela</span>':'<span></span>')+'</button>');

    o.onclick=function(){fecharFolhas();onPick(it);};
    wrap.appendChild(o);

  if(rodape)wrap.appendChild(rodape);

function ligarBusca(input,wrap){
  input.addEventListener('input',function(){
    var q=input.value.toLowerCase().trim();
    Array.prototype.slice.call(wrap.querySelectorAll('.opt')).forEach(function(o){
      if(o.dataset.natela===undefined)return;
      o.hidden=q?(o.dataset.n.indexOf(q)<0):(o.dataset.natela==='1');
    });

}

/* ============================================================
   RECORRÊNCIAS — faixa, revisão, moldes
   ============================================================ */
function bannerRecorrentes(){
  var ps=pendentes();
  if(!ps.length)return null;
  var tot=ps.reduce(function(a,x){return a+x.v;},0);
  var nomes=[];
  ps.forEach(function(x){if(nomes.indexOf(x.n)<0&&nomes.length<3)nomes.push(x.n);});
  var lista=nomes.join(', ');
  if(ps.length>nomes.length)lista+=' e outras';
  var meses=[];ps.forEach(function(x){if(meses.indexOf(x.comp)<0)meses.push(x.comp);});
  var quando=meses.length===1?mesLabel(meses[0]).split(' de ')[0]
            :(meses.length+' meses');
  var b=el('<div class="banner"><div><div class="bt">'+ps.length+
    (ps.length===1?' recorrente a confirmar':' recorrentes a confirmar')+'</div>'+
    '<div class="bs">'+esc(lista)+' · '+esc(quando)+' · R$ '+brl(tot)+'</div></div>'+
    '<button class="ba">Revisar</button></div>');
  b.querySelector('.ba').onclick=folhaRevisao;
  return b;
}

/* Nada é gravado até o botão de baixo. Desmarcar deixa pendente para a próxima
   vez; Pular é definitivo (e desfazível no detalhe do molde). */
function folhaRevisao(){
  var ps=pendentes();
  if(!ps.length){alerta('Nada a confirmar','Nenhuma recorrência está pendente agora.');return;}
  var estado=ps.map(function(x){return {p:x,on:true,v:x.v};});
  folha('A confirmar',function(b,sh){
    var btn=el('<button class="btnfull"></button>');
    function atualizar(){
      var sel=estado.filter(function(x){return x.on;});
      var tot=sel.reduce(function(a,x){return a+x.v;},0);
      btn.textContent=sel.length?('Confirmar '+sel.length+(sel.length===1?' lançamento · R$ ':' lançamentos · R$ ')+brl(tot))
                                :'Nada selecionado';
      btn.disabled=!sel.length;
    }
    var mesAtual=null,wrap=null;
    estado.forEach(function(st,i){
      var x=st.p;
      if(x.comp!==mesAtual){
        mesAtual=x.comp;
        b.appendChild(el('<div class="glabel"'+(i===0?' style="margin-top:0"':'')+'>'+
          mesLabel(x.comp)+'</div>'));
        wrap=el('<div class="optwrap"></div>');b.appendChild(wrap);
      }
      var c=cat(x.cat)||{c:'#78716C',n:'—',e:'❓'};
      var r=rec(x.rec)||{};
      var sub=nomeCat(x.cat)+' · dia '+(+x.d.slice(8))+' · '+(x.fixo?'fixo':'variável');
      var linha=el('<div class="rrev" style="--c:'+c.c+'" aria-pressed="true">'+
        '<span class="ic">'+emojiSub(x.cat,x.sub)+'</span>'+
        '<span><span class="nm">'+esc(x.n)+'</span><span class="sb">'+esc(sub)+'</span></span>'+
        '<span class="vcel"></span><span class="ck">✓</span></div>');
      var cel=linha.querySelector('.vcel');
      if(x.fixo){
        cel.outerHTML='<span class="vl tnum">'+brl(st.v)+'</span>';
      }else{
        var inp=el('<input class="vin" inputmode="decimal" value="'+brl(st.v)+'">');
        inp.addEventListener('input',function(){
          var v=lerValor(inp.value);st.v=v||0;atualizar();
        });
        inp.onclick=function(ev){ev.stopPropagation();};
        cel.replaceWith(inp);
      }
      linha.onclick=function(ev){
        if(ev.target&&ev.target.classList&&ev.target.classList.contains('vin'))return;
        st.on=!st.on;linha.setAttribute('aria-pressed',st.on?'true':'false');
        if(st.sk)st.sk.hidden=st.on;
        atualizar();
      };
      wrap.appendChild(linha);
      var sk=el('<div class="skiprow" hidden><button class="dan">Pular este mês, e não perguntar mais</button></div>');
      sk.querySelector('button').onclick=function(){
        var r2=rec(x.rec);if(!r2)return;
        pularComp(r2,x.comp);
        if(!salvar()){reativarComp(r2,x.comp);return;}
        fecharFolhas();render();
        toast('Mês pulado',x.n+' · '+mesLabel(x.comp),'Desfazer',function(){
          reativarComp(r2,x.comp);salvar();render();});
      };
      wrap.appendChild(sk);
      st.sk=sk;
    });
    b.appendChild(el('<div class="hint">O valor sugerido para os variáveis é o do '+
      '<b>último mês confirmado</b>. Desmarcar uma linha deixa ela pendente para a próxima '+
      'vez — e revela a opção de <b>pular</b>, que é definitiva e só pode ser desfeita no '+
      'detalhe da recorrência.</div>'));
    btn.onclick=function(){
      var sel=estado.filter(function(x){return x.on&&x.v>0;});
      if(!sel.length)return;
      var criados=sel.map(function(st){
        return {id:uid('e'),d:st.p.d,cat:st.p.cat,sub:st.p.sub,v:st.v,
                pay:st.p.pay,desc:st.p.desc,ts:Date.now(),rec:st.p.rec,comp:st.p.comp};
      });
      criados.forEach(function(e){DB.exp.unshift(e);});
      if(!salvar()){
        var ids={};criados.forEach(function(e){ids[e.id]=1;});
        DB.exp=DB.exp.filter(function(e){return !ids[e.id];});
        return;
      }
      fecharFolhas();render();
      var tot=criados.reduce(function(a,e){return a+e.v;},0);
      toast(criados.length+(criados.length===1?' lançamento confirmado':' lançamentos confirmados'),
        'R$ '+brl(tot),'Desfazer',function(){

           dia:(base&&base.dia)||(+hoje().slice(8)),mes:+hoje().slice(5,7),ate:null};

    var fx=el('<div class="field"><span class="k">Valor</span><div class="seg" style="margin-top:6px"></div></div>');

      fx.querySelector('.seg').appendChild(x);

    var ff=el('<div class="field"><span class="k">Frequência</span><div class="seg" style="margin-top:6px"></div></div>');
    [['mensal','Mensal'],['anual','Anual']].forEach(function(o){
      var x=el('<button aria-pressed="'+(t.freq===o[0])+'">'+o[1]+'</button>');
      x.onclick=function(){t.freq=o[0];pinta();};

    MES.forEach(function(m,i){

    var fp=el('<div class="field"><span class="k">Pagamento</span><select><option value="">—</option></select></div>');
    PAGTOS.forEach(function(pg){
      var op=document.createElement('option');op.value=pg[0];op.textContent=pg[1]+' '+pg[0];
      if(((base&&base.pay)||(r&&r.pay))===pg[0])op.selected=true;
      fp.querySelector('select').appendChild(op);
    });
    var ft=el('<div class="field"><span class="k">Descrição</span><input type="text" maxlength="80" value="'+esc((r&&r.desc)||(base&&base.desc)||'')+'"></div>');

    function escolhaEmLinha(itens,corDe,onPick){
      sub2.innerHTML='';sub2.hidden=false;
      itens.forEach(function(it){
        var o=el('<button class="opt" style="--c:'+corDe(it)+'"><span class="ic">'+it.e+'</span><span class="nm">'+esc(it.n)+'</span><span></span></button>');
        o.onclick=function(){onPick(it);sub2.hidden=true;sub2.innerHTML='';pinta();};

    fs.onclick=function(){
      var c=cat(t.cat);if(!c||!c.subs.length)return;

    };
    function pinta(){
      fc.querySelector('.v').textContent=nomeCat(t.cat);

      if(!v){alerta('Valor inválido','Informe um valor de referência maior que zero.');return;}

           novo e você acabaria com a mesma despesa em dobro. */

        var ini=orig?mkey(orig.d):mkey(hoje());
        var r2={id:uid('r'),n:nome,cat:t.cat,sub:t.sub,v:v,fixo:t.fixo,freq:t.freq,
                dia:t.dia,mes:t.mes,inicio:ini,ate:null,
                pay:fp.querySelector('select').value||null,
                desc:ft.querySelector('input').value||'',pulados:[],ts:Date.now()};
        DB.rec=DB.rec||[];DB.rec.push(r2);
        var antesOrig=orig?{rec:orig.rec,comp:orig.comp}:null;
        if(orig){orig.rec=r2.id;orig.comp=mkey(orig.d);}
        if(!salvar()){
          DB.rec.pop();
          if(orig){orig.rec=antesOrig.rec;orig.comp=antesOrig.comp;}
          return;
        }
        fecharFolhas();render();
        toast('Recorrente criada',
          r2.n+' · '+resumoMolde(r2)+(orig?' · este lançamento virou a 1ª confirmação':''),
          'Desfazer',function(){
          DB.rec=DB.rec.filter(function(x){return x.id!==r2.id;});
          if(orig){
            if(antesOrig.rec===undefined)delete orig.rec;else orig.rec=antesOrig.rec;
            if(antesOrig.comp===undefined)delete orig.comp;else orig.comp=antesOrig.comp;
          }
          salvar();render();});
      }else{
        var antes=JSON.parse(JSON.stringify(r));
        r.n=nome;r.cat=t.cat;r.sub=t.sub;r.v=v;r.fixo=t.fixo;r.freq=t.freq;

          for(var k2 in antes)r[k2]=antes[k2];salvar();render();});

    if(!novo){

        esc(mesLabel(r.inicio||mkey(hoje())))+'. <b>'+conf+
        (conf===1?' lançamento confirmado':' lançamentos confirmados')+'</b>'+
        (pul.length?(', '+pul.length+(pul.length===1?' mês pulado':' meses pulados')):'')+'.</div>'));
      if(pul.length){
        b.appendChild(el('<div class="glabel">Meses pulados</div>'));

            '<span class="mr">Reativar</span></button>');

function folhaEncerrar(r){
  var mk=mkey(hoje());
  var abertas=pendentes().filter(function(x){return x.rec===r.id;}).length;
  var conf=confirmadosDe(r.id);
  folha('Encerrar '+r.n+'?',function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 12px">'+
      'Ele deixa de aparecer para confirmação a partir do mês escolhido.</div>'));
    var f=el('<div class="field"><span class="k">Encerrar a partir de</span><select></select></div>');
    var sel=f.querySelector('select');
    for(var i=-2;i<=6;i++){
      var m=addMes(mk,i);
      var op=document.createElement('option');op.value=m;op.textContent=mesLabel(m);
      if(i===0)op.selected=true;sel.appendChild(op);
    }
    b.appendChild(f);
    b.appendChild(el('<div class="hint" style="margin:8px 0 14px">Os <b>'+conf+
      (conf===1?' lançamento já confirmado continua':' lançamentos já confirmados continuam')+
      '</b> na sua lista, intocados.'+
      (abertas?('<br>Há <b>'+abertas+(abertas===1?' pendência não confirmada':' pendências não confirmadas')+
        '</b> — ela'+(abertas===1?'':'s')+' some'+(abertas===1?'':'m')+' junto.'):'')+'</div>'));
    var ok=el('<button class="btnfull">Encerrar</button>');
    ok.onclick=function(){
      var antes=r.ate;
      /* `ate` é a ÚLTIMA competência que ainda vale, então encerrar "a partir de
         novembro" grava outubro. */
      r.ate=addMes(sel.value,-1);
      if(!salvar()){r.ate=antes;return;}
      fecharFolhas();render();
      toast('Recorrente encerrada',r.n+' não cobra a partir de '+mesLabel(sel.value),'Desfazer',
        function(){r.ate=antes;salvar();render();});
    };
    b.appendChild(ok);
    var no=el('<button class="btnfull sec">Cancelar</button>');
    no.onclick=fecharFolhas;b.appendChild(no);
  });
}

function excluirMolde(r){

  folha('Excluir '+r.n+'?',function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+
      'Os <b>'+conf+(conf===1?' lançamento já confirmado continua':' lançamentos já confirmados continuam')+
      '</b> na sua lista. Some só o molde e as pendências ainda não confirmadas.<br><br>'+
      'Para uma recorrência que simplesmente acabou, <b>encerrar</b> é melhor: guarda a '+
      'configuração e o histórico, e dá para reativar.</div>'));
    var enc=el('<button class="btnfull sec">Encerrar em vez de excluir</button>');
    enc.onclick=function(){fecharFolhas();folhaEncerrar(r);};
    b.appendChild(enc);
    var ok=el('<button class="btnfull dan">Excluir a recorrência</button>');
    ok.onclick=function(){
      var i=DB.rec.indexOf(r);if(i<0)return;
      DB.rec.splice(i,1);
      if(!salvar()){DB.rec.splice(i,0,r);return;}
      fecharFolhas();render();
      toast('Recorrente excluída',conf?(conf+(conf===1?' lançamento mantido':' lançamentos mantidos')):'Nenhum lançamento afetado','Desfazer',
        function(){DB.rec.splice(i,0,r);salvar();render();});
    };

    var no=el('<button class="btnfull sec">Cancelar</button>');

  });

function lerValor(s){
  s=String(s||'').trim();if(!s)return null;
  s=s.replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.');
  var n=parseFloat(s);if(isNaN(n))return null;
  return Math.round(n*100);
}
function folhaDetalheCat(catId,mk){
  var c=cat(catId);
  var itens=ocorrencias().filter(function(e){return e.cat===catId&&mkey(e.d)===mk;});
  var tot=itens.reduce(function(a,b){return a+b.v;},0);
  var agg={};itens.forEach(function(e){var k=e.sub||'—';agg[k]=(agg[k]||0)+e.v;});
  var rank=Object.keys(agg).map(function(k){return {id:k,v:agg[k]};}).sort(function(a,b){return b.v-a.v;});
  var max=rank.length?rank[0].v:1;
  folha(c.n+' · '+mesLabel(mk).split(' de ')[0],function(b){
    b.appendChild(el('<div class="hero" style="margin-bottom:12px"><div class="k">Total da categoria</div>'+
      '<div class="big tnum">R$ '+brl(tot)+'</div></div>'));
    var bars=el('<div class="bars"></div>');
    rank.forEach(function(r){
      var s=sub(c,r.id);
      bars.appendChild(el('<div class="barrow" style="--c:'+c.c+'">'+
        '<span class="bn"><span>'+(s?s.e:'❓')+'</span><em>'+esc(s?s.n:'Sem sub-categoria')+'</em></span>'+
        '<span class="bv tnum">R$ '+brl(r.v)+'</span>'+
        '<span class="track"><span class="fill" style="width:'+(r.v/max*100).toFixed(2)+'%"></span></span>'+
        '<span class="bp tnum">'+(r.v/tot*100).toFixed(1).replace('.',',')+'% da categoria</span></div>'));
    });
    b.appendChild(bars);
  },{cancelar:'Fechar'});
}
