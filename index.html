    sc0.appendChild(dicaRestaurar());
    s.appendChild(sc0);return s;
  }

  var sc=el('<div class="scroll"></div>');
  var br=bannerRecorrentes(mk,tot);
  if(br){br.style.margin='0 0 12px';sc.appendChild(br);}
  var b=bannerFechamento();
  if(b){b.style.margin='0 0 12px';sc.appendChild(b);}

  /* v14 (arrumação a): o bloco de saldo separado saiu. Ele e o número grande
     eram dois números grandes empilhados — R$ 637,20 em verde e 23px, R$
     8.592,80 em preto e 40px — e a tela não dizia qual dos dois era O número.
     Ninguém escolheu isso: o bloco nasceu na v11 e o cartão é mais velho.
     Agora Entradas e Saldo são linhas de apoio DENTRO do cartão, onde a
     hierarquia é inequívoca. Ver o rodapé do cartão, mais abaixo. */

  /* v20 (item 36): um mês com entrada e nenhuma saída parava AQUI, num estado
     vazio que dizia "houve entrada neste mês, mas nenhuma saída" e não mostrava
     a entrada em lugar nenhum — nem número, nem rosca, nem ranking. O estado
     vazio agora é só para o mês em que não houve nada; havendo um lado, a tela
     se vira para ele. É o mesmo mecanismo do lote D, e por isso os dois saíram
     juntos: uma vez que o cartão do topo sabe falar de entrada, o mês só de
     entrada deixa de ser caso especial. */
  if(!doMes.length&&!entMes.length){
    sc.appendChild(vazio('Nada em '+mesLabel(mk).split(' de ')[0],
      'Nenhum lançamento neste mês.',
      'Ir para hoje',function(){S.mesSum=mkey(hoje());render();}));
    s.appendChild(sc);return s;
  }
  /* o lado é uma escolha SUA enquanto houver os dois; com um lado só, o mês
     decide por você — e o seletor não aparece para oferecer uma tela vazia. */
  var soEnt=(!doMes.length&&entMes.length>0);
  var soSai=(!entMes.length&&doMes.length>0);
  var ent=soEnt?true:(soSai?false:(S.ladoSum==='e'));
  /* v20 (lote D): o seletor subiu. Ele governa o cartão do topo agora, e um
     controle que manda na tela inteira não pode morar no meio dela. */
  if(doMes.length&&entMes.length){
    var sgTopo=el('<div class="seg res" style="margin:0 0 12px"></div>');
    [['s','Saídas'],['e','Entradas']].forEach(function(o){
      var sb=el('<button aria-selected="'+((o[0]==='e')===ent)+'">'+o[1]+'</button>');
      sb.onclick=function(){S.ladoSum=o[0];render();};
      sgTopo.appendChild(sb);
    });
    sc.appendChild(sgTopo);
  }
  var totLado=ent?totEnt:tot;
  var noLado=ent?entMes:doMes;

  var eMesAtual=(mk===mkey(hoje()));
  var diasCorridos=eMesAtual?(+hoje().slice(8)):diasNoMes(mk);
  /* v14 (ideias 1, 2 e 4). Três coisas mudam neste cartão.
     (1) A comparação vira UM controle, não três. Existem até três réguas —
     mês anterior, média de N meses, mesmo mês do ano passado — e empilhar as
     três aqui custaria 36px, que são exatamente os 36px que empurram a rosca
     para fora da primeira tela. Então o cartão mostra a primeira e o toque
     abre a folha, onde as outras moram num seletor.
     (2) A sparkline de 12 meses entra logo abaixo.
     (3) Entradas e Saldo viram linhas de apoio no rodapé do cartão. */
  var regs=reguas(mk,ent);
  var linhaCmp;
  if(regs.length){
    var d0=deltaDe(totLado,regs[0].base,regs[0].curto);
    linhaCmp='<button class="deltabtn '+(ent?'inv ':'')+d0.cls+'" aria-label="Ver o que mudou">'+
      '<span class="gp"><span>'+d0.arw+'</span>'+esc(d0.txt)+'</span>'+ICO.chev+'</button>';
  }else{
    /* sem base não há botão: abrir uma folha vazia é pior que não abrir */
    linhaCmp='<div class="delta flat"><span>≈</span>sem mês anterior para comparar</div>';
  }
  /* v20 (lote D, arrumação c): as linhas de apoio mostram sempre O OUTRO LADO
     e o saldo. Em Saídas: Entradas · Saldo. Em Entradas: Saídas · Saldo. Assim
     o número grande nunca é o mesmo número de uma das linhas de baixo, que era
     o risco de simplesmente trocar o rótulo. */
  var rodape='';
  if(doMes.length&&entMes.length){
    var sal=totEnt-tot;
    rodape='<div class="herolin">'+
      '<span class="c"><span class="k">'+(ent?'Saídas':'Entradas')+'</span>'+
      '<span class="v tnum'+(ent?'':' vin')+'">'+(ent?('R$ '+brl(tot)):brlSinRS(totEnt))+'</span></span>'+
      '<span class="c dir"><span class="k">Saldo de '+mesLabel(mk).split(' de ')[0]+'</span>'+
      '<span class="v tnum '+(sal<0?'vneg':'vin')+'">'+brlRS(sal)+'</span></span></div>';
  }
  var hero=el('<div class="hero"><div class="k">'+
    (ent?'Recebido em ':'Gasto em ')+mesLabel(mk).split(' de ')[0]+
    (eMesAtual?(' · '+diasCorridos+(diasCorridos===1?' dia':' dias')):'')+'</div>'+
    '<div class="big tnum">R$ '+brl(totLado)+'</div>'+
    linhaCmp+portaEvo(mk,ent)+rodape+'</div>');
  var bcmp=hero.querySelector('.deltabtn');
  if(bcmp)bcmp.onclick=function(){folhaMudou(mk,ent);};
  var bevo=hero.querySelector('.evoport');
  if(bevo)bevo.onclick=function(){folhaEvolucao(mk,ent);};
  sc.appendChild(hero);

  /* v13 (item 31): os quatro tiles saíram — média diária, projeção do mês,
     lançamentos e ticket médio. Três eram derivações sem uso e a quarta, a
     projeção, era média × dias do mês: ignorava recorrente pendente e parcela
     já agendada, ou seja, prometia previsão sem fazer previsão. Previsão de
     verdade é outro assunto (item 14) e não entra escondida num tile. */

  /* v15 (lote B): os cartões do meio viraram um CARROSSEL.
     Empilhados, eles empurravam a rosca inteira para fora da primeira tela —
     medido: a rosca terminava em 942px de 693 disponíveis, com zero pixel dela
     à mostra. Dividindo um espaço só, ela volta a aparecer. São cartões irmãos:
     mesma altura, mesma importância, uma ideia cada. */
  /* v20 (lote D): os dois cartões do meio e a faixa de metas falam de GASTO —
     comprometido à frente, como o mês se formou, meta estourada. Do lado das
     entradas eles não têm sentido, e mostrar mesmo assim seria repetir o erro
     que o lote D veio corrigir: um pedaço da tela falando de outro lado que
     não o escolhido. */
  var cartoes=[];

  /* Sem este bloco o parcelamento faria o mês parecer menor sem dizer para
     onde o resto foi. Só aparece quando existe parcela futura. */
  var cmp=ent?{tot:0,meses:[]}:comprometido(mk);
  if(cmp.tot>0){
    var mx=cmp.meses.reduce(function(a,m){return Math.max(a,m.v);},1);
    /* v15 (arrumação b): o valor entra ACIMA da barra e a barra encolhe 6px —
       mesma altura total. Era o único gráfico decorativo da tela, contra a
       regra que a v13 estabeleceu: gráfico aqui ou é tocável, ou vem com os
       números. Agora é as duas coisas. */
    var sp=cmp.meses.slice(0,6).map(function(m){
      /* só a parte inteira: "480", não "480,00" — a coluna tem 55px e o
         centavo não muda a leitura de um mês de parcela */
      return '<span class="cbar"><em class="vv">'+brl(m.v).split(',')[0]+'</em>'+
             '<i style="height:'+Math.round(5+m.v/mx*25)+'px"></i>'+
             '<em>'+MESC[+m.m.slice(5,7)-1]+'</em></span>';
    }).join('');
    var cc=el('<button class="compr"><div class="comprhd">'+
      '<span class="k">Comprometido à frente</span>'+ICO.chev+'</div>'+
      '<div class="v tnum">R$ '+brl(cmp.tot)+'</div>'+
      '<div class="s">'+cmp.n+(cmp.n===1?' parcela':' parcelas')+' de '+cmp.compras+
        (cmp.compras===1?' compra':' compras')+' · até '+mesCurto(cmp.ate)+'</div>'+
      '<div class="cbars">'+sp+'</div></button>');
    cc.onclick=function(){folhaComprometido(mk);};
    cartoes.push(cc);
  }

  /* v15 (ideia 5). Só existe quando há o que dizer: sem nada comprometido, o
     cartão diria "100% decidido neste mês", que é verdade e não informa. E se
     algum dos dois lados ficar negativo por estorno, a barra de duas partes
     deixa de ter sentido — mesma recusa da rosca. */
  var fm=ent?{tot:0,comp:0,dec:0}:formacaoMes(noMes);
  if(fm.tot>0&&fm.comp>0&&fm.dec>=0){
    var pc=Math.round(fm.comp/fm.tot*100),pd=100-pc;
    var cf=el('<button class="mix"><div class="mixhd">'+
      '<span class="k">Como o mês se formou</span>'+ICO.chev+'</div>'+
      '<div class="mixbar"><i class="a" style="width:'+pc+'%"></i>'+
      '<i class="b" style="width:'+pd+'%"></i></div>'+
      '<div class="mixleg">'+
      '<div class="ln"><span class="sw a"></span><span class="nm">Já comprometido'+
      '<small>'+fm.nc+(fm.nc===1?' lançamento':' lançamentos')+' de recorrente ou parcela</small>'+
      '</span><span class="vl tnum">R$ '+brl(fm.comp)+'</span></div>'+
      '<div class="ln"><span class="sw b"></span><span class="nm">Decidido neste mês'+
      '<small>'+pd+'% do total</small></span>'+
      '<span class="vl tnum">R$ '+brl(fm.dec)+'</span></div></div>'+
      '<div class="pe">Conta como comprometido o que veio de um molde recorrente e a '+
      'parcela da segunda em diante. Despesa fixa digitada na mão não entra.</div></button>');
    cf.onclick=function(){folhaFormacao(noMes,mk);};
    cartoes.push(cf);
  }

  var carr=carrossel(cartoes);
  if(carr)sc.appendChild(carr);

  /* v18: a faixa das metas estouradas.
     Só existe quando há meta E há estouro — quem não usa orçamento continua
     com a tela byte a byte igual, e quem usa e está dentro de todas não
     precisa de um aviso para dizer que está tudo bem. Ela é atalho, não
     alarme: leva direto à tela de metas, que é onde a decisão se toma. */
  var bal=ent?[]:balancoMetas(mk),furo=bal.filter(function(x){return x.estourou;});
  if(furo.length){
    var fh=el('<button class="metahd"><span class="tx">'+furo.length+' de '+bal.length+
      (bal.length===1?' meta estourada':' metas estouradas')+' em '+
      esc(mesLabel(mk).split(' de ')[0])+'</span>'+ICO.chev+'</button>');
    fh.onclick=folhaMetas;
    sc.appendChild(fh);
  }

  /* v13 (item 31): onde antes vinham dois rankings empilhados, agora vem UM
     bloco — rosca em cima, ranking embaixo — e um seletor que escolhe o lado.
     O seletor só existe quando houve entrada no mês: com um lado só ele seria
     um controle de uma opção, e aí o rótulo fixo da v12 continua valendo. */
  /* v20 (lote D): o seletor que ficava aqui subiu para o topo — ele manda no
     cartão do número grande agora, e controle que governa a tela inteira não
     mora no meio dela. O que fica aqui é só o rótulo do bloco. */
  sc.appendChild(el('<div class="glabel">'+(ent?'Entradas':'Saídas')+' por categoria</div>'));
  sc.appendChild(blocoCats(noLado,totLado,ent,mk));

  s.appendChild(sc);
  return s;
}

/* v15 (lote B): o carrossel dos cartões do meio.
   Escopo estreito de propósito: só estes cartões, nunca a tela. O cartão do
   topo é a identidade da tela e o ranking é lista longa que rola na vertical —
   nem um nem outro entram aqui.

   Com UM cartão não há carrossel: uma página só com um pontinho embaixo é um
   controle que não controla nada. */
function carrossel(cards){
  if(!cards.length)return null;
  if(cards.length===1){
    var unico=el('<div style="margin-top:9px"></div>');
    unico.appendChild(cards[0]);
    return unico;
  }
  var wrap=el('<div></div>');
  var tr=el('<div class="carro" role="group" aria-label="Cartões do mês"></div>');
  cards.forEach(function(c){
    var pag=el('<div></div>');pag.appendChild(c);tr.appendChild(pag);
  });
  var dots=el('<div class="cdots" aria-hidden="true"></div>');
  cards.forEach(function(_,i){
    dots.appendChild(el('<span class="cdot'+(i?'':' on')+'"></span>'));
  });
  /* O pontinho segue a página. Arredonda pela largura de UMA página, não pela
     pista inteira: com espaçamento entre cartões, dividir pela pista erra o
     último. */
  var pinta=function(){
    var larg=tr.firstChild?tr.firstChild.getBoundingClientRect().width+16:1;
    var i=Math.min(cards.length-1,Math.max(0,Math.round(tr.scrollLeft/larg)));
    for(var j=0;j<dots.children.length;j++)
      dots.children[j].classList.toggle('on',j===i);
  };
  tr.addEventListener('scroll',pinta,{passive:true});
  wrap.appendChild(tr);wrap.appendChild(dots);
  return wrap;
}

/* Rosca + ranking de um lado só. Saídas e entradas usam o MESMO desenho, com
   as duas diferenças da v12 preservadas: o denominador do percentual é o total
   do próprio lado ("do mês" × "das entradas") e a largura da barra é relativa
   ao maior do próprio lado. São duas escalas independentes — nada aqui compara
   barra de entrada com barra de saída, senão o salário viraria a maior "saída"
   do mês. */
function blocoCats(lista,tot,ent,mk){
  var frag=document.createDocumentFragment();
  var agg={};lista.forEach(function(e){agg[e.cat]=(agg[e.cat]||0)+e.v;});
  var rank=Object.keys(agg).map(function(k){return {id:k,v:agg[k]};})
    .sort(function(a,b){return b.v-a.v;});
  if(!rank.length)return frag;
  var suf=ent?'das entradas':'do mês';

  /* O centro diz a maior categoria e o peso dela. Poderia dizer o total, mas o
     total já está no número grande três dedos acima — e repetir número não
     informa. Qual categoria dominou o mês não está em nenhum outro lugar da
     tela, e é exatamente a leitura que a rosca existe para dar. */
  var c0=cat(rank[0].id)||{n:'—'};
  /* No centro vai só o número, sem o "do mês"/"das entradas": o seletor logo
     acima já diz de que lado é, e com o sufixo "93,2% das entradas" quebrava em
     duas linhas e o texto encostava no anel. Na barra o sufixo continua — lá
     não há seletor imediatamente acima dizendo o lado. */
  var pl=pctLabel(rank[0].v,tot,suf),so=(pl==='—'?'—':pl.split(' ')[0]);
  var meio='<div class="dk">maior categoria</div>'+
           '<div class="dv">'+esc(c0.n)+'</div>'+
           '<div class="dp">'+so+'</div>';
  var ro=roscaHTML(rank,tot,meio);
  if(ro)frag.appendChild(el(ro));

  /* .sai e .ent: os dois lados usam a mesma barra, e é preciso poder dizer qual
     é qual — na leitura da tela e na verificação automática. */
  var max=rank[0].v;
  var bars=el('<div class="bars '+(ent?'ent':'sai')+'"></div>');
  rank.forEach(function(r){
    var c=cat(r.id)||{e:'❓',n:'—',c:'#78716C'};
    /* com "R$" dos dois lados: um lado escrevendo "+ 8.600,00" enquanto o outro
       escreve "R$ 880,40" faria parecer que são unidades diferentes */
    var val=ent?('<span class="bv tnum '+(r.v<0?'vneg':'vin')+'">'+brlSinRS(r.v)+'</span>')
               :('<span class="bv tnum">R$ '+brl(r.v)+'</span>');
    /* v18: os três estados da meta. Sem meta, a linha é byte a byte a de
       antes — quem não usa orçamento não ganha traço, cor nem texto novo.
       O traço no trilho é a meta, e não leva rótulo: esta é a linha mais densa
       da tela e a palavra "meta" bateria no texto de baixo, que já diz o
       número. Entrada nunca tem meta: orçamento é sobre gasto. */
    var meta=ent?null:metaDe(r.id,mk),marca='',cls='',txt=pctLabel(r.v,tot,suf);
    if(meta){
      cls=' meta';
      marca='<span class="metamk" style="left:'+largBarra(meta,max).toFixed(2)+'%"></span>';
      if(r.v>meta){
        cls+=' estourou';
        txt='R$ '+brl(r.v-meta)+' acima da meta de R$ '+brl(meta);
      }else{
        txt='R$ '+brl(r.v)+' de R$ '+brl(meta);
      }
    }
    var b2=el('<button class="barrow'+cls+'" style="--c:'+c.c+'">'+
      '<span class="bn"><span>'+c.e+'</span><em>'+esc(c.n)+'</em></span>'+val+
      '<span class="track"><span class="fill" style="width:'+largBarra(r.v,max).toFixed(2)+'%"></span>'+marca+'</span>'+
      '<span class="bp tnum">'+txt+'</span></button>');
    /* é ESTA linha que abre a sub-categoria, e não a fatia da rosca: a menor
       fatia de um mês real dá 20px de arco, menos da metade do mínimo de toque
       da Apple. A rosca mostra a proporção; a linha é o controle. */
    b2.onclick=function(){folhaDetalheCat(r.id,mk);};
    bars.appendChild(b2);
  });
  frag.appendChild(bars);
  return frag;
}

/* ---------------- camadas: folhas, toast, alerta ---------------- */
var layers=document.getElementById('layers');
var toastTimer=null;

function fecharFolhas(){
  Array.prototype.slice.call(layers.querySelectorAll('.scrim,.sheet')).forEach(function(n){n.remove();});
}
/* ============================================================
   repintar: a peça que faltava para "lista -> item" (v33)
   ------------------------------------------------------------
   O app abria o item com `fecharFolhas(); folhaItem(...)` — ou seja,
   DESTRUÍA a lista para pôr o item no lugar dela. Salvar fechava o item e
   você caía na aba, duas telas abaixo de onde estava.

   A peça certa já existia: `folhaSobre()` empilha e fecha só a si mesma. Só
   faltava a de baixo saber se redesenhar, porque o item que você acabou de
   salvar mudou a linha dela. `repintar()` esvazia o corpo e roda o `montar`
   de novo — a mesma função que construiu a folha na primeira vez, então não
   há um segundo jeito de desenhar a lista que possa divergir do primeiro.

   É isto que apaga o remendo da folha de sub-categorias, que tinha um botão
   "voltar" feito à mão só para RECONSTRUIR a lista de categorias destruída.
   ============================================================ */
function ligarRepintar(sh,montar,fechar){
  sh.repintar=function(){
    var b=sh.querySelector('.sheet-b');
    b.innerHTML='';
    montar(b,fechar||sh);
  };
  return sh;
}
function folha(titulo,montar,opts){
  opts=opts||{};
  var scrim=el('<div class="scrim"></div>');
  scrim.onclick=function(){if(!opts.fixa)fecharFolhas();};
  var sh=el('<div class="sheet"><div class="sheet-h">'+
    '<button class="sa">'+(opts.cancelar||'Cancelar')+'</button>'+
    '<div class="st">'+esc(titulo)+'</div>'+
    '<span class="sa right"></span></div><div class="sheet-b"></div></div>');
  sh.querySelector('.sa').onclick=function(){fecharFolhas();if(opts.aoFechar)opts.aoFechar();};
  if(opts.acao){
    var a=el('<button class="sa right strong">'+esc(opts.acao)+'</button>');
    a.onclick=function(){opts.aoAgir(sh);};
    sh.querySelector('.sheet-h').replaceChild(a,sh.querySelector('.sa.right'));
  }
  montar(sh.querySelector('.sheet-b'),sh);
  layers.appendChild(scrim);layers.appendChild(sh);
  return ligarRepintar(sh,montar,sh);
}
/* Folha EMPILHADA: fecha só a si mesma, deixando a de baixo aberta.
   `folha()` usa `fecharFolhas()`, que varre tudo — o que está certo para o fluxo
   normal e errado para uma folha aberta de dentro de outra: fechar o teclado
   levaria embora o formulário de edição inteiro, com tudo o que já foi digitado.
   Só quem é aberto por cima de outra folha usa esta função. */
function folhaSobre(titulo,montar,opts){
  opts=opts||{};
  var scrim=el('<div class="scrim"></div>');
  /* v30: `opts.pronto` põe o botão ÚNICO à direita, em vez de à esquerda.
     A esquerda é o lugar de "Cancelar" — voltar atrás — e a direita é o lugar
     de confirmar, no iOS e no resto deste app. Numa folha em que cada toque já
     vale (as etiquetas), o botão não cancela nada: ele diz "terminei". Estava
     do lado errado. Não são dois botões: pôr "Cancelar" ao lado seria oferecer
     uma volta que não existe. */
  var dir=!!opts.pronto;
  var rot=esc(opts.cancelar||(dir?'Pronto':'Cancelar'));
  var sh=el('<div class="sheet"><div class="sheet-h">'+
    (dir?'<span class="sa"></span>':('<button class="sa">'+rot+'</button>'))+
    '<div class="st">'+esc(titulo)+'</div>'+
    (dir?('<button class="sa right strong">'+rot+'</button>'):'<span class="sa right"></span>')+
    '</div><div class="sheet-b"></div></div>');
  function fechar(){
    if(scrim.parentNode)scrim.parentNode.removeChild(scrim);
    if(sh.parentNode)sh.parentNode.removeChild(sh);
  }
  scrim.onclick=fechar;
  sh.querySelector('button.sa').onclick=function(){fechar();if(opts.aoFechar)opts.aoFechar();};
  montar(sh.querySelector('.sheet-b'),fechar);
  var deBaixo=layers.querySelector('.sheet');
  layers.appendChild(scrim);layers.appendChild(sh);

  /* Duas folhas empilhadas com alturas diferentes deixam à mostra uma faixa da
     de baixo — e o que se vê ali é o CABEÇALHO dela, então a tela parece ter
     dois títulos e dois "Cancelar". Media 67px no iPhone SE e 91px no 14.

     A folha de cima passa a assumir a altura da de baixo. Quem absorve a
     diferença é o conteúdo marcado com `.cresce` — no caso do teclado, isso o
     deixa mais alto, que é exatamente o que a tela de registro já faz: lá o
     teclado ocupa o que sobra da tela (tecla de 44px no SE, 88px no 14).

     Se a de baixo for MENOR que o conteúdo natural desta, não encolhemos nada:
     a de cima fica maior e cobre. Faixa negativa não existe. */
  function casar(){
    if(!deBaixo||!deBaixo.isConnected)return;
    sh.style.height='';
    var natural=sh.getBoundingClientRect().height;
    var alvo=deBaixo.getBoundingClientRect().height;
    if(alvo>natural+1)sh.style.height=alvo+'px';
  }
  if(opts.casar){
    casar();
    /* girar o aparelho muda as duas alturas; sem isto a de cima ficaria presa
       no número medido em retrato */
    window.addEventListener('resize',casar);
    var fecharOrig=fechar;
    fechar=function(){window.removeEventListener('resize',casar);fecharOrig();};
    scrim.onclick=fechar;
    sh.querySelector('.sa').onclick=function(){fechar();if(opts.aoFechar)opts.aoFechar();};
  }
  ligarRepintar(sh,montar,function(){fechar();});
  return {sh:sh,fechar:function(){fechar();},repintar:function(){sh.repintar();}};
}

/* Folha de valor: o visor e o teclado da tela de registro, usados para editar um
   valor que já existe. Ela NÃO grava nada — devolve o valor em centavos pelo
   callback e quem chamou decide o que fazer. É por isso que o botão "Confirmar"
   aqui não é o mesmo "Confirmar" do registro, ainda que pareça: lá ele cria um
   lançamento, aqui ele fecha uma folha. */
function folhaValor(titulo,cents,cfg,cb){
  cfg=cfg||{};
  var st=estadoValor(cents);
  var bv=blocoValor(st,{ent:cfg.ent,rotulo:cfg.rotulo,onUpd:cfg.onUpd,zeroOk:cfg.zeroOk,
                        semSinal:cfg.semSinal,okTxt:cfg.okTxt,onOk:function(){
    if(!centsDe(st)&&!cfg.zeroOk)return;
    f.fechar();cb(valorDe(st));
  }});
  var f=folhaSobre(titulo,function(b){
    b.appendChild(bv.amt);
    /* v18: um aviso entre o visor e o teclado, para quem precisa dizer o que
       aquele número vai significar — hoje só a vigência da meta usa. */
    if(cfg.aviso)b.appendChild(cfg.aviso);
    /* `cresce`: é este bloco que absorve a diferença de altura quando a folha
       se ajusta à de baixo. Sem ele, a sobra viraria um buraco entre o visor e
       os somadores — que foi a opção D do estudo, descartada por isso. */
    var cx=el('<div class="padbox cresce"></div>');
    cx.appendChild(bv.pad);
    b.appendChild(cx);
    bv.upd();
  },{casar:true});
  /* v20: ação secundária no canto direito do cabeçalho da folha.
     Era o único canto vazio, e é o ponto mais longe do polegar — que foi
     justamente a objeção ao botão vermelho em cima do teclado. */
  if(cfg.acao){
    var ab=el('<button class="sa right dan">'+esc(cfg.acao.txt)+'</button>');
    ab.onclick=function(){f.fechar();cfg.acao.fn();};
    var vazio=f.sh.querySelector('.sa.right');
    vazio.parentNode.replaceChild(ab,vazio);
  }
  return f;
}

function toast(t,s,btxt,fn){

/* v21 (item 27): a regra do rótulo de saída, que não existia — dez folhas

/* v26 (item 50): a folha da data serve o registro E a edição, e o terceiro
   cartão deixou de entregar a tela ao iOS.

   O que te fez notar isso foi a LÍNGUA: o app fixa tudo em pt-BR (MES, MESC,
   DOW, e `toLocaleString('pt-BR')` no dinheiro), mas o seletor nativo segue o
   idioma do aparelho — e no seu iPhone, em inglês, ele abria "September 2026 /
   SUN MON TUE". Dois calendários na mesma tela, em duas línguas. */
function folhaData(cfg){
  cfg=cfg||{};
  var pegar=function(){return cfg.valor||S.data||hoje();};
  var por=function(d){
    if(cfg.aoEscolher){if(fechaEsta)fechaEsta();cfg.aoEscolher(d);return;}
    S.data=d;fecharFolhas();render();

  /* v21 (item 27): era "Data da despesa" mesmo ao registrar o salário. */

/* Dia do mês de um molde recorrente. Era o último teclado do sistema no app:

/* v26 (item 50): serve o registro e a edição. Na edição era um <select>, que

   Escolher e criar. Só ação ADITIVA aqui: renomear e excluir moram em Ajustes,
   porque no meio de um lançamento ninguém deve tropeçar no destrutivo.

   Criar aqui é deliberado, e é a primeira coisa do app que nasce fora de
   Ajustes. O motivo é a natureza da coisa: as 15 categorias cobrem tudo e
   ninguém precisa inventar uma na correria; etiqueta existe justamente para o
   corte que a vida inventou ontem. Bloquear a criação aqui não evitaria
   bagunça — evitaria a etiqueta. */
function folhaEtiquetas(sel,aoMudar,opts){
  opts=opts||{};
  sel=(sel||[]).slice();
  folhaSobre('Etiquetas',function(b,fechar){
    b.appendChild(el('<div class="hint" style="padding:2px 4px 10px">Etiqueta é para o que '+
      '<b>cruza categoria</b>. O que só existe dentro de uma categoria é sub-categoria.</div>'));
    var w=el('<div class="optwrap"></div>');
    /* v31: as arquivadas não entram aqui — é exatamente daqui que elas saem.
       A exceção é a que JÁ ESTÁ neste lançamento: escondê-la tiraria de você a
       única forma de removê-la, e o app estaria escondendo algo que está no seu
       lançamento. Essa aparece num grupo próprio, marcada, e some da folha
       assim que você a desmarca. */
    var gArq=el('<div></div>');
    function linha(t,marca){
      var on=sel.indexOf(t.id)>=0;
      var o=el('<button class="opt'+(t.arq?' arq':'')+'"><span class="ic">🏷️</span>'+
        '<span class="nm">'+esc(t.n)+(marca?' <span class="arqtxt">· arquivada</span>':'')+'</span>'+
        (on?'<span class="tag">✓</span>':'<span></span>')+'</button>');
      o.setAttribute('aria-pressed',String(on));
      o.onclick=function(){
        var i=sel.indexOf(t.id);
        if(i>=0)sel.splice(i,1);else sel.push(t.id);
        pinta();aoMudar(sel.slice());
      };
      return o;
    }
    function pinta(){
      w.innerHTML='';gArq.innerHTML='';
      etqsAtivas().forEach(function(t){w.appendChild(linha(t,false));});
      var nova=el('<button class="opt"><span class="ic">＋</span>'+
        '<span class="nm">Nova etiqueta</span><span></span></button>');
      nova.onclick=function(){
        folhaNovaEtiqueta(function(t,jaExistia,reativou){
          if(sel.indexOf(t.id)<0)sel.push(t.id);
          pinta();aoMudar(sel.slice());
          if(reativou)toast('Etiqueta reativada',esc(t.n)+' estava arquivada e voltou.','',null);
          else if(jaExistia)toast('Esta etiqueta já existe',esc(t.n)+' foi marcada.','',null);
        });
      };
      w.appendChild(nova);
      var pres=etqsArquivadas().filter(function(t){return sel.indexOf(t.id)>=0;});
      if(pres.length){
        gArq.appendChild(el('<div class="optgrp">Neste lançamento, mas arquivada'+
          (pres.length>1?'s':'')+'</div>'));
        var wa=el('<div class="optwrap"></div>');
        pres.forEach(function(t){wa.appendChild(linha(t,true));});
        gArq.appendChild(wa);
      }
    }
    pinta();
    b.appendChild(w);
    b.appendChild(gArq);
    if(!etqsAtivas().length&&!(DB.etq||[]).length)
      b.appendChild(el('<div class="hint">Você ainda não tem etiquetas. '+
        'Exemplos que cruzam categoria: <b>reembolsável</b>, <b>presente de Natal</b>, '+
        '<b>viagem SP</b>.</div>'));
  },{cancelar:opts.cancelar||'Pronto',pronto:true});
}
/* O campo de texto de criar. A lista fica visível logo acima, na folha de
   baixo — e é ISSO que impede o "reemb": você vê "reembolsável" três linhas
   acima no momento de digitar. A normalização é a segunda rede, para a
   família acento/caixa/espaço. */
function folhaNovaEtiqueta(cb){
  folhaSobre('Nova etiqueta',function(b,fechar){
    var f=el('<div class="field"><div class="k">Nome</div>'+
      '<input type="text" maxlength="28" placeholder="Ex.: reembolsável"></div>');
    b.appendChild(f);
    b.appendChild(el('<div class="hint">Vale para o que <b>cruza categoria</b>. '+
      'Se já existir uma com este nome, o app usa a que existe.</div>'));
    var ok=el('<button class="btnfull">Criar</button>');
    ok.onclick=function(){
      var n=f.querySelector('input').value.trim();
      if(!n){alerta('Nome obrigatório','Toda etiqueta precisa de um nome.');return;}
      var r=criarEtq(n);
      if(!r)return;
      /* v31: reativar também grava — criarEtq já tirou o `arq`, e uma gravação
         que falhe tem que devolver a etiqueta ao estado de antes. */
      if((!r.jaExistia||r.reativou)&&!salvar()){
        if(r.reativou)r.etq.arq=true;
        else DB.etq=DB.etq.filter(function(x){return x.id!==r.etq.id;});
        return;
      }
      fechar();cb(r.etq,r.jaExistia,r.reativou);
    };
    b.appendChild(ok);
    setTimeout(function(){var i=f.querySelector('input');if(i)i.focus();},60);
  },{cancelar:'Cancelar'});
}
/* Rótulo curto para o chip e para a linha da lista. */
function rotuloEtq(ids){
  var ts=(DB.etq||[]).filter(function(t){return (ids||[]).indexOf(t.id)>=0;});
  if(!ts.length)return '';
  return ts[0].n+(ts.length>1?(' +'+(ts.length-1)):'');
}

/* Escolha das parcelas. Cada botão já mostra o valor da parcela, para a decisão
   ser tomada olhando o número que importa e não o multiplicador. */
/* v26 (item 50): serve o registro e a edição. Na edição era um <select>. */
function folhaParcelas(cfg){
  cfg=cfg||{};
  var total=(cfg.total!==undefined)?cfg.total:totalCents();
  var atual=(cfg.valor!==undefined)?cfg.valor:S.parc;
  var base=cfg.data||S.data||hoje();
  var por=function(n){
    if(cfg.aoEscolher){cfg.aoEscolher(n);return;}
    S.parc=n;fecharFolhas();render();
  };
  var abrir=cfg.sobre?folhaSobre:folha;
  abrir('Parcelas',function(b,fechar){
    b.appendChild(el('<div class="glabel" style="margin-top:0">'+
      (total>0?('Total da compra: R$ '+brl(total)):'Digite o valor total primeiro')+'</div>'));
    var g=el('<div class="parcgrid"></div>');
    for(var i=1;i<=MAXPARC;i++){
      (function(n){
        var val=total>0?('R$ '+brl(fatiar(total,n)[0])):'';
        var o=el('<button aria-pressed="'+(atual===n)+'">'+n+'×'+
          '<small>'+(n===1?'à vista':esc(val))+'</small></button>');
        o.onclick=function(){if(cfg.sobre&&fechar)fechar();por(n);};
        g.appendChild(o);
      })(i);
    }
    b.appendChild(g);
    if(atual>1&&total>0){
      b.appendChild(el('<div class="glabel">Como vai cair</div>'));
      var vs=fatiar(total,atual),w=el('<div class="optwrap"></div>');
      for(var k=0;k<atual;k++){
        var dt=addMesData(base,k);
        w.appendChild(el('<div class="opt"><span class="ic" style="font-size:13px">'+(k+1)+'</span>'+
          '<span class="nm">'+mesLabel(mkey(dt))+'<small>parcela '+(k+1)+' de '+atual+' · dia '+(+dt.slice(8))+'</small></span>'+
          '<span class="tag">R$ '+brl(vs[k])+'</span></div>'));
      }
      b.appendChild(w);
    }
    b.appendChild(el('<div class="hint">O valor digitado é sempre o <b>total da compra</b>. '+
      'Quando a divisão não fecha, a sobra de centavos vai na primeira parcela — como fazem as operadoras.</div>'));
  },{cancelar:cfg.sobre?'Cancelar':'Fechar'});
}

/* ============================================================
   RECORRÊNCIAS — faixa, revisão, moldes
   ============================================================ */
/* Somar pendência de entrada com pendência de saída produz um número que não é
   gasto, nem receita, nem saldo. É o mesmo defeito que o comprometido() tinha:
   os moldes nasceram quando toda categoria era despesa. */
function totaisPend(lista){
  var e=0,sa=0;
  lista.forEach(function(x){if(eEntrada(x.cat))e+=x.v;else sa+=x.v;});
  return {ent:e,sai:sa,misto:e!==0&&sa!==0};
}
function txtPend(lista){
  var t=totaisPend(lista);
  if(!t.misto)return 'R$ '+brl(t.ent||t.sai);
  return '− R$ '+brl(t.sai)+' · + R$ '+brl(t.ent);
}
/* v32: a faixa cobra o que VENCEU. Quando nada venceu ela não some — some
   seria levar junto a linha de fechamento do mês, que é das mais úteis do app.
   Ela MUDA DE TOM: borda neutra, botão secundário, verbo "Ver". Deixa de pedir
   e passa a informar. */
function bannerRecorrentes(mk,totMes){
  var ps=pendentes();
  if(!ps.length)return null;
  var venc=ps.filter(function(x){return x.vencida;});
  var cobra=venc.length>0;
  var base=cobra?venc:ps;
  var nomes=[];
  base.forEach(function(x){if(nomes.indexOf(x.n)<0&&nomes.length<3)nomes.push(x.n);});
  var lista=nomes.join(', ');
  if(base.length>nomes.length)lista+=' e outras';
  var sub;
  if(cobra){
    var meses=[];venc.forEach(function(x){if(meses.indexOf(x.comp)<0)meses.push(x.comp);});
    var quando=meses.length===1?mesLabel(meses[0]).split(' de ')[0]
              :(meses.length+' meses');
    sub=esc(lista)+' · '+esc(quando)+' · '+txtPend(venc);
  }else{
    /* nenhuma venceu: todas são deste mês e ainda vão acontecer */
    var prim=ps[0];
    ps.forEach(function(x){if(x.d<prim.d)prim=x;});
    sub=esc(lista)+' · a primeira vence dia '+(+prim.d.slice(8));
  }
  var b=el('<div class="banner'+(cobra?'':' calmo')+'"><div class="bw"><div class="bt">'+
    (cobra?(venc.length+(venc.length===1?' recorrente a confirmar':' recorrentes a confirmar'))
          :(ps.length+(ps.length===1?' recorrente neste mês':' recorrentes neste mês')))+'</div>'+
    '<div class="bs">'+sub+'</div></div>'+
    '<button class="ba">'+(cobra?'Revisar':'Ver')+'</button></div>');
  b.querySelector('.ba').onclick=folhaRevisao;
  /* v14 (ideia 3): o fechamento do mês.
     A ideia nasceu como cartão novo e encolheu para esta linha depois de uma
     pergunta certeira: o que exatamente falta ao número grande? Resposta: só
     isto. Parcela do mês JÁ está lá (ocorrencias() põe a parcela no mês em que
     vence, e o "Comprometido à frente" só olha o que vence depois) e recorrente
     confirmado virou lançamento no instante da confirmação. Sobram os
     pendentes — e o valor deles já estava nesta faixa. Então não é bloco novo:
     é a leitura de fechamento dentro do bloco que já existe.
     Só conta os pendentes DESTA competência: a faixa pode listar pendências de
     vários meses e somar todas daria um "fecha em" falso. */
  if(mk!=null){
    var pd=pendenteDoMes(mk);
    if(pd.tot>0){
      b.classList.add('fech');
      b.querySelector('.bw').appendChild(
        el('<div class="bf">Confirmando '+(pd.n===1?'o de ':'os '+pd.n+' de ')+
           esc(mesLabel(mk).split(' de ')[0])+', o mês fecha em '+
           '<b class="tnum">R$ '+brl((totMes||0)+pd.tot)+'</b></div>'));
    }
  }
  return b;
}

/* Nada é gravado até o botão de baixo. Desmarcar deixa pendente para a próxima
   vez; Pular é definitivo (e desfazível no detalhe do molde).

   v32 — a folha passou a ter DOIS grupos e TRÊS desfechos com nome:

     · VENCIDAS  nascem marcadas. É o que o botão de baixo propõe.
     · A VENCER  nascem DESMARCADAS. Antes nasciam marcadas, e no dia 1º um
       toque criava a conta de luz do mês inteiro com o valor do mês passado,
       calado, num mês em que ela nem tinha vencido. O caminho mais fácil da
       tela era o errado.

   E o estado do meio ganhou nome. Ele sempre existiu — desmarcar e fechar não
   grava nada, a pendência volta no próximo aviso —, mas a única coisa que
   aparecia ao desmarcar era o botão vermelho de pular. Quem desmarcava via uma
   ameaça onde devia ver uma escolha. Agora a frase diz o que acontece, e o
   pular é o secundário ao lado dela. */
function folhaRevisao(){
  var ps=pendentes();
  if(!ps.length){alerta('Nada a confirmar','Nenhuma recorrência está pendente agora.');return;}
  /* vencidas primeiro dentro de cada competência */
  ps=ps.slice().sort(function(a,b){
    if(a.comp!==b.comp)return a.comp<b.comp?-1:1;
    if(a.vencida!==b.vencida)return a.vencida?-1:1;
    if(a.d!==b.d)return a.d<b.d?-1:1;
    return a.n<b.n?-1:1;
  });
  /* o rótulo só separa quando há o que separar: mês com um grupo só não
     ganha sufixo nenhum. */
  var mista={};
  ps.forEach(function(x){
    if(mista[x.comp]===undefined)mista[x.comp]=x.vencida;
    else if(mista[x.comp]!==x.vencida)mista[x.comp]='ambos';
  });
  var estado=ps.map(function(x){return {p:x,on:!!x.vencida,v:x.v};});
  folha('A confirmar',function(b,sh){
    var btn=el('<button class="btnfull"></button>');
    var avisoSV=el('<div class="hint" hidden></div>');
    function atualizar(){
      /* O botão contava as linhas MARCADAS e a criação usava `on && v>0`. Uma
         linha marcada com o valor apagado fazia o botão prometer dois e entregar
         um, calado. Agora a conta do botão é a mesma da criação. */
      var sel=estado.filter(function(x){return x.on&&x.v>0;});
      var semValor=estado.filter(function(x){return x.on&&!(x.v>0);}).length;
      var lados=sel.map(function(x){return {cat:x.p.cat,v:x.v};});
      btn.textContent=sel.length?('Confirmar '+sel.length+(sel.length===1?' lançamento · ':' lançamentos · ')+txtPend(lados))
                                :'Nada selecionado';
      btn.disabled=!sel.length;
      avisoSV.textContent=semValor?(semValor===1
        ?'1 linha marcada está sem valor e não será confirmada.'
        :(semValor+' linhas marcadas estão sem valor e não serão confirmadas.')):'';
      avisoSV.hidden=!semValor;
    }
    var grupoAtual=null,wrap=null;
    estado.forEach(function(st,i){
      var x=st.p,gk=x.comp+'|'+(x.vencida?1:0);
      if(gk!==grupoAtual){
        grupoAtual=gk;
        var rot;
        if(mista[x.comp]!=='ambos')rot=mesLabel(x.comp);
        else if(x.vencida)rot=mesLabel(x.comp)+' · vencidas';
        else rot='ainda a vencer · não precisam de você hoje';
        b.appendChild(el('<div class="glabel"'+(i===0?' style="margin-top:0"':'')+'>'+
          esc(rot)+'</div>'));
        wrap=el('<div class="optwrap"></div>');b.appendChild(wrap);
      }
      var c=cat(x.cat)||{c:'#78716C',n:'—',e:'❓'};
      var r=rec(x.rec)||{};
      var sub=nomeCat(x.cat)+' · '+(x.vencida?'venceu dia ':'dia ')+(+x.d.slice(8))+
              ' · '+(x.fixo?'fixo':'variável');
      var linha=el('<div class="rrev" style="--c:'+c.c+'" aria-pressed="'+
        (st.on?'true':'false')+'">'+
        '<span class="ic">'+emojiSub(x.cat,x.sub)+'</span>'+
        '<span><span class="nm">'+esc(x.n)+'</span><span class="sb">'+esc(sub)+'</span></span>'+
        '<span class="vcel"></span><span class="ck">✓</span></div>');
      var cel=linha.querySelector('.vcel');
      if(x.fixo){
        cel.outerHTML='<span class="vl tnum">'+brl(st.v)+'</span>';
      }else{
        /* v20 (item 30): também era teclado do sistema, e este é o pior dos
           quatro — é o campo que se usa TODO MÊS, na confirmação dos
           recorrentes. Virou botão que abre o teclado do app. */
        var bt=el('<button class="vin tap tnum">'+(st.v?brl(st.v):'sem valor')+'</button>');
        bt.onclick=function(ev){
          ev.stopPropagation();
          /* zeroOk: zerar continua significando "não sei o valor deste mês",
             que é o estado que já existia com o campo de texto vazio — a linha
             fica de fora da confirmação e a tela avisa. */
          folhaValor('Valor de '+x.n,st.v,{semSinal:true,zeroOk:true,
            rotulo:'Valor de '+x.n},
            function(v){st.v=Math.max(0,v);
              bt.textContent=st.v?brl(st.v):'sem valor';atualizar();});
        };
        cel.replaceWith(bt);
      }
      linha.onclick=function(ev){
        if(ev.target&&ev.target.closest&&ev.target.closest('.vin'))return;
        st.on=!st.on;
        linha.setAttribute('aria-pressed',st.on?'true':'false');
        if(st.sk)st.sk.hidden=st.on;
        atualizar();
      };
      wrap.appendChild(linha);
      /* Revelado por um toque SEU, não pelo estado inicial — e é o `hidden`
         daqui que carrega isso: as "a vencer" nascem desmarcadas, e abrir a
         folha com esta explicação repetida embaixo de cada uma seria trocar o
         ruído do vermelho por outro ruído. (Cheguei a guardar um `tocou` no
         estado para isto; reintroduzir o defeito nele não derrubou nada, porque
         só o clique mexe no `hidden`. Saiu.) */
      var sk=el('<div class="pendrow" hidden>'+
        '<div class="ex">Fica pendente — volta no próximo aviso.</div>'+
        '<button class="dan">Pular este mês</button></div>');
      sk.querySelector('button').onclick=function(){
        var r2=rec(x.rec);if(!r2)return;
        pularComp(r2,x.comp);
        if(!salvar()){reativarComp(r2,x.comp);return;}
        fecharFolhas();render();
        toast('Mês pulado',x.n+' · '+mesLabel(x.comp),'Desfazer',function(){
          reativarComp(r2,x.comp);salvar();render();});
      };
      wrap.appendChild(sk);
      st.sk=sk;
    });
    b.appendChild(el('<div class="hint">As que <b>ainda não venceram</b> começam desmarcadas: '+
      'ficam pendentes até você confirmar. Marque qualquer uma para confirmar antes do dia. '+
      'O valor sugerido para os variáveis é o do <b>último mês confirmado</b>. '+
      'Tocar numa linha revela a opção de <b>pular</b>, que é definitiva e só pode ser '+
      'desfeita no detalhe da recorrência.</div>'));
    btn.onclick=function(){
      var sel=estado.filter(function(x){return x.on&&x.v>0;});
      if(!sel.length)return;
      var criados=sel.map(function(st){
        var novo={id:uid('e'),d:st.p.d,cat:st.p.cat,sub:st.p.sub,v:st.v,
                pay:st.p.pay,desc:st.p.desc,ts:Date.now(),rec:st.p.rec,comp:st.p.comp};
        if(st.p.etq&&st.p.etq.length)novo.etq=st.p.etq.slice();
        return novo;
      });
      criados.forEach(function(e){DB.exp.unshift(e);});
      if(!salvar()){
        var ids={};criados.forEach(function(e){ids[e.id]=1;});
        DB.exp=DB.exp.filter(function(e){return !ids[e.id];});
        return;
      }
      fecharFolhas();render();
      toast(criados.length+(criados.length===1?' lançamento confirmado':' lançamentos confirmados'),
        txtPend(criados),'Desfazer',function(){
          var ids2={};criados.forEach(function(e){ids2[e.id]=1;});
          DB.exp=DB.exp.filter(function(e){return !ids2[e.id];});
          salvar();render();
        });
    };
    b.appendChild(avisoSV);
    b.appendChild(btn);
    atualizar();
  },{cancelar:'Cancelar'});
}

function resumoMolde(r){
  var quando=r.freq==='anual'
    ? ('todo ano em '+MES[Math.max(0,Math.min(11,(parseInt(r.mes,10)||1)-1))]+' · dia '+(parseInt(r.dia,10)||1))
    : ('todo dia '+(parseInt(r.dia,10)||1));
  return nomeCat(r.cat)+' · '+quando+' · '+(r.fixo===false?'variável':'fixo');
}

function folhaRecorrentes(){
  /* v33: `lista` é usada lá dentro, nos cliques, que só acontecem DEPOIS de a
     folha existir. O `var` é içado, então a referência resolve no toque. */
  var lista=folha('Recorrentes',function(b){
    var L=DB.rec||[];
    if(!L.length){
      b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+
        'Nenhuma recorrência ainda. Aluguel, condomínio e assinaturas são os candidatos '+
        'óbvios — e também os que mais somem do registro.</div>'));
    }else{
      var w=el('<div class="optwrap"></div>');
      L.slice().sort(function(a,b2){return String(a.n).localeCompare(String(b2.n),'pt-BR');})
       .forEach(function(r){
        var c=cat(r.cat)||{c:'#78716C'};
        var ent=eEntrada(r.cat);
        var enc=r.ate?(' · encerrada em '+mesCurto(r.ate)):'';
        var o=el('<button class="grow tap"><div><div class="r1">'+
          (emojiSub(r.cat,r.sub)||'🔁')+' '+esc(r.n)+'</div>'+
          '<div class="r2">'+esc(resumoMolde(r)+enc)+'</div></div>'+
          /* v19: o til saiu e o lado entrou.
             O til queria dizer "valor de referência, varia todo mês" — mas num
             app de dinheiro a marca ANTES do número é sinal, e a 15px o til de
             -apple-system tem a mesma altura e a mesma largura do menos. Quem
             lê vê "−1.760,00". E ele era redundante: a linha de baixo já diz
             "variável", com todas as letras.
             No lugar dele entra o que estava faltando de verdade: ENTRADA e
             SAÍDA na mesma lista estavam idênticas — "Crédito alimentação" é
             dinheiro entrando e aparecia igual ao condomínio. Agora segue a
             mesma regra do resto do app (blocoCats): entrada com sinal e cor,
             saída sem sinal, R$ nos dois. */
          '<div class="right"><span class="tnum'+(ent?' vin':'')+'">'+
          (ent?brlSinRS(r.v):('R$ '+brl(r.v)))+'</span>'+
          ICO.chev+'</div></button>');
        o.onclick=function(){folhaMolde(r,null,lista);};
        w.appendChild(o);
      });
      b.appendChild(w);
      b.appendChild(el('<div class="hint">O valor do <b>variável</b> é só referência: na '+
        'confirmação o app sugere o do último mês.</div>'));
    }
    var nova=el('<button class="btnfull sec">Nova recorrente</button>');
    nova.onclick=function(){folhaMolde(null,null,lista);};
    b.appendChild(nova);
  },{cancelar:'Fechar'});
}

/* Cria ou edita um molde. `base` prefixa os campos quando vem de um lançamento.
   `pai`, quando vem, é a folha de onde você saiu: o molde EMPILHA sobre ela e,
   ao salvar, devolve você para lá repintada — em vez de fechar as duas e te
   deixar na aba, duas telas abaixo de onde estava. */
function folhaMolde(r,base,pai){
  /* Sem categoria ativa não há molde possível, e a linha abaixo fazia
     catsOrdenadas(false)[0].id estourar — a folha nem abria, sem mensagem.
     A tela de registro já trata esse mesmo estado; aqui faltava. */
  if(!r&&!catsOrdenadas(false).length){
    alerta('Nenhuma categoria ativa',
      'Todas as categorias estão arquivadas. Reative uma em Ajustes → Categorias antes de criar uma recorrência.');
    return;
  }
  var novo=!r;
  var t=r?{n:r.n,cat:r.cat,sub:r.sub,v:r.v,fixo:r.fixo!==false,freq:r.freq||'mensal',
           dia:parseInt(r.dia,10)||1,mes:parseInt(r.mes,10)||1,ate:r.ate||null}
         :{n:(base&&base.n)||'',cat:(base&&base.cat)||catsOrdenadas(false)[0].id,
           sub:(base&&base.sub)||null,v:(base&&base.v)||0,fixo:true,freq:'mensal',
           dia:(base&&base.dia)||(+hoje().slice(8)),mes:+hoje().slice(5,7),ate:null};
  /* uma só saída, para os seis lugares que terminam a folha */
  function sair(){
    if(pai){f.fechar();pai.repintar();}else{fecharFolhas();}
    render();
  }
  var f=(pai?folhaSobre:folha)(novo?'Nova recorrente':esc(t.n||'Recorrente'),function(b,sh){
    var fn=el('<div class="field"><span class="k">Nome</span><input type="text" maxlength="40" value="'+esc(t.n)+'"></div>');
    var fc=el('<button class="field row"><span><span class="k">Categoria</span><span class="v"></span></span>'+ICO.chev+'</button>');
    var fs=el('<button class="field row"><span><span class="k">Sub-categoria</span><span class="v"></span></span>'+ICO.chev+'</button>');
    var sub2=el('<div class="optwrap" hidden style="margin-bottom:9px"></div>');
    /* v20 (item 30): era <input inputmode="decimal">, ou seja, o teclado do
       SISTEMA — outro app dentro do app, sem somadores e sem visor, e porta de
       entrada para texto que o registro proíbe. Vira linha tocável que abre o
       teclado do app; o valor vive em `t.v`, não no DOM. */
    var fv=el('<button class="field row tap"><span><span class="k">Valor de referência</span>'+
      '<span class="v tnum"></span></span>'+ICO.chev+'</button>');
    var fvv=fv.querySelector('.v');
    function pintaVal(){fvv.textContent='R$ '+brl(t.v||0);}
    pintaVal();
    fv.onclick=function(){
      folhaValor(t.fixo?'Valor do recorrente':'Valor de referência',t.v||0,
        {semSinal:true,rotulo:t.fixo?'Valor mensal':'Valor de referência'},
        function(v){t.v=Math.max(0,v);pintaVal();});
    };
    var fx=el('<div class="field"><span class="k">Valor</span><div class="seg" style="margin-top:6px"></div></div>');
    [[true,'Fixo'],[false,'Varia todo mês']].forEach(function(o){
      var x=el('<button aria-pressed="'+(t.fixo===o[0])+'">'+o[1]+'</button>');
      x.onclick=function(){t.fixo=o[0];pinta();};
      fx.querySelector('.seg').appendChild(x);
    });
    var ff=el('<div class="field"><span class="k">Frequência</span><div class="seg" style="margin-top:6px"></div></div>');
    [['mensal','Mensal'],['anual','Anual']].forEach(function(o){
      var x=el('<button aria-pressed="'+(t.freq===o[0])+'">'+o[1]+'</button>');
      x.onclick=function(){t.freq=o[0];pinta();};
      ff.querySelector('.seg').appendChild(x);
    });
    /* v26 (item 50): os três últimos controles do sistema do app moravam aqui.
       Mês e Pagamento eram <select> (roda do iOS) e Dia do mês era um
       <input inputmode="numeric"> (teclado do iOS) para escolher entre 1 e 31. */
    var fm=el('<button class="field row"><span><span class="k">Mês</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    fm.onclick=function(){
      folhaSobre('Mês',function(bb,fechar){
        var w=el('<div class="optwrap"></div>');
        MES.forEach(function(m,i){
          var o=el('<button class="opt"><span class="ic" style="font-size:13px">'+
            MESC[i]+'</span><span class="nm">'+m.charAt(0).toUpperCase()+m.slice(1)+'</span>'+
            (t.mes===i+1?'<span class="tag">✓</span>':'<span></span>')+'</button>');
          o.onclick=function(){fechar();t.mes=i+1;pinta();};
          w.appendChild(o);
        });

      },{cancelar:'Cancelar'});
    };
    var fd=el('<button class="field row"><span><span class="k">Dia do mês</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    fd.onclick=function(){
      folhaDiaMes(t.dia,function(n){t.dia=n;pinta();});
    };
    var resumo=el('<div class="hint" style="margin:2px 0 12px"></div>');
    var payAtual=((base&&base.pay)||(r&&r.pay))||null;
    /* v27 (item 9): o molde carrega etiquetas e elas passam para cada
       lançamento confirmado. Se "assinatura" é etiqueta, não faz sentido
       re-etiquetar todo mês. */
    var etqAtual=(((base&&base.etq)||(r&&r.etq))||[]).slice();
    var fq=el('<button class="field row"><span><span class="k">Etiquetas</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    fq.onclick=function(){
      folhaEtiquetas(etqAtual,function(ids){etqAtual=ids;pinta();});
    };
    var fp=el('<button class="field row"><span><span class="k">Pagamento</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    fp.onclick=function(){
      folhaPagto({sobre:true,valor:payAtual,ent:eEntrada(t.cat),
        aoEscolher:function(v){payAtual=v;pinta();}});
    };
    var ft=el('<div class="field"><span class="k">Descrição</span><input type="text" maxlength="80" value="'+esc((r&&r.desc)||(base&&base.desc)||'')+'"></div>');

    function escolhaEmLinha(itens,corDe,onPick){
      sub2.innerHTML='';sub2.hidden=false;
      itens.forEach(function(it){
        var o=el('<button class="opt" style="--c:'+corDe(it)+'"><span class="ic">'+it.e+'</span><span class="nm">'+esc(it.n)+'</span><span></span></button>');
        o.onclick=function(){onPick(it);sub2.hidden=true;sub2.innerHTML='';pinta();};
        sub2.appendChild(o);
      });
      sub2.scrollIntoView({block:'nearest'});
    }
    /* v33: o NOME de um recorrente criado a partir de um lançamento nasce com o
       nome da sub-categoria — e congela ali. Trocando a sub, o emoji (que é
       derivado) mudava e o nome não, e a lista mostrava "🍻 Almoço no trabalho".

       A regra: o nome acompanha a sub ENQUANTO for só o eco dela. Se você já o
       personalizou, ele é seu e não se mexe. E a troca acontece AQUI, no campo,
       na hora em que você escolhe — não escondida no salvar. Você vê o nome
       mudar e pode escrever outra coisa por cima antes de confirmar. */
    /* v35: o campo VAZIO também é "só o eco" — não há nada seu ali ainda.
       Sem esta primeira condição, a recorrente criada do zero nunca ganhava
       nome sozinha: o campo nasce vazio, `nomeSub(cat,null)` devolve o nome da
       CATEGORIA (ver p4_core), e a comparação abaixo concluía "é seu" sobre um
       campo em que você nunca escreveu. Uma regra só serve aos dois caminhos. */
    function seguirNome(catAnt,subAnt){
      var inp=fn.querySelector('input'),atual=inp.value.trim();
      if(atual&&atual!==nomeSub(catAnt,subAnt))return;       /* é seu: não mexo */
      inp.value=t.sub?nomeSub(t.cat,t.sub):'';
    }
    fc.onclick=function(){escolhaEmLinha(catsOrdenadas(true),function(c){return c.c;},
      function(c){var ca=t.cat,sa=t.sub;t.cat=c.id;t.sub=null;seguirNome(ca,sa);});};
    fs.onclick=function(){
      var c=cat(t.cat);if(!c||!c.subs.length)return;
      escolhaEmLinha(c.subs,function(){return c.c;},
        function(sNovo){var ca=t.cat,sa=t.sub;t.sub=sNovo.id;seguirNome(ca,sa);});
    };
    function pinta(){
      fc.querySelector('.v').textContent=nomeCat(t.cat);
      var c=cat(t.cat);
      fs.querySelector('.v').textContent=t.sub?nomeSub(t.cat,t.sub):(c&&c.subs.length?'escolher':'sem sub-categorias');
      Array.prototype.forEach.call(fx.querySelectorAll('.seg button'),function(x,i){
        x.setAttribute('aria-pressed',String(t.fixo===(i===0)));});
      Array.prototype.forEach.call(ff.querySelectorAll('.seg button'),function(x,i){
        x.setAttribute('aria-pressed',String(t.freq===(i===0?'mensal':'anual')));});
      fm.hidden=(t.freq!=='anual');
      /* v26: os três campos que deixaram de ser controles do sistema agora
         precisam de alguém que escreva o valor escolhido neles */
      fm.querySelector('.v').textContent=MES[t.mes-1].charAt(0).toUpperCase()+MES[t.mes-1].slice(1);
      fd.querySelector('.v').textContent='dia '+t.dia;
      var pgm=null;PAGTOS.forEach(function(x){if(x[0]===payAtual)pgm=x;});
      fp.querySelector('.v').textContent=pgm?(pgm[1]+' '+pgm[0]):'opcional';
      fq.querySelector('.v').textContent=rotuloEtq(etqAtual)||'nenhuma';
      var ini=(r&&r.inicio)||mkey(hoje());
      var quando=t.freq==='anual'
        ? ('Todo ano em '+MES[t.mes-1]+', dia '+t.dia)
        : ('Todo dia '+t.dia);
      resumo.innerHTML='<b>'+esc(quando)+', a partir de '+esc(mesLabel(ini))+'.</b> '+
        (t.fixo?'Confirmação com um toque, porque o valor é fixo.'
               :'A cada mês o app sugere o valor do mês anterior para você ajustar.');
    }
    pinta();
    [fn,fc,fs,sub2,fv,fx,ff,fm,fd,resumo,fp,fq,ft].forEach(function(n){b.appendChild(n);});

    var ok=el('<button class="btnfull">Salvar</button>');
    ok.onclick=function(){
      var nome=(fn.querySelector('input').value||'').trim();
      /* v20 (item 30): o valor vive em `t.v`, não no DOM — o campo virou
         linha tocável que abre o teclado do app. */
      var v=t.v||0;
      if(!nome){alerta('Falta o nome','Dê um nome à recorrência — é ele que aparece na faixa de pendências.');return;}
      /* `!v` deixava passar negativo (−100 é truthy) e nascia um molde que gera
         pendência impossível de confirmar: o botão fica aceso e não faz nada. */
      if(!(v>0)){alerta('Valor inválido','Informe um valor de referência maior que zero. Recorrência não aceita valor negativo — um estorno é um lançamento avulso.');return;}
      if(novo){
        /* Quando o molde nasce de um lançamento que já existe, esse lançamento
           VIRA a primeira confirmação. Sem isso o app cobraria o mês atual de
           novo e você acabaria com a mesma despesa em dobro. */
        var orig=base&&base.vinc?base.vinc:null;
        var ini=orig?mkey(orig.d):mkey(hoje());
        var r2={id:uid('r'),n:nome,cat:t.cat,sub:t.sub,v:v,fixo:t.fixo,freq:t.freq,
                dia:t.dia,mes:t.mes,inicio:ini,ate:null,
                pay:payAtual||null,etq:etqAtual.length?etqAtual.slice():undefined,
                desc:ft.querySelector('input').value||'',pulados:[],ts:Date.now()};
        DB.rec=DB.rec||[];DB.rec.push(r2);
        var antesOrig=orig?{rec:orig.rec,comp:orig.comp}:null;
        if(orig){orig.rec=r2.id;orig.comp=mkey(orig.d);}
        if(!salvar()){
          DB.rec.pop();
          if(orig){orig.rec=antesOrig.rec;orig.comp=antesOrig.comp;}
          return;
        }
        sair();
        toast('Recorrente criada',
          r2.n+' · '+resumoMolde(r2)+(orig?' · este lançamento virou a 1ª confirmação':''),
          'Desfazer',function(){
          DB.rec=DB.rec.filter(function(x){return x.id!==r2.id;});
          if(orig){
            if(antesOrig.rec===undefined)delete orig.rec;else orig.rec=antesOrig.rec;
            if(antesOrig.comp===undefined)delete orig.comp;else orig.comp=antesOrig.comp;
          }
          salvar();render();});
      }else{
        var antes=JSON.parse(JSON.stringify(r));
        r.n=nome;r.cat=t.cat;r.sub=t.sub;r.v=v;r.fixo=t.fixo;r.freq=t.freq;
        r.dia=t.dia;r.mes=t.mes;r.pay=payAtual||null;
        if(etqAtual.length)r.etq=etqAtual.slice();else delete r.etq;
        r.desc=ft.querySelector('input').value||'';
        if(!salvar()){for(var k in antes)r[k]=antes[k];return;}
        sair();
        toast('Recorrente atualizada',r.n+' · '+resumoMolde(r),'Desfazer',function(){
          for(var k2 in antes)r[k2]=antes[k2];salvar();render();});
      }
    };
    b.appendChild(ok);

    if(!novo){
      var conf=confirmadosDe(r.id),pul=(r.pulados||[]);
      b.appendChild(el('<div class="hint" style="margin-top:10px">Ativa desde '+
        esc(mesLabel(r.inicio||mkey(hoje())))+'. <b>'+conf+
        (conf===1?' lançamento confirmado':' lançamentos confirmados')+'</b>'+
        (pul.length?(', '+pul.length+(pul.length===1?' mês pulado':' meses pulados')):'')+'.</div>'));
      if(pul.length){
        b.appendChild(el('<div class="glabel">Meses pulados</div>'));
        var wp=el('<div class="optwrap"></div>');

              function(){pularComp(r,m);salvar();render();});
          };
          wp.appendChild(o);
        });

        b.appendChild(el('<div class="hint">Reativar devolve o mês para a lista de pendentes.</div>'));
      }
      var enc=el('<button class="btnfull sec" style="margin-top:12px">'+
        (r.ate?'Reativar a recorrência':'Encerrar recorrência')+'</button>');
      enc.onclick=function(){
        if(r.ate){
          var antes2=r.ate;r.ate=null;
          if(!salvar()){r.ate=antes2;return;}

            r.ate=antes2;salvar();render();});
        }else{folhaEncerrar(r,pai||f);}

      b.appendChild(enc);
      var del=el('<button class="btnfull dan">Excluir recorrência</button>');
      del.onclick=function(){excluirMolde(r,pai||f);};

function folhaEncerrar(r,pai){
  var mk=mkey(hoje());
  var abertas=pendentes().filter(function(x){return x.rec===r.id;}).length;
  var conf=confirmadosDe(r.id);
  function sair(){
    if(pai){f.fechar();pai.repintar();}else{fecharFolhas();}
    render();
  }
  var f=(pai?folhaSobre:folha)('Encerrar '+r.n+'?',function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 12px">'+
      'Ele deixa de aparecer para confirmação a partir do mês escolhido.</div>'));
    /* v26 (item 50): era um <select> de meses, ou seja, a roda do iOS. */
    var escolhido=mk;
    var f=el('<button class="field row"><span><span class="k">Encerrar a partir de</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    function pintaEnc(){f.querySelector('.v').textContent=mesLabel(escolhido);}
    f.onclick=function(){
      folhaSobre('Encerrar a partir de',function(bb,fechar){
        var w=el('<div class="optwrap"></div>');
        for(var i=-2;i<=6;i++){
          (function(m){
            var o=el('<button class="opt"><span class="ic" style="font-size:13px">'+
              MESC[+m.slice(5,7)-1]+'</span><span class="nm">'+mesLabel(m)+'</span>'+
              (escolhido===m?'<span class="tag">✓</span>':'<span></span>')+'</button>');
            o.onclick=function(){fechar();escolhido=m;pintaEnc();};
            w.appendChild(o);
          })(addMes(mk,i));
        }
        bb.appendChild(w);
      },{cancelar:'Cancelar'});
    };
    pintaEnc();
    b.appendChild(f);
    b.appendChild(el('<div class="hint" style="margin:8px 0 14px">Os <b>'+conf+
      (conf===1?' lançamento já confirmado continua':' lançamentos já confirmados continuam')+
      '</b> na sua lista, intocados.'+
      (abertas?('<br>Há <b>'+abertas+(abertas===1?' pendência não confirmada':' pendências não confirmadas')+
        '</b> — ela'+(abertas===1?'':'s')+' some'+(abertas===1?'':'m')+' junto.'):'')+'</div>'));
    var ok=el('<button class="btnfull">Encerrar</button>');
    ok.onclick=function(){
      var antes=r.ate;
      /* `ate` é a ÚLTIMA competência que ainda vale, então encerrar "a partir de
         novembro" grava outubro. */
      r.ate=addMes(escolhido,-1);
      if(!salvar()){r.ate=antes;return;}
      sair();
      toast('Recorrente encerrada',r.n+' não aparece mais a partir de '+mesLabel(escolhido),'Desfazer',
        function(){r.ate=antes;salvar();render();});
    };
    b.appendChild(ok);
    /* v21 (item 27): o "Cancelar" de baixo saiu — o cabeçalho desta folha já
       cancela, e dois jeitos de desistir na mesma tela é ruído, não escolha. */
  });
}

function excluirMolde(r,pai){
  var conf=confirmadosDe(r.id);
  function sair(){
    if(pai){f.fechar();pai.repintar();}else{fecharFolhas();}
    render();
  }
  var f=(pai?folhaSobre:folha)('Excluir '+r.n+'?',function(b){
    b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+
      'Os <b>'+conf+(conf===1?' lançamento já confirmado continua':' lançamentos já confirmados continuam')+
      '</b> na sua lista. Some só o molde e as pendências ainda não confirmadas.<br><br>'+
      'Para uma recorrência que simplesmente acabou, <b>encerrar</b> é melhor: guarda a '+
      'configuração e o histórico, e dá para reativar.</div>'));
    var enc=el('<button class="btnfull sec">Encerrar em vez de excluir</button>');
    enc.onclick=function(){if(pai){f.fechar();}else{fecharFolhas();}folhaEncerrar(r,pai);};
    b.appendChild(enc);
    var ok=el('<button class="btnfull dan">Excluir a recorrência</button>');
    ok.onclick=function(){
      var i=DB.rec.indexOf(r);if(i<0)return;
      DB.rec.splice(i,1);
      if(!salvar()){DB.rec.splice(i,0,r);return;}
      sair();
      toast('Recorrente excluída',conf?(conf+(conf===1?' lançamento mantido':' lançamentos mantidos')):'Nenhum lançamento afetado','Desfazer',
        function(){DB.rec.splice(i,0,r);salvar();render();});
    };
    b.appendChild(ok);
    /* v21 (item 27): o "Cancelar" de baixo saiu — o cabeçalho desta folha já
       cancela, e dois jeitos de desistir na mesma tela é ruído, não escolha. */
  });
}

/* atalho: cria o molde a partir de um lançamento que já existe */
function tornarRecorrente(o){
  var e=compraDe(o)||o;
  /* de um estorno não nasce molde negativo; o valor entra em módulo e o dono
     decide. E de uma compra parcelada o que se repete é a PARCELA, não o total
     — sugerir 4.800/mês a partir de uma compra de 4.800 em 6× é absurdo. */
  var vSug=Math.abs(nParc(e)>1?fatiar(e.v,nParc(e))[0]:e.v);
  folhaMolde(null,{n:nomeSub(e.cat,e.sub),cat:e.cat,sub:e.sub,v:vSug,
                   pay:e.pay,desc:e.desc,dia:(+e.d.slice(8)),vinc:e});
}

function folhaPeriodo(){
  folha('Período',function(b){
    var w=el('<div class="optwrap"></div>');

      ['mes','🗓️','Mês','navegue com as setas'],
      ['ano','📆','Ano inteiro',''],

      ['dia','📅','Data específica',S.periodo==='dia'?porExtenso(S.dia):'um único dia'],
      ['faixa','↔️','Intervalo',S.periodo==='faixa'?(diaCurto(S.de)+' a '+diaCurto(S.ate)):'de uma data a outra']
    ];

      var o=el('<button class="opt"><span class="ic">'+p[1]+'</span>'+
        '<span class="nm">'+p[2]+(p[3]?'<small>'+esc(p[3])+'</small>':'')+'</span>'+
        (S.periodo===p[0]?'<span class="tag">✓</span>':'<span></span>')+'</button>');
      /* Mês, ano e tudo aplicam na hora. Dia e intervalo precisam de uma data,
         então abrem o calendário — e só lá é que S.periodo muda. Sair do

      o.onclick=function(){
        if(p[0]==='dia'||p[0]==='faixa'){fecharFolhas();folhaCalendario(p[0]);return;}
        S.periodo=p[0];fecharFolhas();render();
      };
      w.appendChild(o);
    });
    b.appendChild(w);
    b.appendChild(el('<div class="glabel">Ordenar por</div>'));

/* ---------------- calendário (v12) ----------------
   Grade própria em vez do seletor nativo do iOS. A escolha foi sua, em 22/09,
   depois de ver as duas alternativas lado a lado: o nativo custava ~40 linhas e
   não sabe pintar um intervalo; este custa o que está aqui e mostra o intervalo
   como intervalo.

   Uma correção em relação ao mockup: os dias FUTUROS não ficam apagados. O
   mockup os desenhava assim por analogia com a folha de data de um lançamento,
   onde futuro não existe — mas a lista mostra `ocorrencias()`, e uma compra em 6×
   tem parcelas em meses que ainda não chegaram. Apagar o futuro aqui esconderia
   justamente o que as setas de mês já deixam ver.
   ---------------------------------------------------- */
function limitesCal(){
  var min=mkey(hoje()),max=mkey(hoje());
  ocorrencias().forEach(function(o){
    var m=mkey(o.d);
    if(m<min)min=m;
    if(m>max)max=m;
  });
  return {min:min,max:max};
}
/* v25: o calendário deixou de ser exclusivo do filtro da lista.
   Com `cfg` ele vira um seletor de data qualquer — {valor, min, max, titulo,
   aoEscolher} — e passa a servir qualquer campo de data do app. Foi o que
   permitiu tirar o primeiro `<input type="date">` de cena: o app tinha
   calendário próprio desde a v12 e continuava abrindo o do sistema. */
function folhaCalendario(modo,cfg){
  var livre=!!cfg;
  var lim=livre?{min:mkey(cfg.min||'2000-01-01'),max:mkey(cfg.max||hoje())}:limitesCal();
  var a=null,b=null;
  if(livre)a=cfg.valor||hoje();
  else if(modo==='dia')a=(S.periodo==='dia'?S.dia:hoje());
  else if(S.periodo==='faixa'){a=S.de;b=S.ate;}
  var mesCal=mkey(a||hoje());
  if(mesCal<lim.min)mesCal=lim.min;
  if(mesCal>lim.max)mesCal=lim.max;

  /* Em modo livre a folha vem de `folhaSobre`, porque ela abre EM CIMA de
     outra (a do estorno, por exemplo) e precisa fechar só a si mesma — é o
     mesmo mecanismo que a folha de valor usa desde a v12. */
  var abrir=livre?folhaSobre:folha,fechaEsta=null;
  abrir(livre?(cfg.titulo||'Data'):(modo==='dia'?'Data específica':'Intervalo'),function(bd,fecharMe){
    fechaEsta=fecharMe||fecharFolhas;

    function aplicar(){
      if(livre){
        if(!a)return;

        if(!a)return;
        S.periodo='dia';S.dia=a;
      }else{
        if(!a||!b)return;
        /* Escolher a ponta final antes da inicial é um engano comum e barato de
           perdoar: o app troca as duas em silêncio em vez de devolver lista
           vazia. Daqui para baixo, S.de <= S.ate é invariante. */
        S.periodo='faixa';S.de=(a<b?a:b);S.ate=(a<b?b:a);
      }
      fecharFolhas();render();
    }
    lz.onclick=function(){a=null;b=null;pinta();};
    ok.onclick=aplicar;

    function tocar(d){
      if(modo==='dia'){a=d;pinta();aplicar();return;}
      if(!a||(a&&b)){a=d;b=null;}

    }

    function pinta(){
      wrap.innerHTML='';
      var y=+mesCal.slice(0,4),m=+mesCal.slice(5,7);
      var hd=el('<div class="calhd"><button class="pb" aria-label="Mês anterior">'+ICO.esq+'</button>'+
        '<div class="m">'+mesLabel(mesCal)+'</div>'+
        '<button class="pb" aria-label="Próximo mês">'+ICO.dir+'</button></div>');
      var pbs=hd.querySelectorAll('.pb');
      pbs[0].disabled=(mesCal<=lim.min);
      pbs[1].disabled=(mesCal>=lim.max);
      pbs[0].onclick=function(){mesCal=addMes(mesCal,-1);pinta();};
      pbs[1].onclick=function(){mesCal=addMes(mesCal,1);pinta();};
      wrap.appendChild(hd);

      var dw=el('<div class="caldow"></div>');
      ['D','S','T','Q','Q','S','S'].forEach(function(x,i){
        dw.appendChild(el('<span aria-hidden="true">'+x+'</span>'));
      });
      wrap.appendChild(dw);

      var g=el('<div class="calgrid"></div>');
      var vazias=new Date(y,m-1,1).getDay();
      for(var i=0;i<vazias;i++)g.appendChild(el('<span class="cday out" aria-hidden="true"></span>'));
      var ini=(a&&b)?(a<b?a:b):a, fim=(a&&b)?(a<b?b:a):null;
      var n=diasNoMes(mesCal);
      for(var d=1;d<=n;d++){
        var ds=mesCal+'-'+String(d).padStart(2,'0');
        var cl='cday';
        if(ini&&fim&&ds>=ini&&ds<=fim){

        }

        if(!fim&&ds===ini)cl+=' ponta';
        if(ds===hoje())cl+=' hoje';
        var fora=livre&&((cfg.min&&ds<cfg.min)||(cfg.max&&ds>cfg.max));

          (fora?' disabled':'')+

        (function(x){bt.onclick=function(){tocar(x);};})(ds);

      var txt;

      else if(!a)txt='Toque no primeiro dia';
      else if(!b)txt='De <b>'+esc(diaCurto(a))+'</b> · toque no dia final';
      else{
        var i2=(a<b?a:b),f2=(a<b?b:a),qt=diasEntre(i2,f2)+1;
        txt='De <b>'+esc(diaCurto(i2))+'</b> até <b>'+esc(diaCurto(f2))+'</b> · '+qt+(qt===1?' dia':' dias');
      }

      ft.appendChild(lz);
      wrap.appendChild(ft);
      ok.disabled=!(a&&b);

    pinta();

    }else if(modo==='dia'){
      bd.appendChild(el('<div class="hint">Tocar num dia já aplica o filtro. '+
        'Depois, as setas da lista andam de um dia por vez.</div>'));
    }else{
      bd.appendChild(el('<div class="hint">Toque no primeiro dia e depois no último. '+
        'As duas pontas entram na conta. Na lista, as setas ficam desligadas '+
        'enquanto o intervalo estiver ativo.</div>'));

/* v15 (ideia 5): o que entrou em cada lado de "Como o mês se formou".
   O cartão diz o critério numa linha; esta folha mostra os lançamentos, que é
   a única forma de você conferir se o critério pegou o que devia. */
function folhaFormacao(noMes,mk){
  var sai=saidasDe(noMes),comp=[],dec=[];
  sai.forEach(function(e){
    if((e.pi&&e.pi>=2)||e.rec)comp.push(e);else dec.push(e);
  });
  var soma=function(l){return l.reduce(function(a,x){return a+x.v;},0);};
  folha('Como o mês se formou',function(b){
    var lado=function(titulo,lista,cls){
      if(!lista.length)return;
      b.appendChild(el('<div class="glabel">'+titulo+' · R$ '+brl(soma(lista))+'</div>'));
      var w=el('<div class="optwrap"></div>');
      /* v17: ordenado por CATEGORIA dentro de cada lado, e não pelo valor solto.
         Uma linha por lançamento continua sendo a unidade — o corte desta folha
         é comprometido × decidido, e categoria é ortogonal a ele: Moradia pode
         ter o aluguel de molde de um lado e um conserto à vista do outro.
         Agrupar de verdade diria que a categoria escolheu um lado. O que muda é
         só a ordem: as categorias entram pelo peso que têm NAQUELE lado, e as
         linhas de uma mesma categoria ficam vizinhas. */
      var totCat={};
      lista.forEach(function(e){totCat[e.cat]=(totCat[e.cat]||0)+e.v;});
      lista.sort(function(a,x){
        if(a.cat!==x.cat){
          if(totCat[x.cat]!==totCat[a.cat])return totCat[x.cat]-totCat[a.cat];
          return a.cat<x.cat?-1:1;   /* empate de peso: ordem estável, não sorteio */
        }
        return x.v-a.v;
      }).forEach(function(e){
        var c=cat(e.cat)||{e:'❓',n:'—'};
        var porq=e.rec?'recorrente':(e.pi>=2?('parcela '+e.pi+'/'+e.pn):'à vista');
        w.appendChild(el('<div class="opt"><span class="ic">'+c.e+'</span>'+
          '<span class="nm">'+esc(e.desc||c.n)+
          '<small>'+esc(c.n)+' · '+porq+' · '+esc(diaCurto(e.d))+'</small></span>'+
          '<span class="tag tnum">R$ '+brl(e.v)+'</span></div>'));
      });
      b.appendChild(w);
    };
    lado('Já comprometido',comp,'a');
    lado('Decidido neste mês',dec,'b');
    b.appendChild(el('<div class="hint" style="margin-top:14px">Só é "recorrente" o que veio '+
      'de um <b>molde</b>. Uma despesa fixa digitada na mão todo mês aparece aqui como '+
      'decidida neste mês — e o número do cartão erra para menos.</div>'));
  },{cancelar:'Fechar'});
}

/* v14 (ideia 1): "O que mudou".
   A pergunta que o delta provoca e que a tela nunca respondeu. A lista sai
   ordenada pela VARIAÇÃO em reais, não pelo tamanho — é o que a folha tem de
   diferente do ranking: Moradia é sempre a maior categoria e por isso nunca
   chama atenção no ranking; aqui ela aparece quando SAI DO LUGAR dela.
   O seletor no topo escolhe a régua, e só existe quando há mais de uma. */
/* ============================================================
   ITEM 4 — A EVOLUÇÃO MENSAL
   ============================================================
   A folha que a sparkline do Resumo abre. Doze meses, uma série por vez.

   Por que uma série por vez, e não várias sobrepostas: são 15 categorias, e
   três linhas num gráfico de 361px já viram espaguete. Além disso a pergunta
   que esta tela responde é "essa categoria está subindo?", que é a categoria
   contra ELA MESMA no tempo — comparar categorias entre si é o que o ranking
   do Resumo já faz, e faz melhor.

   O que ela NÃO faz: filtrar o Resumo. Você entra, olha e sai; o mês e o lado
   continuam sendo os de trás. Um seletor que mudasse a tela de baixo seria um
   segundo sistema de filtros competindo com o da aba Lançamentos.
*/
function corDaSerie(modo,cat_){
  if(modo==='cat'&&cat_)return cat_.c;
  return getComputedStyle(document.documentElement)
    .getPropertyValue('--tint').trim()||'#0A84FF';
}
/* A média que a régua tracejada mostra: só meses FECHADOS.
   O mês em curso puxaria a régua para baixo todo dia 1º e a faria subir ao
   longo do mês — uma referência que se mexe sozinha não é referência. */
function mediaEvo(serie,parcial){
  var f=parcial?serie.slice(0,-1):serie;
  if(!f.length)return 0;
  var t=0;for(var i=0;i<f.length;i++)t+=f[i].v;
  return Math.round(t/f.length);
}
function desenhaEvo(host,serie,sel,cor,parcial,aoTocar){
  host.innerHTML='';
  var n=serie.length,i;
  var med=mediaEvo(serie,parcial);
  var mx=0;for(i=0;i<n;i++)if(serie[i].v>mx)mx=serie[i].v;
  if(med>mx)mx=med;
  var topo=Math.round(mx*1.12)||1;
  var plot=el('<div class="evoplot" style="--bar:'+cor+'"></div>');
  var barras=el('<div class="evobars"></div>');
  serie.forEach(function(x,j){
    var cls='';
    if(parcial&&j===n-1)cls+=' parc';
    if(j===sel)cls+=' on';
    /* 3px de piso: um mês zerado tem que continuar sendo um alvo de toque e
       tem que aparecer. Barra de 0px é um mês que some do gráfico. */
    var h=Math.max(3,Math.round(x.v/topo*126));
    var bt=el('<button class="evobar'+cls+'" aria-label="'+esc(mesLabel(x.m))+'">'+
      '<i style="height:'+h+'px"></i></button>');
    bt.onclick=function(){aoTocar(j);};
    barras.appendChild(bt);
  });
  plot.appendChild(barras);
  /* A régua da média não leva rótulo em cima: ela cruza o gráfico na altura em
     que as barras estão, e qualquer posição do rótulo tapava uma delas. O
     número já está escrito por extenso no cabeçalho, uma linha acima. */
  if(med>0){
    var y=126-Math.round(med/topo*126);
    plot.appendChild(el('<div class="evomed" style="top:'+y+'px"></div>'));
  }
  host.appendChild(plot);
  var labs=el('<div class="evolab"></div>');
  serie.forEach(function(x,j){
    /* rótulo sim, rótulo não: doze nomes de mês em 361px encostam um no outro.
       O mês tocado sempre mostra o dele, esteja em que posição estiver. */
    var mostra=(j%2===1)||(j===sel);
    labs.appendChild(el('<span class="'+(j===sel?'on':'')+'">'+
      (mostra?MESC[+x.m.slice(5,7)-1]:'')+'</span>'));
  });
  host.appendChild(labs);
}

function folhaMudou(mk,ent){
  var regs=reguas(mk,ent);
  if(!regs.length)return;
  var i=0;
  folha('O que mudou',function(b){
    var corpo=el('<div></div>');
    if(regs.length>1){
      var sg=el('<div class="seg" style="margin:2px 0 12px"></div>');
      regs.forEach(function(r,j){
        var bt=el('<button aria-selected="'+(j===i)+'">'+esc(r.rot)+'</button>');
        bt.onclick=function(){
          if(j===i)return;
          i=j;
          sg.querySelectorAll('button').forEach(function(x,k){
            x.setAttribute('aria-selected',k===i);});
          pinta(corpo,mk,regs[i],ent);
        };
        sg.appendChild(bt);
      });
      b.appendChild(sg);
    }
    b.appendChild(corpo);
    pinta(corpo,mk,regs[i],ent);
    /* v16: dizer o que FALTA e por quê.
       As réguas somem quando não há base, e sumir em silêncio faz você procurar
       um controle que nunca esteve lá — foi exatamente o que aconteceu. Uma
       linha no rodapé, só quando falta alguma, resolve sem trazer de volta um
       botão morto. */
    var tem={};regs.forEach(function(r){tem[r.id]=1;});
    var faltam=[],nf=mesesAntes(mk);
    if(!tem.ant)faltam.push('A comparação com o <b>mês anterior</b> aparece quando '+
      esc(mesCurto(addMes(mk,-1)))+' tiver saída na base.');
    /* o texto diz 4 e não 6 porque a régua nasce com 4 meses fechados e se
       chama pelo número que tem — "Média de 4m". Prometer 6 aqui seria a
       mesma mentira que a v14 tirou do rótulo. */
    if(!tem.media)faltam.push('A <b>média dos meses anteriores</b> aparece a partir de '+
      '4 meses fechados na base — hoje há '+nf+(nf===1?' mês.':' meses.'));
    if(!tem.ano)faltam.push('A comparação com <b>'+esc(mesCurto(addMes(mk,-12)))+
      '</b> aparece quando esse mês tiver saída na base.');
    if(faltam.length)b.appendChild(el('<div class="hint" style="margin-top:16px">'+
      faltam.join('<br>')+'</div>'));
  },{cancelar:'Fechar'});
}
function pinta(corpo,mk,reg,ent){

      ? '<i style="left:50%;width:'+larg.toFixed(1)+'%;background:var(--warn)"></i>'
      : '<i style="right:50%;width:'+larg.toFixed(1)+'%;background:var(--ok)"></i>';
    var de=x.antes>0?('R$ '+brl(x.antes)):'sem gasto';
    var pa=x.agora>0?('R$ '+brl(x.agora)):'sem gasto';
    var r=el('<button class="varrow">'+
      '<span class="bn"><span>'+c.e+'</span><em>'+esc(c.n)+'</em></span>'+
      '<span class="bv tnum '+(x.v>0?'up':'down')+'">'+brlSinRS(x.v)+'</span>'+
      '<span class="eixo">'+barra+'</span>'+

function folhaDetalheCat(catId,mk){

  var agg={};itens.forEach(function(e){var k=e.sub||'—';agg[k]=(agg[k]||0)+e.v;});
  var rank=Object.keys(agg).map(function(k){return {id:k,v:agg[k]};}).sort(function(a,b){return b.v-a.v;});

        '<span class="bv tnum">R$ '+brl(r.v)+'</span>'+

    b.appendChild(bars);
  },{cancelar:'Fechar'});
}

    if(nParc(cp)>1&&!eEntrada(cp.cat)){

       "nenhuma" e a lista atrás continuava sem o rótulo até você trocar de
       aba e voltar — o dado estava certo e a tela mentia, que é o pior dos

       Redesenhar tem que ser no lugar: a lista atrás está rolada até o

        (a[3]?('<em>'+esc(a[3])+'</em>'):'')+'</span><span></span></button>');
      o.onclick=a[2];w.appendChild(o);
      if(a[1]==='Etiquetas')linhaEtq=o;
    });

  },{cancelar:'Fechar'});
}
/* ---------------- estorno vinculado (item 28, formato 6) ----------------
   O que a folha precisa deixar claro, porque nada disso é óbvio: um estorno
   vinculado mexe em vários meses de uma vez e num número do Resumo. Por isso
   ela mostra o efeito ANTES de gravar. */
function previaEstorno(compra,quanto,data){
  var falso={};for(var k in compra)falso[k]=compra[k];
  falso.est=(compra.est||[]).concat([{d:data,v:quanto}]);
  var antes=ocorrenciasDe(compra),depois=ocorrenciasDe(falso);
  function porMes(L){var m={};L.forEach(function(o){var x=mkey(o.d);m[x]=(m[x]||0)+o.v;});return m;}
  var a=porMes(antes),b=porMes(depois),mudou=[],vistos={};
  Object.keys(a).concat(Object.keys(b)).forEach(function(m){
    if(vistos[m])return;vistos[m]=1;
    if((a[m]||0)!==(b[m]||0))mudou.push({m:m,de:a[m]||0,para:b[m]||0});
  });
  mudou.sort(function(x,y){return x.m<y.m?-1:1;});
  var somem=mudou.filter(function(x){return x.para===0&&x.de>0;});
  var dev=depois.filter(function(o){return o.dev&&o.d===data;});
  return {mudou:mudou,somem:somem,dev:dev.length?dev[0].v:0,
          antesFrente:comprometidoDe(antes),depoisFrente:comprometidoDe(depois)};
}
/* o mesmo critério do bloco do Resumo, mas sobre uma lista dada — para poder
   comparar o antes e o depois sem gravar nada */
function comprometidoDe(L){
  var mk=mkey(hoje()),t=0;
  L.forEach(function(o){
    if(o.pn<2||eEntrada(o.cat))return;
    if(mkey(o.d)<=mk)return;
    t+=o.v;
  });
  return t;
}

      var p=previaEstorno(compra,st.v,st.d);
      var li=[];
      if(p.somem.length){
        var ms=p.somem.map(function(x){return mesLabel(x.m).split(' de ')[0];});

      if(p.antesFrente!==p.depoisFrente)
