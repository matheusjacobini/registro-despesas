<style>
/* ============================================================
   TOKENS — padrão Apple (HIG). Três estados de tema:
   :root                       -> claro (base, sempre definido)
   prefers-color-scheme: dark  -> escuro, salvo se o usuário fixou claro
   [data-theme="escuro"]       -> escuro forçado
   ============================================================ */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --fill:#EFEFF4;
  --fill2:#E3E3E8;
  --ink:#000000;
  --ink2:rgba(60,60,67,.88);
  --muted:rgba(60,60,67,.60);
  /* v21 (item 27): --muted é o secondaryLabel da Apple, pensado para 13px+.
     Nos textos de 10 a 12,5px deste app ele media 3,30:1 contra o fundo, abaixo
     dos 4,5:1 de texto normal. --muted2 é o mesmo cinza, mais opaco, só para
     os pequenos — medido em 4,6:1 no claro e 4,8:1 no escuro. */
  --muted2:rgba(60,60,67,.78);
  --faint:rgba(60,60,67,.30);
  --line:#E5E5EA;
  --line2:#D1D1D6;
  --tint:#0064D8;
  /* v38 (item 60) — CORES DE FUNDO TÊM TOKEN PRÓPRIO.
     `--tint` e `--danger` faziam DOIS trabalhos: cor de texto e fundo de texto
     branco. No tema claro os dois cabem na mesma cor; no escuro não cabem, e é
     por isso que o escuro tinha treze contrastes abaixo da régua.
     A regra que nasce aqui: NENHUMA COR É AO MESMO TEMPO COR DE TEXTO E FUNDO
     DE TEXTO BRANCO. Quem é fundo de texto branco tem `-solid` no nome.
     No claro os dois valem a cor de sempre: aqui nada muda de aparência. */
  --tint-solid:#0064D8;
  --tint-soft:rgba(0,100,216,.12);
  --danger:#D70015;
  --danger-solid:#D70015;
  --warn:#B25000;
  --ok:#0B7A34;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --r:14px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="claro"]){
    --bg:#000000;
    --card:#1C1C1E;
    --fill:#1C1C1E;
    --fill2:#2C2C2E;
    --ink:#FFFFFF;
    --ink2:rgba(235,235,245,.88);
    --muted:rgba(235,235,245,.60);
    --muted2:rgba(235,235,245,.78);
    --faint:rgba(235,235,245,.30);
    --line:#38383A;
    --line2:#48484A;
    --tint:#0A84FF;
    /* v38 (item 60): branco sobre #0A84FF dá 3,65:1 e sobre #FF6961 dá 2,82:1 —
       os dois reprovam. Escurecidos, dão 5,82:1 e 5,49:1. `--tint` e `--danger`
       NÃO mudam: como TEXTO eles passam (4,66:1 e 6,03:1), e escurecê-los
       quebraria justamente o que já funciona. */
    --tint-solid:#0B63C5;
    --tint-soft:rgba(10,132,255,.20);
    --danger:#FF6961;
    --danger-solid:#C2342F;
    --warn:#FFB340;
    --ok:#30D158;
    --shadow:none;
  }
}
:root[data-theme="escuro"]{
  --bg:#000000;
  --card:#1C1C1E;
  --fill:#1C1C1E;
  --fill2:#2C2C2E;
  --ink:#FFFFFF;
  --ink2:rgba(235,235,245,.88);
  --muted:rgba(235,235,245,.60);
  --muted2:rgba(235,235,245,.78);
  --faint:rgba(235,235,245,.30);
  --line:#38383A;
  --line2:#48484A;
  --tint:#0A84FF;
    /* v38 (item 60): branco sobre #0A84FF dá 3,65:1 e sobre #FF6961 dá 2,82:1 —
       os dois reprovam. Escurecidos, dão 5,82:1 e 5,49:1. `--tint` e `--danger`
       NÃO mudam: como TEXTO eles passam (4,66:1 e 6,03:1), e escurecê-los
       quebraria justamente o que já funciona. */
    --tint-solid:#0B63C5;
  --tint-soft:rgba(10,132,255,.20);
  --danger:#FF6961;
    --danger-solid:#C2342F;
  --warn:#FFB340;
  --ok:#30D158;
  --shadow:none;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* rede de segurança: SVG sem medida explícita estoura no Safari */
svg{width:20px;height:20px;flex:none}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   ESTRUTURA
   ============================================================ */
#app{
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg);
  height:100vh;      /* reserva para navegadores sem dvh */
  height:100dvh;
  overflow:hidden;
}
#hdr{grid-row:1}
#main{grid-row:2;position:relative;min-height:0;overflow:hidden}
#tabs{grid-row:3}

/* cabeçalho */
#hdr{
  /* O iOS desenha uma faixa de vidro logo abaixo da barra de status em apps da
     tela de início: o que ficar ali embaixo sai esfumaçado. Descemos o conteúdo
     do cabeçalho para fora dela, tirando do espaço de baixo para o custo em
     altura útil ficar em 4px em vez de 12px. */
  padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 4px;
  /* O `center` daqui continua como estava, e de propósito: quem alinha agora
     são as PEÇAS, com `align-self:start` (ver a linha única, logo abaixo).
     Eu tinha trocado isto para `start` junto com o resto; reintroduzir o
     defeito não derrubou verificação nenhuma, porque `align-self` no item
     vence `align-items` no contêiner — era uma linha que não fazia nada. */
  display:grid;grid-template-columns:56px minmax(0,1fr) 56px;align-items:center;gap:4px;
}
/* ============================================================
   v32 — A LINHA ÚNICA
   ============================================================
   A regra do cabeçalho passa a caber numa frase: MARCA, TÍTULO E "VOLTAR"
   SENTAM NA LINHA DO TÍTULO, em qualquer tela.

   Antes cada peça escolhia sozinha onde sentar dentro da grade, e o resultado
   eram três desalinhamentos medidos a 393px, todos levantados por você:

     · nas quatro abas o título ficava 3px ACIMA da marca (y 32,0 contra 35,0),
       porque o miolo reserva três linhas e as duas de baixo, vazias, ainda
       carregavam os 5px de margem dos pontinhos;
     · nos passos 2 e 3 o "Voltar" ficava 12,6px ABAIXO do título (39,4 contra
       26,8): ele centralizado na faixa inteira, o título presa na primeira
       linha;
     · e a marca — a única peça presente em TODAS as telas — pulava 8,2px ao
       trocar de aba (35,0 nas abas, 26,8 no registro).

   Agora o alinhamento é consequência da regra, não ajuste fino: tudo em
   y 26,8, nas cinco telas. E como as duas caixas vazias deixam de existir nas
   abas, o cabeçalho delas cai de 58px para 41,6px — 16,4px de altura útil
   devolvidos em quatro das cinco telas, de graça. */
#hdr:not(.reg) .htitle .s,#hdr:not(.reg) .dots{display:none}
.hbtn{
  padding:0 8px;display:flex;align-items:center;gap:2px;
  color:var(--tint);font-size:15px;border-radius:10px;
  /* a altura é a da linha do título, medida: 21,59px a 16px/600 */
  align-self:start;height:21.59px;min-height:0;position:relative;
}
/* O DESENHO encolhe para a linha; o ALVO DE TOQUE não. Ele cresce por fora,
   invisível, até 43,6px — porque diminuir alvo para alinhar seria trocar um
   defeito que se vê por um que só aparece quando o dedo erra. */
#hdr .hbtn:not(.logo)::after{content:'';position:absolute;inset:-12px -10px}
.hbtn.right{justify-content:flex-end;text-align:right}
/* colunas fixas: esconder um botão não pode empurrar o título para a coluna 1 */
#hleft{grid-column:1}
.htitle{grid-column:2}
#hright{grid-column:3}
.hbtn svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hbtn[hidden]{display:none}
/* A marca usa o azul de acento nos dois temas — o token --tint já muda sozinho
   (#007AFF no claro, #0A84FF no escuro). Branca no escuro competia com o título,
   que também é branco; azul ela conversa com os pontinhos de passo e com a aba ativa. */
.hbtn.logo{pointer-events:none;justify-content:flex-start;padding-left:6px;color:var(--tint)}
/* v20 (item 29): a marca escrita ao lado do símbolo, só na tela 1 do registro.

   v21, corrigindo a v20: a primeira versão trocava a grade do cabeçalho para
   `auto 1fr 56px` na tela 1, e isso quebrou o alinhamento em dois eixos ao
   mesmo tempo — medido, não estimado, depois que você apontou:

     · HORIZONTAL — com a coluna esquerda em 26px e a direita em 56, o miolo
       deixou de ser simétrico e os três pontinhos foram parar em x=181,5 num
       aparelho de 393px, 15px à esquerda do centro real (196,5).
     · VERTICAL — esvaziar o título central tirou uma linha do cabeçalho: ele
       passou a ter 58px na tela 1 contra 66,8px nas telas 2 e 3, e os pontinhos
       saltavam 23px ao avançar de passo. A tela pulava.

   A correção troca a régua: a grade NÃO muda mais entre as telas — continua
   `56px 1fr 56px` nas três, então o centro é o centro da tela em todas. A marca
   escrita simplesmente TRANSBORDA da célula de 56px, que é seguro porque ela
   não tem corte e a palavra termina 30px antes de onde os pontinhos começam.
   E a linha do título passa a ter altura reservada mesmo vazia, para que as
   três telas tenham o mesmo cabeçalho e o indicador de passo não dance. */
/* v32: a marca já senta na linha por causa da regra geral; aqui sobra só o
   que é dela — a palavra ao lado e o transbordo do símbolo. */
.hbtn.logo.marca{gap:6px;width:max-content;overflow:visible;
  /* a marca senta na LINHA DO TÍTULO, não no centro do cabeçalho: é o lugar
     que "Nova saída" ocupa nas telas 2 e 3, e é isso que faz as três parecerem
     a mesma tela. Sem alvo de toque a perder — a marca não é botão. */
  /* altura FIXA igual à da linha do título: o símbolo tem 26px e transborda
     2,2px para cada lado, o que é exatamente o que se quer — o que precisa
     casar entre as telas é a linha de texto, não a caixa do desenho. */
  padding-top:0}
/* As duas linhas do miolo passam a existir sempre, mesmo vazias, MAS SÓ NA ABA
   DE REGISTRO. A de baixo é o subtítulo, que só tem texto a partir da tela 2 —
   e era ela que fazia o cabeçalho crescer 8,8px no meio do caminho e o
   indicador de passo pular 12px. Isto é anterior ao nome: medido igual na
   build 2026-09-23.8.

   O `#hdr.reg` não é detalhe: reservar as linhas em TODAS as telas custava
   5,8px de área útil em cada uma — medido — para resolver um problema que só
   existe onde há passo. A v15 gastou um carrossel inteiro para recuperar
   145px; não faz sentido devolver 5,8 de graça.

   21,59 e 16,19 são as alturas MEDIDAS das duas linhas com texto, a 16px e a
   12px. Arredondar para 19 e 14 deixava 4,8px de diferença sobrando. */
#hdr.reg .htitle .t{min-height:21.59px}
#hdr.reg .htitle .s{min-height:16.19px}
.hbtn.logo .wm{
  font-size:17px;font-weight:600;letter-spacing:-.025em;color:var(--ink);
  line-height:1;
}
/* `svg.marca` (0,2,1) vence `.hbtn svg{width:19px}` (0,1,1) sem precisar do
   `.marca` solto que estava aqui — e esse solto era uma armadilha de duas
   pontas: ele casava também com o BOTÃO da marca (que tem a classe) e, desde
   a v31, com o texto "· arquivada" das etiquetas. Foi ele que segurou a marca
   em 26px de altura quando a linha única mandou 21,59. Nome de classe genérico
   pega quem não foi convidado. */
.hbtn svg.marca{width:26px;height:26px;flex:none}
.htitle{text-align:center;min-width:0}
.htitle .t{font-size:15px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle .s{font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:4px}
.dot{width:16px;height:3px;border-radius:2px;background:var(--line2)}
.dot.on{background:var(--tint)}
.dot.done{background:var(--tint);opacity:.45}
/* v32: nas abas, tocar no cabeçalho volta ao topo — o gesto da barra de status
   do iOS, no lugar onde o dedo já está. Sem affordance visual, como lá. */
#hdr.aotopo{cursor:pointer;-webkit-tap-highlight-color:transparent}

/* telas */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.scroll.pad-top{padding-top:4px}

/* abas */
#tabs{
  /* v18: cinco colunas. Medido a 393px: a coluna cai de 96,3px para 77,0px e
     nenhum rótulo estoura. Num aparelho de 320px "Lançamentos" estouraria por
     6px — ali a régua teria de ser outra, e por ora não é o caso. */
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:.5px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted2)}
.tab svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:11px;font-weight:500;letter-spacing:.01em}
.tab[aria-selected="true"]{color:var(--tint)}
/* v18: o aviso de pendência. Fica colado no ícone e não no rótulo, porque é do
   assunto que ele fala; e é posicionado sobre um invólucro do tamanho do ícone,
   senão a pílula empurraria a coluna e desalinharia a barra inteira. */
.tab .tw{position:relative;display:block;width:22px;height:22px}
.tab .pill{
  position:absolute;top:-4px;left:12px;background:var(--danger-solid);color:#fff;
  font-size:11px;font-weight:700;line-height:1;border-radius:10px;padding:2px 4px;
  min-width:14px;text-align:center;letter-spacing:0;
}

/* ============================================================
   GRADE DE CARDS (telas 1 e 2)
   ============================================================ */
.grid{
  display:grid;
  grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));
  grid-template-rows:repeat(var(--rows,4),minmax(0,1fr));
  gap:8px;padding:2px 12px 12px;height:100%;
}
.cardbtn{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 12px 12px;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  min-width:0;min-height:0;transition:transform .08s ease,background .12s;
}
.cardbtn:active{transform:scale(.97);background:var(--fill2)}
.cardbtn .badge{
  width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-size:22px;line-height:1;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 32%, transparent);
  flex:none;
}
.cardbtn .nm{
  font-size:15px;font-weight:600;letter-spacing:-.012em;line-height:1.2;
  overflow-wrap:break-word;hyphens:auto;min-width:0;text-wrap:balance;
}
.grid[data-rows="5"] .cardbtn{padding:10px 12px 10px}
.grid[data-rows="5"] .cardbtn .badge{width:38px;height:38px;border-radius:10px;font-size:22px}
.grid[data-rows="5"] .cardbtn .nm{font-size:13px}
.grid[data-rows="3"] .cardbtn .badge{width:52px;height:52px;border-radius:14px;font-size:28px}
.grid[data-rows="3"] .cardbtn .nm{font-size:17px}
.cardbtn.more .badge{background:var(--fill2);box-shadow:none;color:var(--muted2)}
.cardbtn.more .badge svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.grid[data-rows="5"] .cardbtn.more .badge svg{width:20px;height:20px}

/* ============================================================
   TELA DE VALOR
   ============================================================ */
/* flex, não grid: com trilhas auto + fr o navegador distribuía a folga nas
   linhas de cima e os chips inchavam */
.val{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;height:100%}
.val>.amount,.val>.chips,.val>.descbox{flex:none}
.val>.pad{flex:1;min-height:0}
.amount{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px 12px}
.amount .k{font-size:12px;color:var(--muted2)}
.amount .n{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;margin-top:1px}
.amount .cur{font-size:22px;font-weight:600;color:var(--muted2)}
.amount .fig{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.08;color:var(--ink)}
.amount .fig.zero{color:var(--faint)}
.amount .dec{color:var(--muted2);transition:color .12s}
.amount .dec.typed{color:inherit}
/* O centavo que você NÃO digitou. Ele é real — `,5` vale cinquenta centavos —
   mas aparece mais claro, para o apagar se ver andando sem que o número minta
   sobre o que seria salvo.

   v34: era `--faint`, que mede 1,73:1. A régua de contraste da v31 reprovaria,
   e não pegou porque a varredura só visita telas em repouso — onde o valor ou
   é o fantasma 0,00 (que tem exceção escrita) ou está todo digitado. Num
   125,00 de verdade aquele `,00` estava claro demais. `--muted2` é o cinza
   secundário que o app já usa em todo lugar: 5,63:1. */
.amount .dec .imp{color:var(--muted2)}
/* linha derivada do parcelamento: é ela que impede digitar o valor da parcela
   achando que é o total */
.amount .parc{display:flex;align-items:center;gap:6px;margin:7px 0 0;padding-top:8px;
  border-top:.5px solid var(--line);font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}
.amount .parc b{color:var(--ink2);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* v27: com etiqueta no app, a fila vira quatro. Medido a 393px: 86px por chip,
   nada estoura. O gap cai de 8 para 6 para devolver 6px à largura de cada um. */
.chips.q4{grid-template-columns:repeat(4,1fr);gap:6px}
.chips.q4 .chip{padding:8px 8px}
/* v27: o separador entre as categorias e as etiquetas, na faixa de filtros */
.fsep{flex:0 0 1px;width:1px;align-self:center;height:20px;background:var(--line2);margin:0 3px}
.fchip.etq[aria-pressed="true"]{background:var(--tint-solid);color:#fff}

.chip{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px 12px;min-width:0}
.chip .k{display:block;font-size:11px;color:var(--muted2);
  /* v28: o rótulo passa a cortar com reticências em vez de quebrar ou vazar.
     Num aparelho de 320px "Pagamento" e "Etiquetas" não cabem em 70px — e ali
     "Pagamento" já não cabia com TRÊS chips, antes das etiquetas existirem.
     Cortar é o pior caso honesto; empurrar o layout seria pior. */
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .v.sem{font-weight:400;color:var(--muted2)}
.chip:active{background:var(--fill2)}
.descbox{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:0 12px}
.descbox input{width:100%;font-size:15px;min-height:44px}   /* v31: idem */
.descbox input::placeholder{color:var(--muted2)}
.pad{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{
  background:var(--card);border-radius:10px;box-shadow:var(--shadow);
  padding:8px 0;text-align:center;color:var(--tint);font-size:15px;font-weight:500;
}
.quick button:active{background:var(--fill2)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,minmax(0,1fr)) auto;gap:8px;min-height:0}
.key{
  background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;
  transition:background .1s,transform .06s;
}
.key:active{background:var(--fill2);transform:scale(.96)}
.key.comma{font-size:28px;font-weight:500;padding-bottom:16px}
.key.back{color:var(--tint)}
.key.back svg{width:27px;height:27px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.key.go{
  grid-column:1/-1;background:var(--tint-solid);color:#fff;font-size:17px;font-weight:600;
  padding:16px 0;border-radius:14px;letter-spacing:-.01em;box-shadow:none;
}
.key.go:disabled{background:var(--fill2);color:var(--muted2);opacity:1;box-shadow:none}
.key:disabled{opacity:.4}

/* ============================================================
   LISTAS AGRUPADAS (padrão iOS)
   ============================================================ */
.glabel{font-size:12px;color:var(--muted2);padding:16px 4px 6px;text-transform:none;letter-spacing:0}
.glabel:first-child{padding-top:6px}
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.grow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;
  padding:12px 12px;width:100%;position:relative;
}
.grow+.grow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.grow.tap:active{background:var(--fill2)}
.grow .r1{font-size:15px;letter-spacing:-.01em}
.grow .r2{font-size:12px;color:var(--muted2);margin-top:2px;line-height:1.35}
.grow .val{font-size:15px;color:var(--muted2);white-space:nowrap}
.chev{width:8px;height:13px;stroke:var(--faint);stroke-width:2.4;fill:none;flex:none}
.grow.danger .r1{color:var(--danger)}
.grow .right{display:flex;align-items:center;gap:6px;color:var(--muted2);font-size:15px}

/* segmentado */
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;gap:2px}
/* v21 (item 27): 44px de alvo, a régua da Apple. Estes controles mediam 30px
   — e são dos mais tocados do app. O aumento é do ALVO, não da tipografia: a
   altura vem de min-height, o texto continua 13px. */
.seg button{
  flex:1;text-align:center;padding:6px 4px;border-radius:10px;font-size:13px;font-weight:500;
  color:var(--ink);white-space:nowrap;transition:background .15s;
  min-height:40px;display:flex;align-items:center;justify-content:center;
}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.10);font-weight:600}

/* ============================================================
   CONSULTA
   ============================================================ */
/* v39: a faixa de cima encostava no cabeçalho — 0px entre os dois, desde
   sempre. Dava para não ver enquanto o campo de busca estava lá parado; com
   ele aparecendo e sumindo, a falta de respiro ficou evidente. 8px é o mesmo
   espaço que já separa as linhas DENTRO desta faixa. */
.topbar{padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px}
/* ------------------------------------------------------------
   v39 — O CAMPO DE BUSCA: 38px DE DESENHO, 44px DE ALVO

   Ele tinha 44px de altura DESENHADA, e ao lado do seletor de período (outros
   44px) os dois viravam um bloco pesado. Mas encolher o campo encolheria o
   alvo junto, e aqui o alvo É o campo — não dá para crescer por fora com um
   pseudo-elemento, porque ele cobriria o texto e o cursor.

   A saída é a mesma doutrina da régua, invertida: o ALVO continua sendo o
   campo inteiro, com 44px; quem encolhe é o DESENHO. A cápsula cinza virou um
   pseudo-elemento de 38px centrado atrás do conteúdo, e nada que recebe toque
   mudou de tamanho. ------------------------------------------------------ */
.searchwrap{position:relative;border-radius:10px;padding:0 10px;display:flex;
  align-items:center;gap:6px;min-height:44px}
.searchwrap::before{content:'';position:absolute;inset:3px 0;border-radius:10px;
  background:var(--fill2);pointer-events:none}
/* O anel de foco era o do NAVEGADOR: um retângulo azul desenhado em volta do
   <input>, portanto desalinhado da cápsula arredondada — e aparecia sozinho,
   porque abrir a busca já põe o foco no campo. Tirá-lo sem pôr nada no lugar
   deixaria o teclado sem pista nenhuma; então o foco passa a ser da CÁPSULA,
   na forma dela. */
.searchwrap input:focus{outline:none}
.searchwrap:focus-within::before{box-shadow:0 0 0 2px var(--tint-soft)}
.searchwrap svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2.2;fill:none;flex:none;
  position:relative}
.searchwrap input{flex:1;font-size:15px;min-width:0;min-height:44px;position:relative;
  background:none}   /* v31: o alvo é o campo, não a moldura */
.periodbar{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:6px}
.periodbar .pb{display:grid;place-items:center;height:44px;border-radius:10px;color:var(--tint);background:var(--fill2)}
.periodbar .pb:disabled{opacity:.4}
.periodbar .pb svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.periodbar .lbl{text-align:center;font-size:15px;font-weight:600;letter-spacing:-.01em}
/* A fileira mantém a largura inteira para as categorias. O primeiro chip
   alterna entre "Todas" e "Limpar" — é troca, não acréscimo. A versão que
   prendia o Limpar à esquerda e o Filtros à direita foi medida e derrubada:
   sobravam 164px de 361 para os chips, pouco mais de um chip à mostra. */
.chiprow{display:flex;align-items:center;gap:6px;padding:1px 16px 10px}
/* `overflow-x:auto` faz o navegador computar `overflow-y:auto` também, e isso
   RECORTA o que passa da altura da faixa — inclusive a área de toque esticada
   dos chips de ícone. O padding vertical abre espaço para ela, e a margem
   negativa devolve os pixels ao layout, para a fileira não crescer. */
.chiprow .rola{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;
  padding:6px 0;margin:-7px 0}
.chiprow .rola::-webkit-scrollbar{display:none}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:1px 16px 10px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{
  flex:none;background:var(--fill2);border-radius:999px;padding:6px 12px;
  font-size:13px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;
  min-height:44px;   /* v31: a única exceção da régua de alvos — ver a seção no fim */
}
.fchip[aria-pressed="true"]{background:var(--tint-solid);color:#fff}
.fchip .sw{width:8px;height:8px;border-radius:3px;background:var(--sw);flex:none}
.fchip[aria-pressed="true"] .sw{background:rgba(255,255,255,.85)}
.fchip.filt{color:var(--tint)}
.fchip.filt[data-on="1"]{background:var(--tint-solid);color:#fff}
.fchip.limpar{background:var(--tint-soft);color:var(--tint);font-weight:600}
/* Chip só de ícone: o ✕ precisa da largura mínima, a altura vem da régua de
   alvos no fim da folha. */
.fchip.so{min-width:44px;justify-content:center;padding:6px 10px}
.fchip.so .xs{width:13px;height:13px}
.fchip.so .fn{width:15px;height:15px}
.fchip .xs{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round}
.fchip .fn{width:13px;height:13px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linejoin:round;stroke-linecap:round}
.fchip .ct{background:var(--tint-solid);color:#fff;border-radius:10px;min-width:16px;height:16px;
  display:grid;place-items:center;font-size:11px;font-weight:700;padding:0 4px}
.fchip.filt[data-on="1"] .ct{background:#fff;color:var(--tint-solid)}

/* O período era um texto solto de 20px entre duas setas: sem fundo, sem
   chevron, sem nada que dissesse "toque aqui" — e é o ÚNICO caminho para
   Período e Ordenar por. Agora é uma pílula da altura das setas (32px), que de
   quebra resolve o alvo de toque de 20px que a revisão v2 acusou. */
/* precisa vencer `.periodbar .lbl`, que é mais específico que `.perbtn` */
/* v21 (item 27): era 20px de alvo — e é o ÚNICO acesso a Período e a
   Ordenar por. O pior alvo do app estava na porta de duas telas inteiras. */
.periodbar .lbl.perbtn{display:flex;align-items:center;justify-content:center;gap:4px;
  height:44px;padding:0 12px;border-radius:10px;background:var(--fill2);
  font-size:15px;font-weight:600;letter-spacing:-.01em;min-width:0}
.perbtn:active{background:var(--line2)}
.perbtn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perbtn .cv{width:13px;height:13px;stroke:var(--tint);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

.totbar{
  margin:0 16px 12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 16px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
}
.totbar .k{font-size:12px;color:var(--muted2)}
.totbar .v{font-size:28px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:1px}
/* O número grande é o dono da barra: ele NUNCA quebra. Quem cede espaço é a
   legenda, e ela só pode quebrar no "·" — por isso cada valor vem embrulhado
   em .nb. Sem isto, "+ R$ 999.400,00" partia em "+ R$" / "999.400,00". */
.totbar .v{white-space:nowrap}
.totbar .c{font-size:12px;color:var(--muted2);text-align:right;line-height:1.45;
  font-variant-numeric:tabular-nums;min-width:0}
.totbar .c .nb{white-space:nowrap}

.daygrp{margin-bottom:16px}
.dayhd{display:flex;align-items:baseline;justify-content:space-between;padding:0 4px 6px}
.dayhd .d{font-size:12px;color:var(--muted2)}
.dayhd .t{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums}
.swipe{position:relative;overflow:hidden}
.swipe .del{
  position:absolute;inset:0;background:var(--danger-solid);color:#fff;
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 26px;font-size:15px;font-weight:600;white-space:nowrap;
}
.swipe.armado .del{justify-content:flex-start}
.erow{
  position:relative;background:var(--card);
  display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 12px;width:100%;
  transition:transform .18s ease;touch-action:pan-y;
}
.erow:active{background:var(--fill2)}
.erow .ic{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.erow .tx{min-width:0;display:block}
.erow .t1{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .t2{display:block;font-size:12px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.erow .vl{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.pbadge{display:inline-block;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  padding:1px 6px;border-radius:10px;margin-left:7px;vertical-align:1px;
  background:var(--fill2);color:var(--muted2)}
.erow .t1 .pbadge{background:color-mix(in srgb, var(--c) 20%, var(--card));color:var(--ink2)}

/* ============================================================
   RESUMO
   ============================================================ */
.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.hero .k{font-size:12px;color:var(--muted2)}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.04em;line-height:1.08;margin-top:2px;font-variant-numeric:tabular-nums}
.delta{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.delta.up{color:var(--warn)}
.delta.down{color:var(--ok)}
.delta.flat{color:var(--muted2)}
/* v14 (ideias 1, 2 e 4) — o cartão do topo.
   A comparação é UM controle e não três: o bloco inteiro é um alvo só, com
   chevron à direita. Mesmo tratamento que o rótulo do período recebeu no
   item 33, e pelo mesmo motivo — texto solto ninguém descobre ser botão. */
.deltabtn{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 10px;
  border-radius:10px;background:var(--fill);font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums;width:100%;min-height:38px}
.deltabtn .gp{flex:1;text-align:left;display:flex;align-items:center;gap:4px;min-width:0}
.deltabtn.up{color:var(--warn)}
.deltabtn.down{color:var(--ok)}
.deltabtn.flat{color:var(--muted2)}
.deltabtn:active{opacity:.6}
/* v20 (lote D): do lado das ENTRADAS o juízo se inverte. Subir o gasto é aviso;
   subir o recebimento é boa notícia. A direção da seta continua sendo a
   direção do número — o que muda é a cor, que é o que carrega o juízo. */
.delta.inv.up,.deltabtn.inv.up{color:var(--ok)}
.delta.inv.down,.deltabtn.inv.down{color:var(--warn)}
.deltabtn .chev{width:8px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
/* a sparkline: sem eixo, sem valores, só o formato */
.sparkwrap{position:relative;margin-top:10px}
.sparkwrap .pt{position:absolute;right:-1px;width:7px;height:7px;border-radius:50%;
  background:var(--tint);box-shadow:0 0 0 2px var(--card);transform:translate(0,-50%)}
/* mês corrente é parcial: ponto vazado, para não parecer número fechado */
.sparkwrap .pt.parc{background:var(--card);box-shadow:0 0 0 2px var(--tint)}
.spark{display:block;width:100%;height:38px}
.spark path{fill:none;stroke:var(--tint);stroke-width:1.8;stroke-linejoin:round;
  stroke-linecap:round}
.spark .area{fill:var(--tint-soft);stroke:none}
.spark .parc{stroke-dasharray:3 3}
.sparkl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);
  margin-top:2px}
/* v29 (item 4): a sparkline virou a porta da folha de evolução.
   O <button> de fora não tem desenho nenhum — quem desenha continuam sendo o
   rótulo (.deltabtn, o mesmo do botão de comparação logo acima) e a sparkline. */
.evoport{display:block;width:100%;background:none;border:0;padding:0;margin:0;
  text-align:left;color:inherit;font:inherit}
/* O rótulo da porta tem o desenho do botão de comparação — mesma função, no
   mesmo cartão — mas CLASSE PRÓPRIA. Compartilhar `.deltabtn` fez a classe
   significar duas coisas, e seis verificações que diziam "o botão de
   comparação" passaram a encontrar dois elementos. Nome que serve a dois donos
   é nome que mente para os dois. */
.evolbl{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 10px;
  border-radius:10px;background:var(--fill);font-size:13px;font-weight:500;
  width:100%;min-height:38px;color:var(--muted2)}
.evolbl .gp{flex:1;text-align:left;display:flex;align-items:center;gap:4px;min-width:0}
.evolbl .chev{width:8px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.evoport .sparkwrap{display:block}
.evoport:active{opacity:.6}
/* o gráfico da folha: doze barras, régua de média e rótulos alternados */
.evosel{background:var(--fill);border-radius:14px;padding:10px 12px;margin-top:10px}
.evosel .q{font-size:11px;color:var(--muted2)}
.evosel .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.evosel .d{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.evosel .d.up{color:var(--warn)}
.evosel .d.down{color:var(--ok)}
.evosel .d.flat{color:var(--muted2)}
.evoplot{position:relative;height:126px;margin-top:12px}
.evobars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;
  height:126px;position:relative;z-index:1}
/* o alvo de toque é a COLUNA inteira, não a barra: uma barra de 3px seria um
   alvo de 3px, contra os 44px que o resto do app respeita */
.evobar{display:flex;align-items:flex-end;height:126px;background:none;border:0;padding:0}
.evobar i{display:block;width:100%;background:var(--bar,#C2410C);border-radius:4px 4px 0 0;
  opacity:.34}
.evobar.on i{opacity:1}
.evobar.parc i{background:repeating-linear-gradient(135deg,var(--bar,#C2410C) 0 3px,
  transparent 3px 6px);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bar,#C2410C) 55%,transparent)}
.evobar.parc.on i{opacity:.85}
.evomed{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);z-index:2}
.evolab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:4px}
.evolab span{font-size:11px;color:var(--muted2);text-align:center;letter-spacing:-.02em}
.evolab span.on{color:var(--ink2);font-weight:600}
.evofoot{font-size:11px;color:var(--muted2);line-height:1.55;margin-top:12px}
.btnghost{width:100%;background:var(--fill);color:var(--tint);border:0;border-radius:14px;
  padding:12px;font-size:13px;font-weight:600;margin-top:10px;min-height:44px}
.btnghost:active{opacity:.6}
.picker{display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--fill);border-radius:14px;padding:10px 12px;margin-top:10px;
  font-size:15px;width:100%;border:0;color:var(--ink);text-align:left;min-height:44px}
.picker .esq{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.picker .pt{width:9px;height:9px;border-radius:50%;flex:none}
.picker .chev{width:8px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.picker:active{opacity:.6}
/* v29: a resposta do "Buscar atualização", colada na linha que a pediu */
.estado{background:var(--fill);border-radius:14px;padding:12px 12px;margin-top:8px;
  display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.estado .ic{font-size:17px;line-height:1.25}
.estado .t{display:block;font-size:13px;font-weight:600;letter-spacing:-.01em}
.estado .s{display:block;font-size:12px;color:var(--muted2);line-height:1.55;margin-top:2px}
.estado.ok{background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.estado.ok .t{color:var(--ok)}
.estado.err{background:color-mix(in srgb,var(--danger) 9%,var(--card))}
.estado.err .t{color:var(--danger)}
.grow[disabled]{opacity:.5}
/* v31: etiqueta arquivada. Mesma linguagem da categoria arquivada: o nome
   esmaecido e a marca em texto, sem cor nova nem selo. */
.optgrp{font-size:11px;color:var(--muted2);padding:12px 4px 4px}
.opt.arq .nm{color:var(--muted2)}
.opt .nm .arqtxt{font-size:11px;color:var(--muted2);font-weight:500}
/* v14 (arrumação a): Entradas e Saldo como rodapé do cartão, não como bloco
   próprio. Um cartão, um número grande, hierarquia inequívoca. */
.herolin{display:flex;justify-content:space-between;gap:10px;margin-top:12px;
  padding-top:11px;border-top:.5px solid var(--line);font-variant-numeric:tabular-nums}
.herolin .c{display:flex;flex-direction:column;gap:1px;min-width:0}
.herolin .c.dir{text-align:right;align-items:flex-end}
.herolin .k{font-size:11px;color:var(--muted2)}
.herolin .v{font-weight:600;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.herolin .v.vin{color:var(--ok)}
.herolin .v.vneg{color:var(--danger)}
/* v14 (ideia 3): a linha de fechamento dentro da faixa de recorrentes.
   Com ela, a faixa fica com dois blocos de altura e o botão centralizado
   flutuaria em cima do segundo — então ele sobe para a linha do título. */
.banner .bw{min-width:0}
.banner.fech{align-items:flex-start}
.banner.fech .ba{margin-top:2px}
.banner .bf{font-size:12px;color:var(--ink2);margin-top:6px;padding-top:6px;
  border-top:.5px solid var(--line);line-height:1.4}
.banner .bf b{font-weight:600}
/* v14 (ideia 1): a folha "O que mudou". Eixo no meio: sobe para a direita na
   cor do delta que sobe, cai para a esquerda na cor do que cai. */
.vars{display:flex;flex-direction:column;gap:2px}
.varrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;
  padding:10px 0;align-items:baseline;width:100%}
.varrow:active{opacity:.6}
.varrow .bn{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;
  min-width:0;letter-spacing:-.01em}
.varrow .bn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.varrow .bv{font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
.varrow .bv.up{color:var(--warn)}
.varrow .bv.down{color:var(--ok)}
.varrow .eixo{grid-column:1/-1;height:8px;position:relative;margin-top:2px}
.varrow .eixo::before{content:"";position:absolute;left:50%;top:-2px;width:1.5px;
  height:12px;background:var(--line2);border-radius:1px}
.varrow .eixo i{position:absolute;top:0;height:8px;border-radius:3px}
.varrow .vsub{grid-column:1/-1;font-size:11px;color:var(--muted2);
  font-variant-numeric:tabular-nums;text-align:left}

/* v15 (arrumação b): o Comprometido ganhou valor e toque.
   O valor cabe ACIMA da barra e a barra encolheu 6px — mesma altura total. */
.comprhd{display:flex;align-items:center;gap:8px}
.comprhd .k{flex:1}
.compr{width:100%;text-align:left}
.compr:active{opacity:.6}
.compr .cbar em.vv{display:block;font-size:11px;color:var(--ink2);font-weight:600;
  margin-bottom:2px;font-variant-numeric:tabular-nums}
.compr .comprhd .chev{width:8px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* v15 (ideia 5): como o mês se formou */
.mix{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 16px;width:100%;text-align:left}
.mix:active{opacity:.6}
.mixhd{display:flex;align-items:center;gap:8px}
.mixhd .k{flex:1;font-size:12px;color:var(--muted2)}
.mixhd .chev{width:8px;height:13px;stroke:var(--muted);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.mixbar{display:flex;height:13px;border-radius:10px;overflow:hidden;margin-top:10px;gap:2px}
.mixbar i{display:block;height:100%}
.mixbar i.a,.mixleg .sw.a{background:#6366F1}
.mixbar i.b,.mixleg .sw.b{background:var(--tint)}
.mixleg{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mixleg .ln{display:flex;align-items:center;gap:8px;font-size:13px}
.mixleg .sw{width:9px;height:9px;border-radius:3px;flex:none}
.mixleg .nm{flex:1;min-width:0}
.mixleg .nm small{display:block;font-size:11px;color:var(--muted2);margin-top:1px}
.mixleg .vl{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mix .pe{font-size:11px;color:var(--muted2);margin-top:8px;line-height:1.4;
  padding-top:8px;border-top:.5px solid var(--line)}

/* v15: o carrossel dos cartões do meio.
   As margens negativas fazem o cartão sangrar até a borda da tela, para que a
   folga da rolagem não corte a sombra do cartão. */
/* gap de 16px e não 9: com 9, a página seguinte começava 7px antes da borda
   da tela e ficava uma lasca do cartão vizinho aparecendo — meia espiada, que
   não é o modelo A nem o B. Com 16 (o mesmo respiro lateral da tela) a página
   seguinte começa exatamente na borda e não sobra nada. */
.carro{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  margin:9px -16px 0;padding:0 16px;scroll-padding:0 16px;
  /* trava a rolagem no eixo horizontal: sem isto, arrastar na diagonal dentro
     do cartão rouba a rolagem vertical da tela */
  overscroll-behavior-x:contain;touch-action:pan-x}
.carro::-webkit-scrollbar{display:none}
/* Cada página estica na vertical (align-items:stretch da pista), e o cartão
   preenche a página com `height:100%`, NÃO com flex-grow: os dois cartões são
   <button>, e no Chromium um botão ignora o flex-grow no eixo do bloco — o
   cartão mais baixo ficava 9px menor que o vizinho e a tela dava um pulo a
   cada arrasto. Medido, não presumido. */
.carro>*{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.carro>*>*{height:100%}
.cdots{display:flex;gap:4px;justify-content:center;margin-top:8px;align-items:center}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--line2);flex:none;
  transition:background .15s,width .15s}
.cdot.on{background:var(--tint);width:16px;border-radius:3px}

/* v13 (item 31): a rosca do Resumo.
   O app tem `svg{width:20px;height:20px}` global para os ícones — a rosca
   precisa de largura e altura próprias ou nasce com 20px. */
.dwrap{position:relative;display:flex;justify-content:center;margin-top:2px}
.donut{display:block;width:184px;height:184px;transform:rotate(-90deg)}
/* `butt` e não `round`: com ponta arredondada as fatias pequenas se sobrepõem
   às vizinhas e a proporção que a rosca existe para mostrar deixa de ser real. */
.donut circle{fill:none;stroke-linecap:butt}
/* a rosca NÃO é tocável: a menor fatia de um mês real dá 20px de arco, menos da
   metade dos 44px da Apple. Quem abre a sub-categoria é a linha do ranking logo
   abaixo, que já tem altura de sobra. Daí o pointer-events:none aqui. */
.dmid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;text-align:center}
/* O buraco tem ~117px de diâmetro; o texto para em 100px para não encostar no
   anel nas diagonais. Nome de categoria longo ("Salários e benefícios") para em
   duas linhas com reticências em vez de empurrar o bloco para fora do buraco. */
.dmid>*{max-width:100px}
.dmid .dk{font-size:11px;color:var(--muted2);line-height:1.25}
.dmid .dv{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-top:1px;line-height:1.18;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dmid .dp{font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* comprometido à frente: sem ele, o parcelamento faria o mês parecer menor
   sem dizer para onde o resto foi */
.compr{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;margin-top:8px}
.compr .k{font-size:12px;color:var(--muted2)}
.compr .v{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:2px;font-variant-numeric:tabular-nums}
.compr .s{font-size:12px;color:var(--muted2);margin-top:2px}
/* v15: 70px e não 56. Com o valor acima da barra a coluna passou a medir
   69px, e a altura declarada de 56 virou mentira — o conteúdo vazava para
   fora sem ninguém notar, porque não há corte. O mockup prometia "mesma
   altura"; a medição desmentiu, e o número certo é este. */
.compr .cbars{display:flex;gap:6px;margin-top:10px;align-items:flex-end;height:70px}
.compr .cbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.compr .cbar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--tint);opacity:.5}
.compr .cbar em{font-style:normal;font-size:11px;color:var(--muted2)}
/* escolha das parcelas */
.parcgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.parcgrid button{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 0;
  text-align:center;font-size:17px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.parcgrid button:active{background:var(--fill2)}
.parcgrid button small{display:block;font-size:11px;font-weight:500;color:var(--muted2);margin-top:2px}
.parcgrid button[aria-pressed="true"]{background:var(--tint-solid);color:#fff;box-shadow:none}
.parcgrid button[aria-pressed="true"] small{color:rgba(255,255,255,.82)}
/* revisão de recorrentes */
.rrev{display:grid;grid-template-columns:34px minmax(0,1fr) auto 26px;gap:10px;align-items:center;
  padding:10px 12px;width:100%;position:relative;background:var(--card);text-align:left}
.rrev+.rrev::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.rrev .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent)}
.rrev .nm{display:block;font-size:15px;font-weight:500;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrev .sb{display:block;font-size:12px;color:var(--muted2);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrev .vl{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrev input.vin,.rrev button.vin{width:96px;text-align:right;font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--fill2);border-radius:10px;padding:6px 8px}
/* v20 (item 30): virou botão. O alvo cresce para os 44px da HIG, que o input
   de 30px nunca teve. */
.rrev button.vin{min-height:44px;color:var(--ink)}
.rrev button.vin:active{opacity:.6}
.rrev .ck{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;
  background:var(--tint-solid);color:#fff;font-size:13px;font-weight:700}
.rrev[aria-pressed="false"] .ck{background:var(--fill2);color:transparent}
.rrev[aria-pressed="false"] .nm,.rrev[aria-pressed="false"] .vl{color:var(--muted2)}
/* v32: a linha que explica o estado do meio. O vermelho continua, porque
   pular é destrutivo de verdade — o que mudou é ele não ser mais a única coisa
   que aparece quando você desmarca. Rótulo é verbo ("Pular este mês"), a
   consequência é o texto ao lado. */
.pendrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--card);padding:0 12px 10px;position:relative}
.pendrow .ex{font-size:12px;color:var(--muted2);line-height:1.4}
.pendrow button.dan{color:var(--danger);font-size:12px;font-weight:600;
  background:var(--fill);border-radius:999px;padding:6px 12px;white-space:nowrap;
  min-height:44px}
/* meses pulados, no detalhe do molde */
.msk{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:var(--card);position:relative;width:100%;text-align:left}
.msk+.msk::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.msk .mn{font-size:15px}
.msk .mr{font-size:13px;color:var(--tint);font-weight:500;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:2px}
.barrow{padding:10px 0;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.barrow:active{opacity:.6}
.barrow .bn{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0;letter-spacing:-.01em}
.barrow .bn em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bv{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.barrow .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--fill2);overflow:hidden;margin-top:2px}
.barrow .fill{display:block;height:100%;min-width:4px;background:var(--c);border-radius:0 4px 4px 0}
.barrow .bp{grid-column:1/-1;font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
/* v18: a meta na linha do ranking. O trilho precisa deixar o traço escapar
   para cima, então perde o overflow:hidden — e por isso o preenchimento ganha
   o arredondamento de volta, que antes vinha do corte do trilho. */
.barrow.meta .track{overflow:visible;position:relative}
.barrow.meta .fill{border-radius:4px}
.barrow .metamk{
  position:absolute;top:-3px;width:2px;height:14px;border-radius:1px;
  background:var(--ink2);padding:0;
}
.barrow.estourou .track{background:color-mix(in srgb,var(--danger) 16%,var(--fill2))}
.barrow.estourou .bp{color:var(--danger);font-weight:600}
/* a faixa de aviso das metas: atalho, não alarme — por isso o vermelho entra
   só como fundo de 9% e no número, e não como borda inteira. */
.metahd{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:color-mix(in srgb,var(--danger) 9%,var(--card));
  border-radius:14px;padding:12px 12px;margin-top:12px;font-size:13px;
  min-height:44px;
}
.metahd:active{opacity:.6}
.metahd .tx{flex:1}
.metahd svg.chev{flex:none}
/* a caixa de vigência, na folha de definir a meta */
.vigbox{
  font-size:12px;color:var(--ink2);background:var(--fill);border-radius:10px;
  padding:10px 12px;line-height:1.45;margin-top:8px;
}
.vigbox b{font-weight:600}
.vigbox .av{color:var(--muted2);display:block;margin-top:2px;font-size:11px}
.opt .tag.def{color:var(--tint);font-weight:600}
.opt .tag.tem{color:var(--ink2);font-weight:600}

/* ============================================================
   BANNER / VAZIO / TOAST
   ============================================================ */
.banner{
  margin:0 16px 12px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  border:.5px solid var(--line2);
  border:.5px solid color-mix(in srgb, var(--warn) 45%, transparent);
}
/* v32: quando nada venceu, a faixa não some — ela para de cobrar. Borda
   neutra e botão secundário; o verbo vira "Ver". */
.banner.calmo{border:.5px solid var(--line2)}
.banner.calmo .ba{background:var(--fill);color:var(--tint)}
.banner .bt{font-size:13px;font-weight:600;letter-spacing:-.01em}
.banner .bs{font-size:12px;color:var(--muted2);margin-top:2px;line-height:1.4}
.banner .ba{background:var(--tint-solid);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.banner .bx{color:var(--muted2);padding:6px;margin:-6px}

.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .e1{font-size:17px;font-weight:600;letter-spacing:-.02em}
.empty .e2{font-size:13px;color:var(--muted2);max-width:32ch;line-height:1.45}
.empty .eb{margin-top:6px;background:var(--tint-solid);color:#fff;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600}
.empty.alert .e1{color:var(--danger)}

#toast{
  position:fixed;left:12px;right:12px;z-index:60;
  bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
  background:var(--card);border:.5px solid var(--line);border-radius:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
  padding:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  animation:up .22s cubic-bezier(.2,.8,.25,1);
}
#toast .tt{font-size:13px;font-weight:600;letter-spacing:-.01em}
#toast .ts{font-size:12px;color:var(--muted2);margin-top:1px}
#toast .tu{color:var(--tint);font-size:15px;font-weight:600;white-space:nowrap}
@keyframes up{from{transform:translateY(14px);opacity:0}}

/* ============================================================
   FOLHAS
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:70;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;
  background:var(--bg);border-radius:14px 14px 0 0;
  max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  animation:rise .26s cubic-bezier(.2,.85,.25,1);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@keyframes rise{from{transform:translateY(100%)}}
.sheet-h{
  display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:6px;
  padding:12px 12px 10px;
}
.sheet-h .st{text-align:center;font-size:15px;font-weight:600;letter-spacing:-.02em}
.sheet-h .sa{color:var(--tint);font-size:15px}
.sheet-h .sa.right{text-align:right}
/* v20: ação secundária destrutiva no cabeçalho da folha (hoje: remover meta) */
.sheet-h .sa.dan{color:var(--danger)}
.sheet-h .sa.strong{font-weight:600}
.sheet-h{flex:none}
.sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;display:flex;flex-direction:column}
/* sem isto o flex encolhe a lista até caber e nada rola — os itens ficam achatados */
.sheet-b>*{flex:0 0 auto}
.opt{
  display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;
  background:var(--card);padding:10px 12px;width:100%;position:relative;
}
.opt+.opt::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.opt:active{background:var(--fill2)}
.opt .ic{
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c,var(--fill2)) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c,transparent) 30%, transparent);
}
.opt .nm{font-size:15px;letter-spacing:-.01em;min-width:0}
.opt .nm small{display:block;font-size:12px;color:var(--muted2);margin-top:1px}
/* v25: legenda de uma linha na ação, para quando o nome não basta —
   "Registrar estorno" precisa dizer que não é o mesmo que excluir. */
.opt .nm em{display:block;font-style:normal;font-size:12px;color:var(--muted2);
  margin-top:1px;line-height:1.35}

/* v25: os dois botões grandes da folha de estorno (tudo × parte) e a
   pré-visualização do efeito. Um estorno vinculado mexe em vários meses de
   uma vez; a folha diz o que vai acontecer antes de gravar. */
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.big2{background:var(--fill);border-radius:14px;padding:12px 12px;text-align:center;
  font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;min-height:44px}
.big2 em{display:block;font-style:normal;font-size:12px;font-weight:400;
  color:var(--muted2);margin-top:2px}
.big2.on{background:color-mix(in srgb,var(--tint) 14%,var(--card));color:var(--tint)}
.big2.on em{color:var(--tint)}
.big2:active{background:var(--fill2)}
.prev{background:var(--fill);border-radius:14px;padding:12px 12px;margin-top:10px;
  font-size:12px;line-height:1.6;color:var(--ink2)}
.prev .pt{font-size:11px;color:var(--muted2);margin-bottom:4px}
.prev .li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:6px;margin-top:4px}
.prev .li .s{color:var(--muted2)}
.prev b{font-variant-numeric:tabular-nums}
.opt .tag{font-size:12px;color:var(--muted2);white-space:nowrap}
.optwrap{border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
/* v40: três colunas — ontem, hoje, amanhã. O cartão largo de "Escolher data"
   continua ocupando a linha inteira (grid-column:1/-1). */
.dayopts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dayopt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 12px}
.dayopt.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;overflow:hidden}
/* o campo de data cobre o card inteiro e fica invisível: tocar em qualquer
   ponto abre o calendário, não só em cima do valor */
.dayopt.wide input[type="date"]{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;
  -webkit-appearance:none;appearance:none;font-size:15px;
}
.dayopt.wide .cal{font-size:22px;line-height:1}
/* mesma ideia no formulário de edição: o campo inteiro é a área de toque */
.field.data{position:relative}
.field.data input[type="date"]{position:relative;z-index:1;width:100%}
.dayopt .n{font-size:17px;font-weight:600;letter-spacing:-.02em}
.dayopt .s{font-size:12px;color:var(--muted2);margin-top:2px}
.dayopt[aria-pressed="true"]{outline:2px solid var(--tint);outline-offset:-2px}

/* formulário */
.field{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:8px}
.field .k{display:block;font-size:11px;color:var(--muted2)}
.field input,.field select{width:100%;font-size:15px;margin-top:2px;background:none}
.field input[type="date"]{font-variant-numeric:tabular-nums}
.field.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.field .v{display:block;font-size:15px;margin-top:2px}
.field .v.sem{color:var(--muted2)}
/* v20 (item 30): os dois campos da faixa de valor entram lado a lado, e o
   chevron não cabe na largura de meia tela sem espremer o número. */
.field.row.col{grid-template-columns:minmax(0,1fr) auto;padding:10px 10px;margin-bottom:0}
.field.row.col .v{font-size:15px}
.btnfull{
  display:block;width:100%;text-align:center;background:var(--tint-solid);color:#fff;
  border-radius:14px;padding:12px;font-size:17px;font-weight:600;margin-top:6px;
}
.btnfull.sec{background:var(--fill2);color:var(--tint)}
.btnfull.dan{background:var(--fill2);color:var(--danger)}
/* v32: o mesmo contrato do "Confirmar" do teclado (v31) — DESLIGADO, não
   apagado. Branco sobre azul lavado é quase ilegível e parece um botão que
   deveria funcionar. A régua da v31 consertou o teclado e deixou este para
   trás porque a varredura olha as sete telas, não as folhas. */
.btnfull:disabled{background:var(--fill2);color:var(--muted2);opacity:1}

/* ============================================================
   CALENDÁRIO (v12)
   Alvo de toque de 44px em cada dia — o mínimo da Apple. Com 7 colunas em
   393px de tela, cada célula fica com ~48px de largura, então a folga é real
   e não depende de o dedo acertar o número.
   ============================================================ */
.calwrap{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 10px 12px}
.calhd{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:6px;padding:2px 0 6px}
.calhd .pb{display:grid;place-items:center;height:32px;border-radius:10px;color:var(--tint);background:var(--fill2)}
.calhd .pb:disabled{opacity:.4}
.calhd .pb svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.calhd .m{text-align:center;font-size:15px;font-weight:600;letter-spacing:-.01em}
.caldow{display:grid;grid-template-columns:repeat(7,1fr)}
.caldow span{text-align:center;font-size:11px;color:var(--muted2);padding:2px 0 4px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.cday{height:44px;position:relative;display:grid;place-items:center}
/* a faixa do intervalo fica ATRÁS do número, encostando de célula em célula
   para virar uma barra contínua em vez de 15 pastilhas soltas */
.cday i{position:absolute;inset:3px 0;display:none;background:var(--tint-soft)}
.cday.in i{display:block}
.cday.ini i{border-radius:14px 0 0 14px;left:3px}
.cday.fim i{border-radius:0 14px 14px 0;right:3px}
.cday b{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  font-size:15px;font-weight:400;font-variant-numeric:tabular-nums}
.cday.ponta b{background:var(--tint-solid);color:#fff;font-weight:600}
.cday.hoje b{box-shadow:inset 0 0 0 1.5px var(--tint)}
.cday.hoje.ponta b{box-shadow:none}
.cday.out{pointer-events:none}
.cday:active b{opacity:.55}
.calft{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 4px 4px;margin-top:4px;border-top:.5px solid var(--line);min-height:44px}
.calft .l{font-size:13px;color:var(--muted2)}
.calft .l b{color:var(--ink);font-weight:600}
.calft .z{color:var(--tint);font-size:13px;font-weight:500;
  min-height:44px;min-width:44px;display:grid;place-items:center;margin:-9px 0}

/* linha de valor que abre o teclado do app, na folha de edição */
.field.tap .v{font-size:17px;font-weight:600;letter-spacing:-.02em}
.field.tap .v.vneg{color:var(--danger)}
.field.tap:active{background:var(--fill2)}
/* a folha de valor precisa dar altura ao teclado: dentro do .sheet-b, que é
   flex, o .pad não tem de quem herdar altura */
.padbox{height:min(52vh,430px);display:flex;flex-direction:column;margin-top:10px}
.padbox .pad{flex:1 1 auto;min-height:0}
/* `.sheet-b>*{flex:0 0 auto}` congela a altura de todo filho para a folha poder
   rolar. Este é a exceção: quando a folha se ajusta à de baixo, é ele que
   estica para ocupar a diferença. */
.sheet-b>.padbox.cresce{flex:1 1 auto;height:auto;min-height:min(52vh,430px)}
.hint{font-size:12px;color:var(--muted2);line-height:1.45;padding:10px 4px 0}

/* reordenação */
.reorder{position:relative}
.rrow{
  display:grid;grid-template-columns:auto 34px minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--card);padding:10px 12px;position:relative;touch-action:pan-y;
}
.rrow+.rrow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--line)}
.rrow.drag{z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.22);border-radius:10px;opacity:.97}
.rrow .hnd{color:var(--faint);padding:8px;margin:-8px;cursor:grab;touch-action:none}
.rrow .hnd svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.rrow .ic{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;
  background:var(--fill2);
  background:color-mix(in srgb, var(--c) 17%, var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent);
}
.rrow .nm{font-size:15px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ct{font-size:12px;color:var(--muted2);white-space:nowrap}
.cutline{
  display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--fill);
  font-size:11px;color:var(--muted2);position:relative;
}
.cutline::before,.cutline::after{content:"";flex:1;height:.5px;background:var(--line2)}

/* arranque */
#boot{position:fixed;inset:0;z-index:90;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:32px 26px;text-align:center}
#boot .bt{font-size:17px;font-weight:600;letter-spacing:-.02em}
#boot .bs{font-size:13px;color:var(--muted2);max-width:34ch;line-height:1.45}
#boot.erro .bt{color:var(--danger)}
#boot .rel{text-align:left;font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:8px;
  background:var(--card);border-radius:14px;padding:12px 16px;max-width:36ch;width:100%}
#boot .dl{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;word-break:break-word}
#boot .si{color:var(--ok);font-weight:700}
#boot .nao{color:var(--danger);font-weight:700}

/* util */
.sp{height:10px}
.center{text-align:center}
.hide{display:none!important}

/* ---------- v11: entradas e saídas ---------- */
/* v14 (arrumação a): o bloco `.saldo` saiu. Entradas e Saldo viraram o rodapé
   do cartão do número grande — ver `.herolin` lá em cima. */
/* verde = dinheiro que entrou ou voltou; vermelho = saldo negativo */
.vin{color:var(--ok)}
.vneg{color:var(--ok)}
.erow .vl.vin,.erow .vl.vneg{color:var(--ok)}
.erow .t2 b{color:var(--ok);font-weight:600}
.msk .mr.vin{color:var(--ok)}
.msk .mr.vneg{color:var(--danger)}
/* O ± na fileira dos atalhos: separado dos somadores por um respiro, porque
   os três primeiros somam dinheiro e este inverte o sentido. */
/* v33: dois controles, não cinco. C à esquerda (onde a calculadora o põe) e
   ± à direita; o meio é o respiro que separa LIMPAR de INVERTER. */
.quick{grid-template-columns:auto 1fr auto}
.quick .lim{color:var(--danger);font-weight:600;padding:8px 22px}
.quick .sig{padding:8px 22px}
.quick .gap{height:1px}
.quick .sig{font-size:17px;font-weight:700;letter-spacing:.02em}

.amount .n.neg .cur,.amount .n.neg .fig{color:var(--danger)}

.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.10);color:var(--ink)}

   com o dedo, mas é a mesma régua do seletor da aba Lançamentos, que já roda. */
.seg.res{margin:18px 0 10px}
/* ============================================================
   A RÉGUA DE ALVOS  (v31)
   ------------------------------------------------------------
   Uma regra só, num lugar só: TODO CONTROLE TEM 44px DE ALVO.
   Antes isto estava espalhado — cada controle que alguém media
   ganhava o seu remendo, e o que ninguém media ficava com 34.

   O alvo cresce POR FORA, invisível: o desenho não muda de
   tamanho, e nenhuma tela fica mais alta. É o mesmo pseudo-
   elemento que o "Voltar" do cabeçalho usa desde a v30.

   46 e não 44: o meio de um controle de altura ímpar cai numa
   fração de pixel e a área medida volta 43. Dois pixels de
   folga fazem a régua valer em qualquer arredondamento.

   MEDIR ISTO COM getBoundingClientRect DÁ O NÚMERO ERRADO.
   O alvo não é o retângulo do elemento; é quem responde no
   ponto. A suíte v30 pergunta com elementFromPoint.

   A EXCEÇÃO, e ela está escrita: o chip da faixa de filtros.
   A faixa rola na horizontal, e quem rola recorta o que
   transborda — ali o pseudo-elemento não sobrevive. O chip
   cresce de verdade (38 -> 44px) e a faixa fica 6px mais alta.
   É o único lugar do app onde a régua custa pixel.
   ============================================================ */
.seg button,.calhd .pb,.periodbar .pb,.banner .ba,.banner .bx,.deltabtn,
.quick button,.fchip.so{position:relative}
.seg button::after,.calhd .pb::after,.periodbar .pb::after,.banner .ba::after,
.banner .bx::after,.deltabtn::after,.quick button::after,.fchip.so::after{
  content:'';position:absolute;left:0;right:0;top:50%;height:46px;
  transform:translateY(-50%);
}
/* As setas de período e de calendário têm 36px de largura: o alvo também
   cresce para os lados, senão o dedo acerta a altura e erra a coluna. */
.calhd .pb::after,.periodbar .pb::after{left:-5px;right:-5px}

/* ============================================================
   v37 — O CABEÇALHO DA TELA LANÇAMENTOS

   Período, chips e total passaram a morar DENTRO do contêiner que rola. O
   encolhimento, portanto, é rolagem normal: eles saem de cena 1 para 1 com o
   dedo, sem transição, sem listener e sem estado. Não há código sustentando a
   parte que mais importa — é por isso que ela não pode quebrar.
   ============================================================ */
.scroll.lst{padding:0}
.scroll.lst .lista{padding:0 16px 24px}
/* A barra de total GRUDA no topo. O invólucro existe para a cor: a barra tem
   16px de margem de cada lado, e sem ele a lista apareceria rolando por baixo
   nessas duas frestas. */
.scroll.lst .totwrap{position:sticky;top:0;z-index:3;
  /* A ALTURA É PRESA EM JS, na forma aberta (ver ligarEncolher): comprimir
     passa a acontecer DENTRO de uma caixa que não muda de tamanho, e por isso
     não mexe em layout nenhum. O espaço que sobra fica transparente e a lista
     rola por baixo — não há fundo aqui de propósito.
     `pointer-events` volta no cartão: a faixa transparente não pode roubar o
     deslizar das linhas que passam por baixo dela. */
  pointer-events:none}
.scroll.lst .totwrap .totbar{pointer-events:auto;margin-bottom:0}
/* O respiro de baixo é PADDING do invólucro, não margem do cartão. Com margem,
   ela colapsava para fora enquanto a altura era automática e passava a contar
   para dentro assim que a altura foi presa — 12px que apareciam do nada e que o
   Chrome compensava mexendo na rolagem. Padding não colapsa: a caixa mede o
   mesmo antes e depois, que é a condição desta build inteira. */
.scroll.lst .totwrap{padding-bottom:12px}
/* Forma comprimida: uma linha só. Sem `transition` DE PROPÓSITO — comprimir
   tira 43px de altura de conteúdo que está ACIMA de você, e a compensação da
   rolagem (ver ligarEncolher) só é exata se a mudança couber num quadro. */
.screen.enc .totwrap .totbar{padding:8px 14px;align-items:center}
.screen.enc .totbar .tq{display:flex;align-items:baseline;gap:7px;min-width:0}
.screen.enc .totbar .k{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen.enc .totbar .v{font-size:15px;margin-top:0;letter-spacing:-.01em}
/* A legenda longa some e a curta aparece — e a curta é CONTEÚDO DE CSS, lido
   de `data-n`. Assim o documento nunca carrega os dois textos ao mesmo tempo:
   `textContent` da barra continua sendo só o que está escrito nela. */
.screen.enc .totbar .c{font-size:0;display:flex;align-items:center;gap:7px}
.screen.enc .totbar .c::before{content:attr(data-n);font-size:12.5px;
  color:var(--muted2);font-variant-numeric:tabular-nums}
/* O contador de filtros só existe na forma comprimida, e é o ponto inteiro
   dela: com os chips fora de cena, ele é a única coisa na tela que diz que a
   lista está recortada. */
.screen.enc .totbar .c[data-f]::after{content:attr(data-f);
  background:var(--tint-solid);color:#fff;border-radius:10px;min-width:17px;height:17px;
  display:grid;place-items:center;font-size:10.5px;font-weight:700;padding:0 4px}
/* A busca vira a lupa do cabeçalho; acesa quando há texto buscado. */
/* A lupa na faixa de chips usa o mesmo desenho do funil — mas CLASSE PRÓPRIA:
   com as duas chamadas `.filt`, qualquer leitura por `.filt` passava a achar
   duas coisas, e foi assim que uma suíte quebrou. Dois botões diferentes
   precisam de dois nomes. */
.fchip.busc{color:var(--tint)}
.fchip.busc[data-on="1"]{background:var(--tint-solid);color:#fff}
.fchip.so svg:not(.xs):not(.fn){width:15px;height:15px;stroke:currentColor;
  stroke-width:2.2;fill:none;stroke-linecap:round}
/* v39: o ✕ tinha 28px de largura de alvo e ninguém tinha medido — a varredura
   da régua nunca abria a busca. Agora abre (ver v30), e o alvo cresce por fora
   como o de todo mundo. */
.searchwrap .bx{display:grid;place-items:center;width:28px;height:44px;color:var(--muted);
  flex:none;position:relative}
.searchwrap .bx::after{content:'';position:absolute;left:-9px;right:-9px;top:50%;
  height:46px;transform:translateY(-50%)}
.searchwrap .bx svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.6;fill:none;
  stroke-linecap:round}
/* As sub-categorias na faixa: mesmo chip, sem a pastilha de cor — quem carrega
   a cor é a categoria acesa, que está logo antes delas. */
.fchip.sub[aria-pressed="true"]{background:var(--tint-solid);color:#fff}

  <div class="bt">Carregando…</div>

</div>
<script>
/* Diagnóstico de arranque. Registrado antes de tudo: se o script principal
   for cortado, não for lido ou explodir, esta tela conta o que aconteceu. */
window.__diag={inicial:true,fim:false,erro:null};
(function(){
  function esc(t){return String(t).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
  function linha(ok,txt){return '<div class="dl"><span class="'+(ok?'si':'nao')+'">'+(ok?'✓':'✗')+'</span>'+esc(txt)+'</div>';}
  function relatar(){
    var b=document.getElementById('boot');
    if(!b)return;
    /* A camada de arranque também é usada pela tela de "versão atrasada"
       (formato de dados futuro), e essa tela FICA — não é removida como a de
       carregamento. Sem esta linha, o relatório de diagnóstico a apagaria aos
       2,5s e o usuário veria "O app não iniciou", que seria mentira: ele
       iniciou e parou de propósito. */
    if(window.__diag.parado)return;
    var tam=0;
    try{tam=document.documentElement.outerHTML.length;}catch(e){}
    var abas=document.getElementById('tabs');
    var d=window.__diag;
    b.className='erro';
    b.innerHTML='<div class="bt">O app não iniciou</div>'+
      '<div class="rel">'+
      linha(true,'Script de arranque rodou')+
      linha(d.fim,d.fim?'Arquivo chegou até o fim':'ARQUIVO CORTADO antes do fim')+
      linha(tam>100000,'Bytes recebidos: '+tam.toLocaleString('pt-BR')+'  (esperado ~112.000)')+
      linha(typeof SEED!=='undefined','Dados das categorias: '+(typeof SEED!=='undefined'?('carregados, '+SEED.length+' categorias'):'não chegaram'))+
      linha(!!(abas&&abas.children.length),'Interface desenhada: '+((abas&&abas.children.length)?'sim':'não'))+
      linha(!d.erro,d.erro?('ERRO: '+d.erro):'Nenhum erro de JavaScript')+
      '</div>'+
      '<div class="bs">Tire um print desta tela e mande para o Claude.</div>';
  }
  window.addEventListener('error',function(e){
    window.__diag.erro=(e.message||'erro')+(e.lineno?(' · linha '+e.lineno):'');
    relatar();
  });
  window.addEventListener('unhandledrejection',function(e){
    window.__diag.erro='Promessa: '+e.reason;relatar();
  });
  function agendar(){setTimeout(relatar,400);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',agendar);
  else agendar();
  setTimeout(relatar,2500);
})();
</script>

function addMes(mk,n){var p=mk.split('-');var d=new Date(+p[0],+p[1]-1+n,1);return ymd(d).slice(0,7);}
function diaLabel(s){

function diasEntre(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
function addDias(s,n){var d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function diaCurto(s){return (+s.slice(8))+' '+MESC[+s.slice(5,7)-1];}

/* ============================================================
   PARCELAMENTO
   Uma compra parcelada continua sendo UM registro: `v` é o total
   da compra e `par` o número de parcelas. O valor da parcela e a

/* Divide o total em n parcelas inteiras de centavos. A sobra vai na
