function fatiar(total,n){
  var base=Math.floor(total/n),resto=total-base*n,out=[];
  for(var i=0;i<n;i++)out.push(base+(i===0?resto:0));
  return out;
}
/* Mesma data i meses à frente, presa ao último dia quando o mês é curto:
   31/01 + 1 mês é 28/02, nunca 03/03 — o setMonth cru erraria isso. */
function addMesData(s,i){
  var dia=+s.slice(8);
  var alvo=new Date(+s.slice(0,4),+s.slice(5,7)-1+i,1);
  var ult=new Date(alvo.getFullYear(),alvo.getMonth()+1,0).getDate();
  alvo.setDate(Math.min(dia,ult));
  return ymd(alvo);
}
/* Expande um lançamento nas suas ocorrências — uma por parcela.
   Uma ocorrência tem a mesma forma de um lançamento, então lista,
   resumo e filtros não precisam saber o que é uma parcela.
   `oid` é sempre o id da COMPRA: é por ele que se edita e se exclui. */
/* Os estornos de uma compra, em ordem de data. Moram DENTRO da compra
   (`e.est = [{d,v}]`, v sempre positivo = quanto voltou) e não como
   lançamento separado.

   Essa escolha é do dia da implementação e vale registrar, porque o desenho
   aprovado previa o contrário — um lançamento de estorno com um campo
   apontando para a compra. Guardar dentro tem três vantagens que só
   apareceram ao escrever o código:
     · `ocorrenciasDe()` continua PURA — lê só o lançamento que recebeu, e
       não o resto da base. Era o custo mais alto que eu tinha previsto, e
       ele simplesmente não existe mais;
     · excluir a compra leva os estornos junto, sem registro órfão;
     · o backup carrega o campo de graça, porque serializa o objeto inteiro.
   O preço é que estorno deixa de ser editável como lançamento solto — o que
   está certo: ele não é um gasto, é uma correção de um gasto. */
function estornosDe(e){
  return ((e&&e.est)||[]).filter(function(x){return x&&x.v>0;})
    .slice().sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);});
}
function temEstorno(e){return estornosDe(e).length>0;}

/* ============================================================
   ETIQUETAS (item 9, formato 7)
   A régua, decidida com você em 28/09 e impressa na tela:
   ETIQUETA É PARA CORTE QUE CRUZA CATEGORIA. O que só faz sentido dentro de
   uma categoria é sub-categoria. Sem essa fronteira, o app ganharia um
   terceiro vocabulário para nomear a mesma coisa — e com 15 categorias e 89
   sub-categorias, decidir onde algo mora já é trabalho demais.

   Por isso etiqueta não tem cor nem emoji: ser visualmente mais leve que a
   categoria é FEATURE, deixa claro quem manda no app.
   ============================================================ */
function etq(id){
  var L=DB.etq||[];
  for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];
  return null;
}
function nomeEtq(id){var e=etq(id);return e?e.n:'—';}
/* As etiquetas de um lançamento, na ordem da coleção — para que a mesma
   dupla apareça sempre na mesma ordem, em qualquer linha. */
function etqsDe(e){
  var ids=(e&&e.etq)||[];
  return (DB.etq||[]).filter(function(t){return ids.indexOf(t.id)>=0;});
}
/* Chave de comparação: sem acento, sem caixa, sem espaço e sem pontuação.
   É o que impede "Reembolsável", "reembolsavel" e "reembolsável " de virarem
   três etiquetas — e com elas o filtro deixaria de funcionar. */
function normEtq(n){
  return String(n||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]/g,'');
}
function acharEtq(nome){
  var k=normEtq(nome);
  if(!k)return null;
  var L=DB.etq||[];
  for(var i=0;i<L.length;i++)if(normEtq(L[i].n)===k)return L[i];
  return null;
}
/* v31: etiqueta arquivada.

   Mesmo mecanismo da categoria e da sub-categoria, e de propósito a mesma
   palavra: arquivada sai da lista de ESCOLHA e continua em tudo o mais — nos
   lançamentos que já a têm, no filtro da lista, no recorte da evolução e em
   Ajustes, que é onde se reativa.

   O campo é opcional: etiqueta sem `arq` é etiqueta ativa. Por isso o formato
   não sobe — uma versão antiga do app lendo esta base mostraria a arquivada na
   lista de escolha, que é a degradação mais inofensiva que existe. */
function etqsAtivas(){return (DB.etq||[]).filter(function(t){return !t.arq;});}
function etqsArquivadas(){return (DB.etq||[]).filter(function(t){return !!t.arq;});}
/* Devolve {etq, jaExistia, reativou}. Nunca cria duplicata: quem já existe
   volta — e, se estava arquivada, VOLTA ATIVA. Digitar o nome de uma etiqueta
   arquivada é dizer que você quer usá-la de novo; devolver "já existe" e
   deixá-la fora da lista seria um beco sem saída. */
function criarEtq(nome){
  nome=String(nome||'').trim().replace(/\s+/g,' ');
  if(!nome)return null;
  var ja=acharEtq(nome);
  if(ja){
    var rea=!!ja.arq;
    if(rea)ja.arq=false;
    return {etq:ja,jaExistia:true,reativou:rea};
  }
  var t={id:uid('q'),n:nome,arq:false};
  DB.etq=DB.etq||[];DB.etq.push(t);
  return {etq:t,jaExistia:false,reativou:false};
}
/* Quantos LANÇAMENTOS usam a etiqueta. Conta o lançamento, não a ocorrência:
   uma compra em 6× com a etiqueta é uma coisa etiquetada, não seis. */
function usosEtq(id){
  var n=0;
  for(var i=0;i<DB.exp.length;i++){
    var t=DB.exp[i].etq;
    if(t&&t.indexOf(id)>=0)n++;
  }
  return n;
}
function temEtq(e,id){return !!(e&&e.etq&&e.etq.indexOf(id)>=0);}
function totalEstornado(e){
  return estornosDe(e).reduce(function(a,x){return a+x.v;},0);
}
/* Expande um lançamento nas suas ocorrências — uma por parcela.
   Uma ocorrência tem a mesma forma de um lançamento, então lista,
   resumo e filtros não precisam saber o que é uma parcela.
   `oid` é sempre o id da COMPRA: é por ele que se edita e se exclui. */
function ocorrenciasDe(e){
  var n=nParc(e),ests=estornosDe(e);
  /* `rec`/`comp` viajam junto: sem eles a tela não sabe que aquele lançamento
     veio de uma recorrência, e passa a oferecer "Tornar recorrente" de novo. */
  /* `etq` viaja junto como `rec`/`comp`: a etiqueta é da COMPRA, então todas
     as parcelas herdam. Filtrar por "reembolsável" mostra as seis parcelas,
     exatamente como filtrar por categoria já mostra. */
  var meta={cat:e.cat,sub:e.sub,pay:e.pay,desc:e.desc,ts:e.ts,
            rec:e.rec||null,comp:e.comp||null,dc:e.d,vt:e.v,etq:e.etq||null};
  var vs,ds,i;
  if(n<2){vs=[e.v];ds=[e.d];}
  else{vs=fatiar(e.v,n);ds=[];for(i=0;i<n;i++)ds.push(addMesData(e.d,i));}

  /* Sem estorno, o resultado é byte a byte o de sempre. */
  if(!ests.length){
    var out0=[];
    for(i=0;i<n;i++)out0.push(ocorr(e,meta,(n<2?e.id:e.id+'#'+(i+1)),ds[i],vs[i],i+1,n));
    return out0;
  }

  /* REGRA B1, escolhida por você em 24/09 e escrita por extenso:
     a compra passa a valer (total − estornos); o que já caiu fica como está;
     o que falta é refatiado para fechar no novo total; e se o que já caiu
     passar do novo total, a diferença volta como devolução no mês do estorno.

     Os estornos são aplicados EM ORDEM, cada um enxergando o estado deixado
     pelo anterior — dois estornos parciais em meses diferentes não dão o
     mesmo resultado que um só pela soma, e somar seria mentir sobre quando
     cada devolução aconteceu. */
  var total=e.v,devs=[];
  for(var k=0;k<ests.length;k++){
    var est=ests[k],pago=0,futuros=[];
    for(i=0;i<ds.length;i++){
      if(ds[i]<=est.d)pago+=vs[i];
      else futuros.push(i);
    }
    var novo=Math.max(0,total-est.v);
    var falta=novo-pago;
    if(falta>=0){
      if(futuros.length){
        var novosV=fatiar(falta,futuros.length);
        for(i=0;i<futuros.length;i++)vs[futuros[i]]=novosV[i];
      }
      /* falta>0 sem parcela futura só acontece se a compra foi editada depois
         do estorno; não há onde acomodar, e inventar uma parcela seria pior. */
    }else{
      for(i=0;i<futuros.length;i++)vs[futuros[i]]=0;
      devs.push({d:est.d,v:falta});   /* falta é negativo: é o que volta */
    }
    total=novo;
  }

  var out=[];
  for(i=0;i<n;i++){
    /* parcela zerada pelo estorno não vira linha: ela não vai acontecer.
       É daqui que "Comprometido à frente" se conserta sozinho — a ocorrência
       deixa de existir, sem nenhuma regra nova naquele bloco. */
    if(vs[i]===0)continue;
    out.push(ocorr(e,meta,(n<2?e.id:e.id+'#'+(i+1)),ds[i],vs[i],i+1,n));
  }
  for(k=0;k<devs.length;k++){
    var o=ocorr(e,meta,e.id+'@'+devs[k].d,devs[k].d,devs[k].v,1,1);
    o.dev=1;          /* é devolução de compra, não uma parcela */
    o.devDe=e.id;
    out.push(o);
  }
  return out;
}
function ocorr(e,meta,id,d,v,pi,pn){
  return {id:id,oid:e.id,d:d,cat:meta.cat,sub:meta.sub,v:v,pay:meta.pay,
          desc:meta.desc,ts:meta.ts,pi:pi,pn:pn,dc:meta.dc,vt:meta.vt,
          rec:meta.rec,comp:meta.comp,etq:meta.etq};
}
function ocorrencias(){
  var out=[];
  for(var i=0;i<DB.exp.length;i++){
    var o=ocorrenciasDe(DB.exp[i]);
    for(var j=0;j<o.length;j++)out.push(o[j]);
  }
  return out;
}
function compraDe(o){
  var id=o.oid||o.id;
  for(var i=0;i<DB.exp.length;i++)if(DB.exp[i].id===id)return DB.exp[i];
  return null;
}
/* rótulo curto "3/6", vazio quando é à vista */
function seloParc(o){return (o&&o.pn>1)?(o.pi+'/'+o.pn):'';}
/* o que ainda vai vencer depois do mês mk */
function comprometido(mk){
  var por={},tot=0,n=0,compras={},ult=null;
  ocorrencias().forEach(function(o){
    if(o.pn<2)return;
    /* Este bloco é dívida assumida. Uma venda parcelada a receber é o oposto
       disso, então entrada nunca entra aqui — nem parcelada. */
    if(eEntrada(o.cat))return;
    var m=mkey(o.d);
    if(m<=mk)return;
    por[m]=(por[m]||0)+o.v;tot+=o.v;n++;compras[o.oid]=1;
    if(!ult||m>ult)ult=m;
  });
  var meses=Object.keys(por).sort().map(function(m){return {m:m,v:por[m]};});
  return {tot:tot,n:n,compras:Object.keys(compras).length,ate:ult,meses:meses};
}

/* ============================================================
   RECORRÊNCIAS
   Um molde NÃO é uma despesa: ele é previsão. Só vira lançamento
   quando você confirma, e só então entra em qualquer soma.
   Por isso nada aqui se parece com ocorrenciasDe(): parcela é fato
   consumado, recorrência é aposta sobre um mês que talvez nem venha.
   ============================================================ */
function rec(id){
  var L=DB.rec||[];
  for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];
  return null;
}
/* Data da competência: o dia do molde, preso ao último dia do mês curto. */
function dataComp(r,comp){
  var dia=Math.max(1,Math.min(31,parseInt(r.dia,10)||1));
  var ult=new Date(+comp.slice(0,4),+comp.slice(5,7),0).getDate();
  return comp+'-'+String(Math.min(dia,ult)).padStart(2,'0');
}
/* Competências que este molde produz: de `inicio` até o MÊS ATUAL, nunca além.
   Anual só no mês configurado. Nunca mais que MAXRETRO meses para trás. */
function compsDe(r){
  var out=[],ate=mkey(hoje());
  var piso=addMes(ate,-(MAXRETRO-1));
  var m=r.inicio||ate;
  if(m<piso)m=piso;
  if(r.ate&&r.ate<ate)ate=r.ate;
  var mesAnual=Math.max(1,Math.min(12,parseInt(r.mes,10)||1));
  var guarda=0;
  while(m<=ate&&guarda++<MAXRETRO+2){
    if(r.freq!=='anual'||(+m.slice(5,7))===mesAnual)out.push(m);
    m=addMes(m,1);
  }
  return out;
}
/* Para um molde variável, a melhor estimativa é o ÚLTIMO mês confirmado —
   não o valor do molde, que envelhece na primeira conta de luz. */
function valorSugerido(r){
  if(r.fixo!==false)return r.v;
  var ultimo=null;
  for(var i=0;i<DB.exp.length;i++){
    var e=DB.exp[i];
    if(e.rec!==r.id||!e.comp)continue;
    if(!ultimo||e.comp>ultimo.comp)ultimo=e;
  }
  return ultimo?ultimo.v:r.v;
}
/* A regra que decide tudo: está pendente quando NÃO existe lançamento com
   aquele molde e aquela competência, e ela não foi pulada. Sem mapa de
   controle — é isso que faz "excluí para refazer" funcionar de graça. */
function pendentes(){
  var out=[],L=DB.rec||[];
  for(var i=0;i<L.length;i++){
    var r=L[i],pul=r.pulados||[],feitos={};
    for(var k=0;k<DB.exp.length;k++){
      var e=DB.exp[k];
      if(e.rec===r.id&&e.comp)feitos[e.comp]=1;
    }
    var cs=compsDe(r);
    for(var j=0;j<cs.length;j++){
      var c=cs[j];
      if(feitos[c]||pul.indexOf(c)>=0)continue;
      var dd=dataComp(r,c);
      out.push({rec:r.id,comp:c,d:dd,n:r.n,cat:r.cat,sub:r.sub,
                /* v32: VENCIDA é o que separa "precisa de você hoje" de "ainda
                   vai acontecer". Não é o mês: é o dia do molde já ter chegado.
                   Pendência de mês passado é vencida por definição. */
                vencida:dd<=hoje(),
                fixo:r.fixo!==false,v:valorSugerido(r),pay:r.pay||null,desc:r.desc||'',
                /* v27 (item 9): a etiqueta do molde viaja na pendência e
                   chega no lançamento confirmado. */
                etq:(r.etq||[]).slice()});
    }
  }
  out.sort(function(a,b){return a.comp<b.comp?-1:(a.comp>b.comp?1:(a.n<b.n?-1:1));});
  return out;
}
/* v32: o que o app COBRA é só o que já venceu. O resto continua existindo —
   na folha, no número do fechamento do mês — mas não pede nada. */
function pendentesVencidas(){
  return pendentes().filter(function(x){return x.vencida;});
}
/* quantos lançamentos já confirmados vieram deste molde */
function confirmadosDe(id){
  var n=0;
  for(var i=0;i<DB.exp.length;i++)if(DB.exp[i].rec===id&&DB.exp[i].comp)n++;
  return n;
}
function pularComp(r,comp){
  r.pulados=r.pulados||[];
  if(r.pulados.indexOf(comp)<0)r.pulados.push(comp);
  r.pulados.sort();
}
function reativarComp(r,comp){
  r.pulados=(r.pulados||[]).filter(function(c){return c!==comp;});
}

/* tinta legível sobre uma cor qualquer (serve para cores criadas por você) */
function lum(hex){
  var h=hex.replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var f=function(v){v=parseInt(v,16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*f(h.slice(0,2))+.7152*f(h.slice(2,4))+.0722*f(h.slice(4,6));
}
function tinta(hex){try{return lum(hex)>.30?'#101319':'#FFFFFF';}catch(e){return '#FFFFFF';}}

/* Formato de dados mais NOVO que esta versão do app (build 2026-09-24.2).
   Até aqui o app só sabia subir dado antigo; dado novo demais ele lia como se
   entendesse, e na primeira gravação devolveria um objeto no formato velho —
   apagando em silêncio tudo o que a versão nova tivesse acrescentado.
   Isso era hipótese enquanto o service worker buscava o app na rede a cada
   abertura. Com o cache respondendo primeiro, a casca pode ficar uma versão
   atrás de propósito, e aí a hipótese vira rotina. */
var FUTURO=0;
function carregar(){
  var raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){raw=null;}
  if(!raw){DB=novoDB();salvar();return;}
  try{
    var d=JSON.parse(raw);
    if(d&&typeof d==='object'&&d.v>SCHEMA){
      /* não migra e não grava: só guarda o que achou, para a tela poder contar */
      FUTURO=d.v;DB=d;return;
    }
    var antes=d.v||1;
    DB=migrar(d);
    /* grava a subida de formato na hora: se ficasse só em memória, um backup
       exportado depois sairia carimbado com o formato velho. */
    if(DB.v!==antes)salvar();
  }catch(e){
    DB=novoDB();
  }
}
function migrar(d){
  if(!d||typeof d!=='object')return novoDB();
  if(!d.v)d.v=SCHEMA;
  /* formato 1 -> 2: nada a converter. Lançamento sem `par` é à vista,
     que é exatamente como o formato 1 gravava tudo. */
  if(d.v<SCHEMA)d.v=SCHEMA;
  d.cats=d.cats||[];d.exp=d.exp||[];d.prefs=d.prefs||{};
  /* formato 2 -> 3: só cria a coleção de moldes. Nenhum lançamento é tocado. */
  d.rec=d.rec||[];
  /* formato 3 -> 4: entradas. Nada a converter — categoria sem `tipo` é saída,
     que é exatamente o que toda categoria gravada até aqui significa. Nenhum
     lançamento é lido, nenhum valor é reescrito. */
  /* formato 4 -> 5: orçamento. Só cria a coleção vazia. Nenhum lançamento é
     lido e nenhuma categoria é tocada — quem nunca definir meta tem um app
     byte a byte igual ao de antes. */
  d.metas=d.metas||[];
  /* formato 6 -> 7: etiquetas. Só cria a coleção vazia. Lançamento sem `etq`
     é lançamento sem etiqueta, que é o que todos os lançamentos gravados até
     aqui significam — nada é lido e nada é reescrito. O formato sobe porque a
     volta não é inofensiva: um app na versão 6 leria a base sem enxergar as
     etiquetas e o filtro simplesmente não existiria, em silêncio. */
  d.etq=d.etq||[];
  /* formato 5 -> 6: estorno vinculado. Nada a converter — compra sem `est` é
     compra sem estorno, que é exatamente o que toda compra gravada até aqui
     significa. Nenhum lançamento é lido e nenhum valor é reescrito. O formato
     sobe mesmo assim porque o caminho de VOLTA não é inofensivo: um app na
     versão 5 lendo estes dados ignoraria o `est` e voltaria a contar as
     parcelas estornadas, em silêncio. É para isso que existe a guarda do
     item 49. */
  d.ordem=d.ordem||d.cats.map(function(c){return c.id;});
  /* garante que a ordem cobre todas as categorias e só elas */
  var ids=d.cats.map(function(c){return c.id;});
  d.ordem=d.ordem.filter(function(id){return ids.indexOf(id)>=0;});
  ids.forEach(function(id){if(d.ordem.indexOf(id)<0)d.ordem.push(id);});
  var p=d.prefs;
  if(!p.tema)p.tema='auto';
  if(!p.dens)p.dens='auto';
  if(p.ultBackup===undefined)p.ultBackup=null;
  if(!p.inicio)p.inicio=hoje();
  if(!p.topSubs)p.topSubs={};
  return d;
}
function salvar(){
  /* trava de segurança do formato futuro: nenhuma gravação, por nenhum
     caminho. A tela de aviso não deixa chegar aqui, mas gravação que apaga
     dado não se protege com uma camada só. */
  if(FUTURO)return false;
  try{
    localStorage.setItem(KEY,JSON.stringify(DB));
    avisoGravacao=false;
    return true;
  }catch(e){
    /* nunca falhar em silêncio: achar que salvou e não ter salvo é pior que o erro */
    if(!avisoGravacao){
      avisoGravacao=true;
      alerta('Não foi possível salvar','O armazenamento do navegador recusou a gravação. Pode ser cota cheia ou navegação privada. Exporte um backup agora e verifique — o que está na tela ainda não foi gravado.');
    }
    return false;
  }
}

/* ---------------- acessores ---------------- */
function cat(id){for(var i=0;i<DB.cats.length;i++)if(DB.cats[i].id===id)return DB.cats[i];return null;}
function sub(c,id){if(!c)return null;for(var i=0;i<c.subs.length;i++)if(c.subs[i].id===id)return c.subs[i];return null;}

/* ---------------- lado: entrada ou saída ----------------
   O lado mora na CATEGORIA, nunca no lançamento. Categoria sem `tipo` é saída,
   e é isso que faz base antiga continuar valendo sem migrar um byte.
   Cada lado soma o seu; a subtração acontece uma vez só, no fim. Nenhum lugar
   do código inverte sinal. */
function eEntrada(id){var c=cat(id);return !!(c&&c.tipo==='e');}
function saidasDe(l){return l.filter(function(o){return !eEntrada(o.cat);});}
function entradasDe(l){return l.filter(function(o){return eEntrada(o.cat);});}
function somaDe(l){return l.reduce(function(a,b){return a+b.v;},0);}
function saldoDe(l){return somaDe(entradasDe(l))-somaDe(saidasDe(l));}
function temEntrada(l){for(var i=0;i<l.length;i++)if(eEntrada(l[i].cat))return true;return false;}
/* valor com sinal para exibição: "− 300,00", "+ 8.900,00".
   O sinal vem do VALOR, nunca do lado — senão um mês em que os estornos superam
   as compras imprime "− -250,00", que foi exatamente o defeito que o teste
   do filtro de lado pegou. */
function brlSin(v,mais){return (v<0?'− ':(mais?'+ ':''))+brl(Math.abs(v));}
function brlSinRS(v){return (v<0?'− R$ ':'+ R$ ')+brl(Math.abs(v));}
/* Saldo não é fluxo: leva "R$" sempre e sinal só quando é negativo. Escrever
   "+ R$" num saldo positivo daria a ele cara de entrada, que ele não é. */
function brlRS(v){return (v<0?'− R$ ':'R$ ')+brl(Math.abs(v));}
/* Com estorno, o total de um mês ou de uma categoria pode fechar em ZERO ou
   negativo. Dividir por ele produz NaN ("NaN% da categoria" chegou à tela) ou
   um percentual sem sentido, e largura de barra negativa não existe. Em vez de
   esconder, o app mostra um traço — que é a resposta honesta para "que fatia
   isto é de zero?". */
function pctLabel(v,tot,suf){
  /* Três casos em que "que fatia isto é do total?" não tem resposta:
     total zero ou negativo; a própria fatia negativa (categoria estornada); e
     fatia maior que o total, que acontece quando OUTRA categoria ficou negativa
     — foi assim que a tela chegou a imprimir "200,0% do mês". */
  if(!(tot>0)||v<0||v>tot)return '—';
  return (v/tot*100).toFixed(1).replace('.',',')+'% '+suf;
}
function largBarra(v,max){
  if(!(max>0))return 0;
  return Math.max(0,Math.min(100,v/max*100));
}

/* ---------------- orçamento (v18, formato 5) ----------------
   Meta com VIGÊNCIA. Cada mudança grava a partir de que mês vale, e meses
   fechados continuam com a meta que valia neles. Sem isso, aumentar a meta
   hoje faria agosto virar "dentro da meta" por uma decisão que agosto não
   conheceu — o passado mudaria de veredito sozinho.
   Na tela isso não aparece como configuração: você define um número e ele vale
   do mês corrente em diante. A vigência só é dita quando há passado afetado.
   Remover é evento com data também, gravado como v:0: apagar uma meta não pode
   apagar o histórico de tê-la cumprido. */
function metaDe(catId,mk){
  var L=DB.metas||[],melhor=null;
  for(var i=0;i<L.length;i++){
    var m=L[i];
    if(m.cat!==catId||m.desde>mk)continue;
    if(!melhor||m.desde>melhor.desde)melhor=m;
  }
  return (melhor&&melhor.v>0)?melhor.v:null;
}
function definirMeta(catId,cents,mk){
  mk=mk||mkey(hoje());
  var L=DB.metas=DB.metas||[];
  for(var i=0;i<L.length;i++)if(L[i].cat===catId&&L[i].desde===mk){L[i].v=cents;return;}
  L.push({cat:catId,desde:mk,v:cents});
}
/* quantas categorias de SAÍDA têm meta valendo em mk */
function comMeta(mk){
  var n=0;
  catsOrdenadas(false).forEach(function(c){if(!eEntrada(c.id)&&metaDe(c.id,mk))n++;});
  return n;
}
/* as metas do mês com o que foi gasto de fato, para a faixa de aviso */
function balancoMetas(mk){
  var todas=ocorrencias().filter(function(e){return mkey(e.d)===mk;});
  var gasto={};
  saidasDe(todas).forEach(function(e){gasto[e.cat]=(gasto[e.cat]||0)+e.v;});
  var out=[];
  catsOrdenadas(false).forEach(function(c){
    if(eEntrada(c.id))return;
    var m=metaDe(c.id,mk);
    if(!m)return;
    out.push({id:c.id,meta:m,v:gasto[c.id]||0,estourou:(gasto[c.id]||0)>m});
  });
  return out;
}
/* média de saída de uma categoria nos meses FECHADOS anteriores a mk.
   É a única âncora honesta para escolher um número: meta chutada no vazio não
   se cumpre. Devolve null quando não há mês fechado — inventar uma média de
   zero meses seria pior que não mostrar nada. */
function mediaCat(catId,mk,n){
  var disp=Math.min(n||6,mesesAntes(mk));
  if(disp<1)return null;
  var todas=ocorrencias(),soma=0;
  /* serieMeses devolve {m,v}, não a chave do mês — o `.m` aqui é o que faltava
     na primeira versão, que somava zero em silêncio. */
  var meses=serieMeses(addMes(mk,-1),disp);
  for(var i=0;i<meses.length;i++){
    var m=meses[i].m;
    saidasDe(todas.filter(function(e){return mkey(e.d)===m;}))
      .forEach(function(e){if(e.cat===catId)soma+=e.v;});
  }
  return {v:Math.round(soma/disp),n:disp};
}

/* ---------------- séries e réguas de comparação (v14) ----------------
   Tudo aqui lê SAÍDAS por ocorrência, que é a mesma leitura de caixa do número
   grande: parcela conta no mês em que vence, não no mês da compra. Se algum dia
   estas funções e o número grande discordarem, é aqui que está o erro. */
/* v20 (lote D): tudo o que o cartão do topo lê passa a aceitar um LADO.
   Até aqui o Resumo inteiro presumia saída — o que estava certo enquanto o
   número grande só falava de gasto. Com o seletor mandando no cartão, régua,
   sparkline e variação precisam existir dos dois lados, e essa é a razão de
   este lote ser o mais caro do plano: não é um texto que muda, é toda a
   cadeia de leitura. */
function doLado(l,ent){return ent?entradasDe(l):saidasDe(l);}
function somaMesSai(todas,mk,ent){
  return somaDe(doLado(todas.filter(function(e){return mkey(e.d)===mk;}),ent));
}
/* O mês do primeiro lançamento. É ele que decide quais réguas existem — e é
   por isso que "mesmo mês do ano passado" fica invisível até haver ano passado. */
function primeiroMes(){
  var m=null;
  for(var i=0;i<DB.exp.length;i++){
    var k=mkey(DB.exp[i].d);
    if(!m||k<m)m=k;
  }
  return m;
}
function mesesAntes(mk){
  var p=primeiroMes();
  if(!p)return 0;
  var a=p.split('-'),b=mk.split('-');
  return Math.max(0,(+b[0]-+a[0])*12+(+b[1]-+a[1]));
}
/* Série de n meses terminando em mk, com um recorte opcional.
   `f` é {tipo:'cat'|'etq', id}; sem ele, é o total do lado.

   v29 (item 4): a janela é a MESMA para qualquer recorte — 12 meses até mk,
   com zero onde não houve nada. Encolher a janela para "os meses em que essa
   categoria teve algo" faria dois gráficos lado a lado terem eixos diferentes,
   e um mês vazio vale como informação: é um mês em que você não gastou ali. */
function serieEvo(mk,n,ent,f){
  var todas=ocorrencias(),out=[];
  if(f&&f.tipo==='cat')todas=todas.filter(function(o){return o.cat===f.id;});
  if(f&&f.tipo==='etq')todas=todas.filter(function(o){return temEtq(o,f.id);});
  for(var i=n-1;i>=0;i--){var m=addMes(mk,-i);out.push({m:m,v:somaMesSai(todas,m,ent)});}
  return out;
}
function serieMeses(mk,n,ent){return serieEvo(mk,n,ent,null);}
/* Quantos meses a janela tem de fato. Menos de 3 não é série: dois pontos são
   um traço. É a mesma regra que a sparkline já usava, e é ela que decide se a
   porta da folha existe. */
function janelaEvo(mk){return Math.min(12,mesesAntes(mk)+1);}
/* As réguas disponíveis para mk, em ordem de proximidade. Cada uma some quando
   não tem dado — comparação sem base não é comparação, é número inventado.
   `meses` é a lista que forma a base: uma só nas pontuais, N na média. É ela
   que deixa a folha calcular a base POR CATEGORIA sem repetir esta lógica. */
/* v20 (2.2): teve saída naquele mês? É diferente de "somou mais que zero".
   Um mês com R$ 500 gastos e R$ 500 estornados fechou em zero, mas houve
   movimento — e dizer "não há mês anterior para comparar" sobre um mês em que
   você gastou e devolveu é falso. A régua existe; a base é zero. */
function teveSaida(todas,mk,ent){
  for(var i=0;i<todas.length;i++)
    if(mkey(todas[i].d)===mk&&(eEntrada(todas[i].cat)===!!ent))return true;
  return false;
}
function reguas(mk,ent){
  var todas=ocorrencias(),out=[];
  var ant=addMes(mk,-1),vAnt=somaMesSai(todas,ant,ent);
  if(teveSaida(todas,ant,ent))out.push({id:'ant',rot:'Mês anterior',curto:mesCurto(ant),
                      longo:mesLabel(ant),meses:[ant],base:vAnt});
  /* A média precisa de pelo menos 4 meses fechados: com 2 ou 3 ela é tão
     instável quanto o mês anterior e só acrescenta um número a mais. O rótulo
     diz quantos meses ela usou de verdade — escrever "média de 6 meses" com 4
     meses na mão seria mentir no rótulo. */
  var disp=Math.min(6,mesesAntes(mk));
  if(disp>=4){
    var ms=[],soma=0,i;
    for(i=1;i<=disp;i++){var m=addMes(mk,-i);ms.push(m);soma+=somaMesSai(todas,m,ent);}
    if(ms.some(function(m){return teveSaida(todas,m,ent);}))out.push({id:'media',rot:'Média de '+disp+'m',
                        curto:'média de '+disp+' meses',
                        longo:'a média dos '+disp+' meses anteriores',
                        meses:ms,base:Math.round(soma/disp)});
  }
  var ano=addMes(mk,-12),vAno=somaMesSai(todas,ano,ent);
  if(teveSaida(todas,ano,ent))out.push({id:'ano',rot:mesCurto(ano),curto:mesCurto(ano),
                      longo:mesLabel(ano),meses:[ano],base:vAno});
  return out;
}
/* O texto e a cor do delta. Mesma regra de sempre: menos de 0,05% é "≈". */
function deltaDe(tot,base,rot){
  /* v20 (2.2): base zero é possível agora — mês que teve movimento e fechou em
     zero por estorno. Porcentagem sobre zero é infinito, e "∞% a mais" não
     informa nada: nesse caso o texto diz o fato em reais. */
  if(!base)return {cls:tot>0?'up':'flat',arw:tot>0?'▲':'≈',
                   txt:(tot>0?('R$ '+brl(tot)+' a mais que '):'igual a ')+rot+' (R$ 0,00)'};
  var p=(tot-base)/base*100;
  return {cls:p>=0.05?'up':(p<=-0.05?'down':'flat'),
          arw:p>=0.05?'▲':(p<=-0.05?'▼':'≈'),
          txt:Math.abs(p).toFixed(1).replace('.',',')+'% vs. '+rot+' (R$ '+brl(base)+')'};
}
/* Variação por categoria entre a régua e o mês. A base de uma régua de vários
   meses é a MÉDIA da categoria naqueles meses, não a soma — senão a variação
   de um mês contra seis sairia sempre negativa e enorme. */
function variacaoCats(mk,reg,ent){
  var todas=ocorrencias(),agora={},antes={},ids={},i;
  doLado(todas.filter(function(e){return mkey(e.d)===mk;}),ent).forEach(function(e){
    agora[e.cat]=(agora[e.cat]||0)+e.v;ids[e.cat]=1;});
  for(i=0;i<reg.meses.length;i++){
    doLado(todas.filter(function(e){return mkey(e.d)===reg.meses[i];}),ent).forEach(function(e){
      antes[e.cat]=(antes[e.cat]||0)+e.v;ids[e.cat]=1;});
  }
  var n=reg.meses.length;
  return Object.keys(ids).map(function(k){
    var a=Math.round((antes[k]||0)/n),b=agora[k]||0;
    return {id:k,antes:a,agora:b,v:b-a};
  }).filter(function(x){return x.v!==0;})
    .sort(function(x,y){return Math.abs(y.v)-Math.abs(x.v);});
}
/* O que falta ao número grande para fechar o mês: os recorrentes PENDENTES
   daquela competência. Parcela do mês já está no número (ocorrencias() a
   coloca no mês em que vence) e recorrente confirmado virou lançamento. */
function pendenteDoMes(mk){
  var ps=pendentes(),t=0,n=0;
  for(var i=0;i<ps.length;i++){
    if(ps[i].comp!==mk||eEntrada(ps[i].cat))continue;
    t+=ps[i].v;n++;
  }
  return {tot:t,n:n};
}

/* ---------------- como o mês se formou (v15, ideia 5) ----------------
   Quanto do mês já estava decidido antes do mês começar. É o número que diz
   onde há alavanca: cortar gasto é sempre conversa sobre a segunda parte.

   Conta como COMPROMETIDO: parcela da segunda em diante — a primeira você
   decidiu neste mês, e é a mesma régua que `comprometido()` usa — e lançamento
   vindo de um molde recorrente. Todo o resto é decisão deste mês.

   A ressalva que fica impressa no próprio cartão: só é "recorrente" o que veio
   de molde. Aluguel digitado na mão todo mês cai em "decidido neste mês" e o
   número erra para menos. Preferimos errar à vista a esconder o critério. */
function formacaoMes(noMes){
  var sai=saidasDe(noMes),c=0,d=0,nc=0,nd=0;
  for(var i=0;i<sai.length;i++){
    var e=sai[i];
    if((e.pi&&e.pi>=2)||e.rec){c+=e.v;nc++;}else{d+=e.v;nd++;}
  }
  return {comp:c,dec:d,nc:nc,nd:nd,tot:c+d};
}

/* A sparkline: 12 meses terminando em mk, sem eixo e sem valores. Ela responde
   "isto é normal para mim?", que nenhum número da tela responde.
   O mês corrente é PARCIAL — ele sempre aparece mais baixo do que vai terminar.
   Desenhar isso como se fosse um número fechado produziria uma queda no fim
   todo santo mês. Por isso o último trecho sai tracejado e o ponto sai vazado
   quando mk é o mês de hoje, e o rótulo da ponta diz "parcial". */
function sparkHTML(mk,ent){
  var n=Math.min(12,mesesAntes(mk)+1);
  if(n<3)return '';                       /* dois pontos são um traço, não uma série */
  var serie=serieMeses(mk,n,ent),vs=serie.map(function(x){return x.v;});
  var lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(!(hi>0))return '';
  /* respiro vertical; também é o que impede divisão por zero quando todos os
     meses têm o mesmo valor */
  var pad=(hi-lo)*0.12||hi*0.12||1;
  lo-=pad;hi+=pad;
  var pts=serie.map(function(x,i){
    return [i/(n-1)*100,100-(x.v-lo)/(hi-lo)*100];
  });
  var dd=function(a){return 'M'+a.map(function(p){
    return p[0].toFixed(2)+' '+p[1].toFixed(2);}).join(' L');};
  var parcial=(mk===mkey(hoje()));
  var solido=dd(parcial?pts.slice(0,n-1):pts);
  var trecho=parcial?('<path class="parc" d="'+dd(pts.slice(n-2))+
                      '" vector-effect="non-scaling-stroke"/>'):'';
  var area=dd(pts)+' L100 130 L0 130 Z';
  return '<span class="sparkwrap"><svg class="spark" viewBox="0 0 100 100" '+
    'preserveAspectRatio="none" aria-hidden="true">'+
    '<path class="area" d="'+area+'"/>'+
    '<path d="'+solido+'" vector-effect="non-scaling-stroke"/>'+trecho+'</svg>'+
    /* o ponto fica FORA do SVG: com preserveAspectRatio="none" um círculo
       desenhado lá dentro sairia ovalado */
    '<span class="pt'+(parcial?' parc':'')+'" style="top:'+pts[n-1][1].toFixed(1)+'%"></span>'+
    '</span><span class="sparkl"><span>'+mesCurto(serie[0].m)+'</span>'+
    '<span>'+mesCurto(mk)+(parcial?' · parcial':'')+'</span></span>';
}
/* v29 (item 4): a sparkline deixou de ser enfeite.

   Ela desenhava doze meses sem um número e sem um toque — o único gráfico
   decorativo que tinha sobrado nesta tela, contra a regra que a v13 fixou:
   gráfico aqui ou é tocável, ou vem com os números. Agora ela é a PORTA da
   folha de evolução.

   E a porta vem ROTULADA. Uma sparkline que por acaso é clicável é uma porta
   que depende de você tentar: os 28px do rótulo são o preço de ela ser lida em
   vez de descoberta. O rótulo usa o mesmo desenho do botão de comparação que
   está logo acima, porque os dois fazem a mesma coisa — abrem uma folha que
   explica o número grande. */
function portaEvo(mk,ent){
  var sp=sparkHTML(mk,ent);
  if(!sp)return '';
  return '<button class="evoport"><span class="evolbl">'+
    '<span class="gp"><span>📈</span>Últimos 12 meses</span>'+ICO.chev+'</span>'+sp+'</button>';
}

/* ---------------- a rosca do Resumo (v13, item 31) ----------------
   Geometria em unidades de viewBox; a tela renderiza a 184px. */
var RO_R=38,RO_W=12.5,RO_CIRC=2*Math.PI*38,RO_CINZA='#A8A29E';
/* Quantas fatias a rosca aguenta. A taxonomia tem 12 categorias de saída; com
   todas desenhadas, as seis últimas viram tiras de 0 a 3px e três cores
   vizinhas (rosa, magenta, roxo) já não se distinguem.

   A regra: no máximo SEIS fatias de categoria; o que sobrar vira "Outras"
   (cinza) no fim do anel. Nada some — o ranking logo abaixo continua listando
   todas. Sete ou menos desenha todas, porque agrupar aí economizaria no máximo
   uma fatia e custaria dois nomes.

   A primeira versão disto tinha também um corte por cobertura ("fatias até
   90% do total"). Ela parecia mais esperta e era pior: com sete categorias o
   corte disparava na quinta e jogava DUAS categorias no cinza para economizar
   UMA fatia. Quantas fatias aparecem não pode depender de como o mês se
   distribuiu — senão a mesma tela muda de forma sem que nada tenha mudado de
   tamanho. Regra fixa é mais previsível e sempre deixa mais nomes à vista. */
function fatiasRosca(rank,tot){
  if(rank.length<=7)return rank.slice();
  var out=rank.slice(0,6),acum=0,i;
  for(i=0;i<6;i++)acum+=rank[i].v;
  var resto=tot-acum;
  if(resto>0)out.push({id:null,v:resto});
  return out;
}
/* Devolve '' quando a rosca não teria significado: total zero ou negativo, ou
   alguma categoria negativa por estorno. É a mesma resposta que pctLabel dá
   nesses casos — lá um traço, aqui a ausência do desenho. O ranking fica. */
function roscaHTML(rank,tot,meio){
  if(!(tot>0))return '';
  for(var j=0;j<rank.length;j++)if(rank[j].v<0)return '';
  var fat=fatiasRosca(rank,tot),off=0,sv='';
  for(var i=0;i<fat.length;i++){
    var f=fat[i];
    var cor=f.id?((cat(f.id)||{c:'#78716C'}).c):RO_CINZA;
    var frac=f.v/tot;
    /* o 1.2 é o fio de respiro entre uma fatia e a seguinte: sem ele, duas
       cores próximas encostam e viram uma fatia só aos olhos */
    var comp=Math.max(0,frac*RO_CIRC-1.2);
    sv+='<circle cx="50" cy="50" r="'+RO_R+'" stroke="'+cor+'" stroke-width="'+RO_W+'"'+
        ' stroke-dasharray="'+comp.toFixed(3)+' '+(RO_CIRC-comp).toFixed(3)+'"'+
        ' stroke-dashoffset="'+(RO_CIRC/4-off*RO_CIRC).toFixed(3)+'"></circle>';
    off+=frac;
  }
  return '<div class="dwrap"><svg class="donut" viewBox="0 0 100 100" aria-hidden="true">'+
         sv+'</svg><div class="dmid">'+meio+'</div></div>';
}

function densAtual(){

  return DENS[densAuto()];
}
function densAuto(){
  var m=document.getElementById('main');
  var h=(m&&m.clientHeight)||window.innerHeight-170;
  /* alvo: cartão em torno de 180 px de altura. Num iPhone padrão isso dá
     Equilibrado; num SE, Amplo; num Pro Max, Compacto. */

  r=Math.max(3,Math.min(5,r));
  return '2x'+r;
}

function layout(total){
  var G=densAtual(),vagas=G.c*G.r;
  if(total<=vagas)return {c:G.c,r:G.r,vagas:vagas,mostra:total,card:false};
  return {c:G.c,r:G.r,vagas:vagas,mostra:vagas-1,card:true};
}

/* ---------------- ranking de sub-categorias ---------------- */
function scoreSubs(c){
  var lim=new Date();lim.setDate(lim.getDate()-90);var limS=ymd(lim);
  var sc={};
  c.subs.forEach(function(s){sc[s.id]=0;});
  DB.exp.forEach(function(e){
    if(e.cat!==c.id)return;
    if(sc[e.sub]===undefined)return;
    sc[e.sub]+=(e.d>=limS?3:1);
  });
  return sc;
}
/* histerese: quem já está entre os visíveis só perde o lugar quando é
   de fato ultrapassado — a grade não pode dançar a cada registro */
function topSubs(c,n){
  var ativos=subsAtivas(c);
  if(ativos.length<=n)return ativos;
  var sc=scoreSubs(c);
  var idx={};ativos.forEach(function(s,i){idx[s.id]=i;});
  var prev=(DB.prefs.topSubs[c.id]||[]).filter(function(id){return idx[id]!==undefined;}).slice(0,n);
  var slots=prev.slice();
  var fora=ativos.filter(function(s){return slots.indexOf(s.id)<0;})
                 .sort(function(a,b){return (sc[b.id]-sc[a.id])||(idx[a.id]-idx[b.id]);});
  var k=0;
  while(slots.length<n&&k<fora.length)slots.push(fora[k++].id);
  for(;k<fora.length;k++){
    var ch=fora[k],pior=-1,piorSc=Infinity;
    for(var i=0;i<slots.length;i++){if(sc[slots[i]]<piorSc){piorSc=sc[slots[i]];pior=i;}}
    if(pior>=0&&sc[ch.id]>piorSc)slots[pior]=ch.id;else break;
  }
  DB.prefs.topSubs[c.id]=slots;
  return slots.map(function(id){return ativos[idx[id]];});
}

/* ---------------- valor: reais primeiro ----------------
   As funções abaixo trabalham sobre um OBJETO de digitação — `{intD,centD,modo,
   sinal}` — e não sobre S diretamente. S é só o objeto usado pela tela de
   registro. Foi assim que a folha de valor da edição (v12) conseguiu usar o
   mesmo teclado sem encostar no rascunho do registro: ela passa o objeto dela.
   As versões sem sufixo continuam existindo e continuam lendo S, para que nada
   escrito antes da v12 precise mudar. */
function centsDe(st){
  return (parseInt(st.intD||'0',10)||0)*100+parseInt((st.centD+'00').slice(0,2),10);
}
function totalCents(){return centsDe(S);}
/* totalCents() continua sendo a MAGNITUDE digitada — é o que o teclado, o
   "Confirmar" desabilitado e a prévia de parcelas leem. O sinal entra só aqui. */
function valorDe(st){return centsDe(st)*(st.sinal<0?-1:1);}
function valorFinal(){return valorDe(S);}
function fmtIntDe(st){
  var n=(st.intD||'0').replace(/^0+(?=\d)/,'');
  return n.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
}
function fmtIntD(){return fmtIntDe(S);}
function decDe(st){return (st.centD+'00').slice(0,2);}
/* v33: quais dos dois centavos você digitou e quais vieram de graça. Digitar
   `,5` neste app significa CINQUENTA centavos — o dígito entra da esquerda
   para a direita, então o zero que falta é real e o valor já está decidido.
   Mostrar `,5_` seria mentir sobre o que seria salvo. Então o dígito não
   digitado aparece mais claro: o número continua verdadeiro e o apagar se vê
   andando. */
function decPartesDe(st){
  var d=decDe(st),n=(st.modo==='cent'?st.centD.length:0);
  return {tip:d.slice(0,n),imp:d.slice(n)};
}
function decD(){return decDe(S);}
function decDigitadoDe(st){return st.modo==='cent'||st.centD!=='';}
function decDigitado(){return decDigitadoDe(S);}
/* v33: SEMEADO = nada foi tocado ainda. A folha abre com o valor "selecionado",
   como um campo de formulário: o primeiro dígito recomeça o número, que é o que
   se quer em 9 de cada 10 edições. Do segundo em diante é digitação normal.
   Antes, o primeiro dígito entrava no fim dos centavos — que já estavam cheios —
   e era ENGOLIDO EM SILÊNCIO: a tecla aceitava o toque e não fazia nada. */
function kDigEm(st,d){
  if(st.semeado){st.semeado=false;st.centD='';st.modo='reais';st.intD=d;return;}
  if(st.modo==='cent'){if(st.centD.length<2)st.centD+=d;}
  else{if(st.intD.length<7)st.intD=(st.intD+d).replace(/^0+(?=\d)/,'');}
}
function kDig(d){kDigEm(S,d);}
/* v33: a vírgula SEMPRE recomeça os centavos, e nunca fica desabilitada.
   Antes ela desligava assim que o modo virava 'cent' — e com os dois centavos
   cheios o teclado inteiro ficava mudo, sem saída nenhuma. Uma regra no lugar
   de duas: tocar na vírgula é dizer "vou digitar os centavos agora". */
function kVirgEm(st){
  st.semeado=false;st.modo='cent';st.centD='';
}
function kVirg(){kVirgEm(S);}
/* Apaga da direita para a esquerda, UM caractere por toque — e a vírgula é um
   caractere.  De 125,80:  ,8 → , → (sai dos centavos) → 12 → 1 → vazio.

   v33 juntou os dois últimos toques dos centavos num só, porque o toque que
   sai do modo não mexe em dígito nenhum e me pareceu tecla morta. Era o
   contrário: ele APAGA A VÍRGULA, e é ele que torna o apagar previsível. Sem
   ele, dois toques sobre dois centavos digitados pulavam direto para os reais
   e o dígito seguinte ia parar no lugar errado — sem nada na tela avisando.

   v34 devolve os três toques. O aviso de cor (a vírgula acende quando você
   está nos centavos) volta a ser CONFIRMAÇÃO e não o canal principal: quem
   digitou a vírgula sabe que ela está lá até apagá-la. */
function kBackEm(st){
  st.semeado=false;
  if(st.modo==='cent'){
    if(st.centD)st.centD=st.centD.slice(0,-1);
    else st.modo='reais';
  }
  else st.intD=st.intD.slice(0,-1);
}
function kBack(){kBackEm(S);}
/* kSomaEm/kSoma saíram na v33 junto com os botões +10/+50/+100: sem eles,
   ninguém mais chamava. Código que não faz nada não fica. */
/* Objeto de digitação já preenchido com um valor que existe (edição). O sinal
   vem do próprio valor, nunca de um parâmetro à parte — foi assim que a v11
   evitou o "− -250,00". */
function estadoValor(cents){
  var a=Math.abs(cents||0);
  /* v33: abre em 'cent', ou seja, com o cursor NO FIM do número.
     Abrindo em 'reais', o apagar comia os reais da direita para a esquerda e
     NUNCA chegava nos centavos: de 280,50 você ia para 28,50, 2,50, 0,50 — e o
     ",50" ficava grudado para sempre. Era o defeito que mais incomodava, e ele
     estava numa única palavra. */
  return {intD:String(Math.floor(a/100)),centD:('0'+(a%100)).slice(-2),
          modo:'cent',sinal:(cents<0?-1:1),semeado:true};
}

/* v32: tocar no cabeçalho volta ao topo da tela.

   É o gesto da barra de status do iOS, no lugar onde o dedo já está — com 60
   lançamentos no mês, voltar ao topo eram seis arrastadas. Não vale na aba de
   registro: lá o cabeçalho é o "Voltar", e um toque perto dele tem outro
   significado. */
function aoTopo(){
  var sc=main.querySelector('.scroll');
  if(!sc||sc.scrollTop<=0)return;

     comprimir não mexe mais em layout, mas chegar ao topo com o cabeçalho
     ainda encolhido seria um estado que não existe em lugar nenhum. */
  var tela=main.querySelector('.screen');
  if(tela&&tela.__abrir)tela.__abrir();

function cardGrid(itens,L,onPick,onMore,corDe,restantes){

/* ============================================================
   VISOR + TECLADO (componente)
   Extraído da tela 3 na v12 para que a folha de valor da edição use
   exatamente o mesmo componente — mesmo visor, mesmas teclas, mesmo ±,
   mesmos três avisos de estorno. O DOM produzido é idêntico ao que a tela
   de registro produzia antes, classe por classe: é isso que mantém as
   verificações de geometria e de estorno valendo sem tocar nelas.

   cfg = {ent:bool, okTxt:'Confirmar', onOk:fn, onUpd:fn(st), onSinal:fn(st)}
   ============================================================ */
function blocoValor(st,cfg){
  cfg=cfg||{};
  /* v18: o rótulo do visor deixa de presumir que todo número é lançamento.
     "Valor da saída" em cima de uma meta mensal é simplesmente errado. */
  var amt=el('<div class="amount"><div class="k">'+
    (cfg.rotulo||('Valor da '+(cfg.ent?'entrada':'saída')))+'</div>'+
    '<div class="n"><span class="cur">R$</span><span class="fig"><span class="int">0</span>'+
    '<span class="dec">,<span class="tip"></span><span class="imp">00</span></span>'+
    '</span></div></div>');
  var rFig=amt.querySelector('.fig'),rInt=amt.querySelector('.int'),rDec=amt.querySelector('.dec');
  var rTip=rDec.querySelector('.tip'),rImp=rDec.querySelector('.imp');
  var rN=amt.querySelector('.n'),rCur=amt.querySelector('.cur');
  var rPar=el('<div class="parc" hidden></div>');
  amt.appendChild(rPar);

  var pad=el('<div class="pad"><div class="quick"></div><div class="keys"></div></div>');
  var q=pad.querySelector('.quick'),k=pad.querySelector('.keys');
  /* v33: os somadores +10/+50/+100 saíram. Eram três botões que ele não usava,
     e ocupavam a fileira inteira — espremer um C ali ao lado deles daria cinco
     controles de 58,6px. Sem eles o C vai para o canto de cima à esquerda, que
     é onde a calculadora o põe, e a fileira volta a ter dois controles folgados.
     Voltar atrás é devolver estas sete linhas: nada mais depende delas. */
  var rLim=el('<button class="lim" aria-label="Limpar o valor">C</button>');
  rLim.onclick=function(){
    st.intD='';st.centD='';st.modo='reais';st.semeado=false;upd();
  };
  q.appendChild(rLim);
  /* O respiro continua: o C LIMPA, o ± INVERTE. Encostados, pareceriam a mesma
     família. */
  q.appendChild(el('<span class="gap"></span>'));
  var rSig=el('<button class="sig" aria-pressed="false" aria-label="Inverter o sinal">±</button>');
  rSig.onclick=function(){
    st.sinal=(st.sinal<0?1:-1);
    if(cfg.onSinal)cfg.onSinal(st);
    upd();
  };
  /* v18: há valores que não têm lado negativo. Meta de gasto é um deles —
     "orçamento de menos quinhentos reais" não quer dizer nada. Esconder o ±
     é mais honesto que aceitar o estado e consertar depois. */
  if(cfg.semSinal)rSig.hidden=true;
  q.appendChild(rSig);
  ['1','2','3','4','5','6','7','8','9','v','0','b','ok'].forEach(function(d){
    var b;
    if(d==='ok'){b=el('<button class="key go">Confirmar</button>');b.onclick=function(){if(cfg.onOk)cfg.onOk();};}
    else if(d==='b'){b=el('<button class="key back" aria-label="Apagar">'+ICO.apagar+'</button>');b.onclick=function(){kBackEm(st);upd();};}
    else if(d==='v'){b=el('<button class="key comma" aria-label="Centavos">,</button>');b.onclick=function(){kVirgEm(st);upd();};}
    else{b=el('<button class="key">'+d+'</button>');b.onclick=function(){kDigEm(st,d);upd();};}
    k.appendChild(b);
  });
  /* `rVir` saiu daqui: a única coisa que se fazia com ele era desabilitá-lo. */
  var rGo=k.querySelector('.go');

  function upd(){
    var t=centsDe(st),neg=(st.sinal<0);
    rInt.textContent=fmtIntDe(st);
    var dp=decPartesDe(st);
    rTip.textContent=dp.tip;rImp.textContent=dp.imp;
    rDec.classList.toggle('typed',decDigitadoDe(st));
    rFig.classList.toggle('zero',t===0);
    rGo.disabled=(t===0&&!cfg.zeroOk);
    /* v33: a vírgula NUNCA desabilita — ver kVirgEm. */
    rLim.disabled=(t===0&&!st.intD);
    /* Três avisos ao mesmo tempo para o estorno, em três lugares da tela: o
       número, o próprio ± e o botão de confirmar. Um toque sem querer no ± tem
       de ser impossível de não ver. */
    rN.classList.toggle('neg',neg);
    rN.classList.toggle('rec',!!cfg.ent&&!neg);
    rCur.textContent=neg?'− R$':'R$';
    rSig.setAttribute('aria-pressed',neg?'true':'false');
    rGo.textContent=neg?(cfg.okNegTxt||'Confirmar estorno'):(cfg.okTxt||'Confirmar');
    rGo.classList.toggle('dan',neg);
    if(cfg.onUpd)cfg.onUpd(st,{par:rPar,go:rGo});
  }
  return {amt:amt,pad:pad,upd:upd,par:rPar,go:rGo,sig:rSig,lim:rLim};
}

/* ============================================================
   LANÇAMENTOS
   ============================================================ */
function filtrados(){
  /* lê OCORRÊNCIAS, não lançamentos: uma compra em 6× aparece no mês de cada
     parcela. À vista a ocorrência é o próprio lançamento, então nada muda. */
  var out=ocorrencias();
  if(S.periodo==='mes')out=out.filter(function(e){return mkey(e.d)===S.mesLista;});
  else if(S.periodo==='ano')out=out.filter(function(e){return e.d.slice(0,4)===S.mesLista.slice(0,4);});
  /* Datas em AAAA-MM-DD comparam como texto na ordem certa, então não há
     conversão nem fuso horário envolvido aqui. As duas pontas entram. */
  else if(S.periodo==='dia')out=out.filter(function(e){return e.d===S.dia;});
  else if(S.periodo==='faixa')out=out.filter(function(e){return e.d>=S.de&&e.d<=S.ate;});
  if(S.fLado==='saida')out=saidasDe(out);
  else if(S.fLado==='entrada')out=entradasDe(out);
  if(S.fCat)out=out.filter(function(e){return e.cat===S.fCat;});
  /* v27 (item 9): o filtro por etiqueta. Fica junto do de categoria porque é o
     mesmo tipo de corte — só que transversal. */
  if(S.fEtq)out=out.filter(function(e){return temEtq(e,S.fEtq);});
  if(S.fSub)out=out.filter(function(e){return e.sub===S.fSub;});
  if(S.fPay)out=out.filter(function(e){return e.pay===S.fPay;});
  if(S.fMin!=null)out=out.filter(function(e){return e.v>=S.fMin;});
  if(S.fMax!=null)out=out.filter(function(e){return e.v<=S.fMax;});
  if(S.fBusca){
    var q=S.fBusca.toLowerCase();
    out=out.filter(function(e){
      return (e.desc||'').toLowerCase().indexOf(q)>=0
        ||nomeSub(e.cat,e.sub).toLowerCase().indexOf(q)>=0
        ||nomeCat(e.cat).toLowerCase().indexOf(q)>=0;
    });
  }
  /* v20 (2.10): "maior valor" numa lista que mistura os lados deixou de ser
     "maior gasto" — o salário subia ao topo e a devolução afundava. Com os dois
     lados à mostra a ordem passa a ser pelo MÓDULO, que é o que "maior valor"
     quer dizer quando há sinal. Num lado só, nada muda. */
  if(S.ordena==='valor'){
    var misto=temEntrada(out)&&temSaida(out);
    out.sort(misto?function(a,b){return Math.abs(b.v)-Math.abs(a.v);}
                  :function(a,b){return b.v-a.v;});
  }
  else if(S.ordena==='cat')out.sort(function(a,b){
    var d=nomeCat(a.cat).localeCompare(nomeCat(b.cat),'pt-BR');
    return d||(b.d<a.d?-1:1);});
  else out.sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:b.ts-a.ts);});
  return out;
}
/* ============================================================
   v37 — DUAS CONTAS, UMA REGRA SÓ

   As duas contam A MESMA COISA: **o que está escondido de você neste
   momento**. Elas são duas porque há dois "escondido" diferentes.

   `nFiltros()` é o contador do funil: conta o que mora DENTRO da folha, que é
   o que aquele botão abre. A v37 mexeu nos dois lados dessa conta, e nos dois
   casos a regra é que mandou:
     · a SUB-CATEGORIA saiu (subiu para a faixa de chips — está à vista agora);
     · o LADO entrou (desceu do cabeçalho para a folha).
   Sem a segunda metade, o Tudo/Saídas/Entradas viraria o único filtro do app
   que some sem deixar rastro.

   `nFiltrosTotal()` é o contador da barra quando o cabeçalho encolhe: ali
   TODOS os controles estão fora da tela, então ele conta todos. É ele que
   impede o pior efeito do cabeçalho que encolhe — rolar, os chips sumirem, e
   você esquecer que há filtro aceso.
   ============================================================ */
function nFiltros(){
  var n=0;
  if(S.fPay)n++;
  if(S.fMin!=null)n++;
  if(S.fMax!=null)n++;
  if(S.fLado!=='tudo')n++;
  return n;
}
function nFiltrosTotal(){
  var n=nFiltros();
  if(S.fCat)n++;
  if(S.fSub)n++;
  if(S.fEtq)n++;
  if(S.fBusca)n++;
  if(S.periodo!=='mes')n++;
  return n;
}
/* "Existe QUALQUER coisa para limpar?" é exatamente a pergunta que
   `nFiltrosTotal()` responde — e tinha uma lista própria, escrita à mão, que
   era um segundo lugar para esquecer de atualizar. Agora é a mesma conta. */
function temFiltro(){ return nFiltrosTotal()>0; }
/* Um lugar só para o "volta tudo ao normal" — usado pelo chip Limpar, pelo
   botão da folha de filtros e pelo estado vazio. */
function limparTudo(){
  S.fCat=null;S.fEtq=null;S.fSub=null;S.fPay=null;S.fMin=null;S.fMax=null;S.fBusca='';
  S.fLado='tudo';S.periodo='mes';
  /* v37: limpar a busca sem fechar o campo deixaria 44px abertos e vazios logo
     depois de você pedir "limpar tudo". O campo é parte do que se limpa. */
  S.buscaAberta=false;
}

/* Rótulo do período, usado na barra de cima E na barra de totais — as duas
   precisam dizer a mesma coisa, senão o número grande fica sem dono. */
function rotuloPeriodo(){
  if(S.periodo==='tudo')return 'Tudo';
  if(S.periodo==='ano')return 'Ano de '+S.mesLista.slice(0,4);
  if(S.periodo==='dia')return diaCurto(S.dia)+' '+S.dia.slice(0,4);
  if(S.periodo==='faixa'){
    if(S.de===S.ate)return diaCurto(S.de)+' '+S.de.slice(0,4);
    /* mesmo mês: "1 – 15 set 2026". Meses diferentes, o mês entra nas duas
       pontas. Anos diferentes, o ano também. */
    if(mkey(S.de)===mkey(S.ate))
      return (+S.de.slice(8))+' – '+(+S.ate.slice(8))+' '+MESC[+S.ate.slice(5,7)-1]+' '+S.ate.slice(0,4);
    if(S.de.slice(0,4)===S.ate.slice(0,4))
      return diaCurto(S.de)+' – '+diaCurto(S.ate)+' '+S.ate.slice(0,4);
    return diaCurto(S.de)+' '+S.de.slice(0,4)+' – '+diaCurto(S.ate)+' '+S.ate.slice(0,4);
  }
  return mesLabel(S.mesLista);
}
/* Setas: mês e ano andam de mês e de ano, dia anda de dia. Intervalo NÃO anda —
   deslocar uma janela de 15 dias em 15 dias produz recortes que ninguém pede
   ("16–30 set" não é um período que exista para alguém). */
function periodoNavega(){return S.periodo==='mes'||S.periodo==='ano'||S.periodo==='dia';}

/* A base só ganha o seletor de lado quando existe lançamento de entrada. Sem
   isso, a tela fica idêntica à de antes da v11 para quem só tem saídas. */
function baseTemEntrada(){
  for(var i=0;i<DB.exp.length;i++)if(eEntrada(DB.exp[i].cat))return true;
  return false;
}
/* Quando a lista mistura os dois lados, "total" vira SALDO e a média deixa de
   fazer sentido — soma de coisas de sinais opostos dividida por contagem não
   diz nada. No lugar dela vão os dois lados em separado. */
/* Um lado só na lista não é "misto": filtrando Entradas, o ramo de baixo
   repetia o total das entradas como se fosse o saldo e ainda imprimia
   "+ R$ 0,00" de saídas. O ramo misto agora exige os DOIS lados presentes. */
function temSaida(l){for(var i=0;i<l.length;i++)if(!eEntrada(l[i].cat))return true;return false;}
/* v20 (2.3): o número grande da lista trocava de SIGNIFICADO conforme o filtro
   — saldo com os dois lados à mostra, soma do lado quando só um aparece — e o
   rótulo continuava dizendo apenas "setembro de 2026". O mesmo lugar, o mesmo
   mês, dois números diferentes e nenhuma palavra explicando. Agora o rótulo
   diz o que o número é, e o período vem depois dele. */
function rotuloTot(vis){
  var per=rotuloPeriodo();
  if(temEntrada(vis)&&temSaida(vis))return 'Saldo · '+per;
  if(temEntrada(vis))return 'Entradas · '+per;
  if(temSaida(vis))return 'Saídas · '+per;
  return per;
}
function resumoLista(vis){
  if(!temEntrada(vis)||!temSaida(vis)){
    /* item 35: a média saiu dos DOIS lados. Ela já não existia no ramo misto
       (soma de sinais opostos dividida por contagem não diz nada) nem com
       estorno nem com um lançamento só — ou seja, era um número que aparecia
       e sumia conforme o filtro, e ninguém consegue confiar num rodapé assim.
       Agora a legenda deste ramo é sempre a mesma: a contagem. */
    var t=somaDe(vis);
    return {v:(t<0?'− R$ ':'R$ ')+brl(Math.abs(t)),
            c:vis.length+(vis.length===1?' lançamento':' lançamentos')};
  }

/* ============================================================
   v37 — a compressão da barra de total

   A REGRA QUE FAZ ISTO SER SEGURO: **comprimir não pode mexer em layout
   nenhum.**

   A primeira versão comprimia a barra de verdade, tirando 43px de altura de
   conteúdo que estava ACIMA da pessoa — e depois devolvia esses 43px na
   rolagem para a lista não saltar. Funcionava parada e quebrava em movimento:
   o Chrome já compensa sozinho (scroll anchoring) e o Safari não, então a
   correção acontecia DUAS VEZES e a lista saltava 86px; e, pior, mexer em
   `scrollTop` no meio de uma rolagem suave MATA a animação — tocar no
   cabeçalho com a lista em 400 parava em 357 em vez de chegar ao topo. As duas
   coisas foram medidas, e as duas vinham da mesma causa.

   Agora o invólucro tem ALTURA FIXA, medida do próprio desenho na primeira
   vez. Quem encolhe é só o cartão dentro dele; o espaço que sobra fica
   transparente e a lista rola por baixo — que é exatamente o que se queria.
   Nada muda de altura, então não há salto para compensar, não há âncora de
   rolagem para brigar, e não há mão no volante durante a rolagem suave.

   Duas notas sobre os números:
   · O LIMITE É LIDO DO DOM (`tw.offsetTop`), não cravado — número de layout
     cravado em código é data de validade.
   · A HISTERESE de 60px existe para que a faixa de troca não fique
     exatamente em cima do limite, piscando entre as duas formas.
   ============================================================ */
function ligarEncolher(s,sc,tw){
  var lim=null;
  function sinc(){
    if(lim===null){
      /* `tw.offsetTop` NÃO serve aqui, e isto custou uma hora: num elemento
         `sticky`, `offsetTop` devolve a posição ONDE ELE ESTÁ, que depois de
         grudar é a própria rolagem — o limite passava a perseguir o dedo e a
         barra nunca comprimia. O limite é o FIM DO VIZINHO DE CIMA, que não
         gruda e por isso tem posição de fluxo de verdade. */
      var ant=tw.previousElementSibling;
      lim=ant?(ant.offsetTop+ant.offsetHeight):0;
      /* prende a altura do invólucro na forma ABERTA, que é a que está na tela
         agora — a compressão passa a acontecer dentro de uma caixa que não
         muda de tamanho */
      tw.style.height=tw.offsetHeight+'px';
    }
    var enc=s.classList.contains('enc');
    var deve=enc?(sc.scrollTop>lim-60):(sc.scrollTop>=lim);
    if(deve!==enc)s.classList.toggle('enc',deve);
  }
  sc.addEventListener('scroll',sinc,{passive:true});
  s.__sinc=sinc;
  s.__abrir=function(){s.classList.remove('enc');};
}
/* O chip "Limpar" entra e sai conforme houver filtro. Digitar na busca é um
   filtro, e a busca NÃO redesenha a tela inteira (isso perderia o foco do
   campo) — por isso a fileira precisa de uma função de sincronia própria, e não
   pode depender de render(). */
function chipZero(){
  if(temFiltro()){
    var bl=el('<button class="fchip limpar so" aria-label="Limpar todos os filtros">'+
      ICO.xis+'</button>');
    bl.onclick=function(){limparTudo();render();};

  }
  var t=el('<button class="fchip" aria-pressed="true">Todas</button>');
  t.onclick=function(){S.fCat=null;S.fEtq=null;S.fSub=null;render();};
  return t;
}
/* Digitar na busca é um filtro, e a busca NÃO redesenha a tela inteira (isso
   perderia o foco do campo). Então a troca do primeiro chip precisa de uma
   sincronia própria, que não dependa de render(). */
function sincLimpar(rola){
  if(!rola)return;
  /* v37: a lupa acende quando há texto buscado, e digitar na busca NÃO
     redesenha a tela (isso perderia o foco). Sem esta sincronia, o aviso de
     "há uma busca ativa" só aparecia no próximo render — ou seja, justamente
     nunca, porque quem está digitando não provoca render nenhum. */
  var lupa=rola.querySelector('.fchip.busc');
  if(lupa){
    lupa.dataset.on=S.fBusca?1:0;
    lupa.setAttribute('aria-label',S.fBusca?('Busca ativa: '+S.fBusca):'Buscar');
  }
  /* v37: funil e lupa vêm antes; o que alterna é o TERCEIRO */
  var alvo=rola.children[2];
  if(!alvo)return;
  if(alvo.classList.contains('limpar')===temFiltro())return;
  rola.replaceChild(chipZero(),alvo);
}

     trocado aqui é a `.lista` — limpar o `.scroll` inteiro levaria junto o
     período, os chips e a barra de total, e com eles o foco do campo de busca

    return;
  }

  var dias=[];vis.forEach(function(e){if(dias.indexOf(e.d)<0)dias.push(e.d);});

    var it=vis.filter(function(e){return e.d===d;});
    var g=el('<div class="daygrp"><div class="dayhd"><span class="d">'+diaLabel(d)+'</span><span class="t tnum">'+totalLinha(it)+'</span></div></div>');

function linhas(itens,comData){
  var w=el('<div class="optwrap"></div>');
  itens.forEach(function(e){
    var c=cat(e.cat)||{c:'#78716C',n:'—'};
    var meta=[];
    /* Numa parcela a segunda linha é curta de propósito e começa pelo que
       importa: o total e o prazo da compra. Sem isso é fácil ler R$ 80 de
       parcela como uma compra de R$ 80 — e o espaço é pouco, então o nome
       da categoria sai (o emoji e a cor já a identificam). */
    if(e.dev){
      /* v25: a devolução de uma compra parcelada não é um lançamento solto —
         ela tem dono, e a linha diz qual. Sem isso as parcelas somem do futuro
         e um crédito aparece no mês, sem nada ligando as duas coisas. */
      meta.push('estorno · compra '+(+e.dc.slice(8))+' '+MESC[+e.dc.slice(5,7)-1]+
                ' de R$ '+brl(e.vt));
      if(comData)meta.push(diaLabel(e.d));
    }else if(e.pn>1){
      meta.push(e.pn+'× de R$ '+brl(e.vt),'compra '+(+e.dc.slice(8))+' '+MESC[+e.dc.slice(5,7)-1]);
      if(comData)meta.push(diaLabel(e.d));
    }else{
      meta.push(c.n);
      if(comData)meta.push(diaLabel(e.d));
      if(e.pay)meta.push(e.pay);
    }
    var ent=eEntrada(e.cat);
    /* O sinal já grita, mas "− 300,00" verde numa lista de entradas verdes se
       confunde. A etiqueta no subtítulo é o que separa estorno de entrada. */
    /* v20 (2.13): a etiqueta faltava justamente do lado em que ela é mais
       necessária. Numa lista de entradas, todas verdes, "− 300,00" sem palavra
       nenhuma some no meio. Do lado da saída o nome é estorno; do lado da
       entrada, o dinheiro entrou e voltou — é devolução. */
    /* na devolução de compra a palavra já foi dita acima, com o dono junto */
    if(e.v<0&&!e.dev)meta.push(ent?'devolução':'estorno');
    /* v27 (item 9): a etiqueta entra como mais um segmento, e só quando existe.
       Com duas ou mais vira "reembolsável +1" — a maioria esmagadora dos
       lançamentos não tem nenhuma e não paga nada por isto. */
    var ret=rotuloEtq(e.etq);
    if(ret)meta.push(ret);
    if(e.desc)meta.push(e.desc);
    var selo=seloParc(e);
    var box=el('<div class="swipe"><div class="del">Excluir</div></div>');
    var r=el('<button class="erow" style="--c:'+c.c+'"><span class="ic">'+emojiSub(e.cat,e.sub)+'</span>'+
      '<span class="tx"><span class="t1">'+esc(nomeSub(e.cat,e.sub))+
        (selo?'<span class="pbadge">'+selo+'</span>':'')+'</span>'+
        '<span class="t2">'+esc(meta.join(' · '))+'</span></span>'+
      '<span class="vl tnum '+(ent?'vin':(e.v<0?'vneg':''))+'">'+brlSin(e.v,ent)+'</span></button>');
    box.querySelector('.del').onclick=function(){excluirLancamento(e);};
    box.appendChild(r);
    arrastarParaExcluir(box,r,function(){acoesLancamento(e);},function(){excluirLancamento(e);});
    w.appendChild(box);
  });
  return w;
}
/* Deslizar para a esquerda: até o meio do caminho revela o botão Excluir;
   passando do limiar, soltar exclui direto — como nas listas do iOS.
   Só engata em gesto horizontal, para não brigar com a rolagem vertical. */
function arrastarParaExcluir(box,row,aoTocar,aoExcluir){
  var ABRE=-88, ARMA=-165, MAX=-250;
  var x0=0,y0=0,dx=0,ativo=false,eixo=null,aberto=false,moveu=false,armado=false;
  var rot=box.querySelector('.del');
  function pos(v){row.style.transform='translateX('+v+'px)';}
  function armar(on){
    if(on===armado)return;
    armado=on;
    box.classList.toggle('armado',on);
    rot.textContent=on?'Soltar para excluir':'Excluir';
  }
  row.addEventListener('pointerdown',function(ev){
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    x0=ev.clientX;y0=ev.clientY;ativo=true;eixo=null;moveu=false;dx=aberto?ABRE:0;
  });
  row.addEventListener('pointermove',function(ev){
    if(!ativo)return;
    var ax=ev.clientX-x0,ay=ev.clientY-y0;
    if(!eixo){
      if(Math.abs(ax)<7&&Math.abs(ay)<7)return;
      eixo=Math.abs(ax)>Math.abs(ay)?'x':'y';
      if(eixo==='x'){try{row.setPointerCapture(ev.pointerId);}catch(err){}}
    }
    if(eixo!=='x')return;
    moveu=true;
    dx=Math.max(MAX,Math.min(0,ax+(aberto?ABRE:0)));
    row.style.transition='none';pos(dx);
    armar(dx<=ARMA);
  });
  function fim(){
    if(!ativo)return;ativo=false;
    row.style.transition='';
    if(eixo==='x'){
      if(dx<=ARMA){
        pos(-row.offsetWidth); armar(false); eixo=null;
        aoExcluir();
        /* Excluir nem sempre exclui na hora: parcela e lançamento de recorrência
           abrem uma pergunta antes. Se o usuário cancelar, não há redesenho e a
           linha ficaria fora da tela para sempre. Quando a exclusão acontece de
           fato, render() troca a lista e esta linha sai do documento. */
        setTimeout(function(){
          if(row.isConnected){row.style.transition='transform .18s';pos(0);aberto=false;}
        },50);
        return;
      }
      aberto=dx<-44;pos(aberto?ABRE:0);
    }
    armar(false);
    eixo=null;
  }
  row.addEventListener('pointerup',fim);
  row.addEventListener('pointercancel',fim);
  row.addEventListener('click',function(ev){
    if(moveu){ev.preventDefault();return;}
    if(aberto){aberto=false;pos(0);return;}
    aoTocar();
  });
}

/* ============================================================

function telaResumo(){

     saídas. É essa linha que garante o contrato da v11: o "Gasto em <mês>", a

  var doMes=saidasDe(noMes);

  bb[0].onclick=function(){S.mesSum=addMes(mk,-1);render();};
  bb[1].onclick=function(){S.mesSum=addMes(mk,1);render();};
  s.appendChild(pb);

  /* A faixa vem ANTES do estado vazio: quem acabou de criar os moldes e ainda

  if(!DB.exp.length){
    var sc0=el('<div class="scroll"></div>');
    var br0=bannerRecorrentes();
