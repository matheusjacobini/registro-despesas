      if(!li.length)li.push('nenhuma parcela futura muda — o estorno entra só '+

    bt.onclick=function(){st.v=resta;pinta();};

    };

  },{cancelar:'Cancelar',acao:'Salvar',aoAgir:function(){
    if(!(st.v>0))return;
    var antes=compra.est?compra.est.slice():null;
    compra.est=(compra.est||[]).concat([{d:st.d,v:st.v}]);
    if(!salvar()){if(antes)compra.est=antes;else delete compra.est;return;}
    fecharFolhas();render();
    toast('Estorno registrado','R$ '+brl(st.v)+' · '+nomeSub(compra.cat,compra.sub),
      'Desfazer',function(){
        if(antes)compra.est=antes;else delete compra.est;
        salvar();render();});
  }});
}
function desfazerEstorno(compra){

    'As parcelas canceladas voltam e a devolução sai do mês em que caiu. '+
    'A compra volta a valer R$ '+brl(compra.v)+'.','Desfazer',false,function(){
    delete compra.est;

/* repetir copia a COMPRA, não a parcela: repetir 1/6 de uma compra de R$ 480
   tem que gerar outra compra de R$ 480 em 6×, não uma despesa de R$ 80 */
function repetir(o){
  var e=compraDe(o)||o;
  var novo={id:uid('e'),d:hoje(),cat:e.cat,sub:e.sub,v:e.v,pay:e.pay,desc:e.desc,ts:Date.now()};
  if(nParc(e)>1)novo.par=nParc(e);
  DB.exp.unshift(novo);
  if(!salvar()){DB.exp.shift();return;}
  render();
  toast('Repetido hoje',(novo.par?(novo.par+'× de R$ '+brl(fatiar(novo.v,novo.par)[0])):('R$ '+brl(novo.v)))+
    ' · '+nomeSub(novo.cat,novo.sub),'Desfazer',function(){
    DB.exp=DB.exp.filter(function(x){return x.id!==novo.id;});salvar();render();});
}
function excluirLancamento(o){
  var id=o.oid||o.id;
  var i=DB.exp.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var alvo=DB.exp[i];
  /* A regra "pendente = não existe lançamento" é o que faz "excluí para refazer"
     funcionar de graça — mas ela também faria o app cobrar para sempre um mês que
     simplesmente não teve. Por isso aqui, e só aqui, o app pergunta. */
  if(alvo.rec&&alvo.comp&&rec(alvo.rec)){
    var r=rec(alvo.rec),comp=alvo.comp;
    folha('Excluir '+r.n+' de '+mesLabel(comp).split(' de ')[0]+'?',function(b){
      b.appendChild(el('<div class="hint" style="font-size:14.5px;padding:2px 4px 14px">'+
        'Ele veio da recorrência <b>'+esc(r.n)+'</b>. O que aconteceu com '+
        esc(mesLabel(comp).split(' de ')[0])+'?</div>'));
      var a1=el('<button class="btnfull sec">Excluir e cobrar de novo</button>');
      a1.onclick=function(){fecharFolhas();apagarCompra(id);};
      b.appendChild(a1);
      b.appendChild(el('<div class="hint" style="padding:6px 4px 12px">Volta para a lista '+
        'de pendentes. Use quando lançou errado e quer refazer.</div>'));
      var a2=el('<button class="btnfull dan">Excluir e pular '+esc(mesLabel(comp).split(' de ')[0])+'</button>');
      a2.onclick=function(){
        fecharFolhas();
        pularComp(r,comp);
        apagarCompra(id,{pulou:{r:r,comp:comp}});
      };
      b.appendChild(a2);
      b.appendChild(el('<div class="hint" style="padding:6px 4px 12px">Não pergunta mais por este '+
        'mês. Use quando aquele mês simplesmente não teve.</div>'));
    },{cancelar:'Cancelar'});
    return;
  }
  var n=nParc(DB.exp[i]);
  /* não existe meio-termo com um registro só: apagar uma parcela apaga a compra.
     Dizer isso com todas as letras é mais barato que desfazer depois. */
  if(n>1){
    confirmar2('Excluir a compra inteira?',
      'Isso remove as '+n+' parcelas, R$ '+brl(DB.exp[i].v)+' no total. Não dá para apagar só a parcela '+
      o.pi+'.','Excluir as '+n+' parcelas',true,function(){apagarCompra(id);});
    return;
  }
  apagarCompra(id);
}
function apagarCompra(id,opts){
  opts=opts||{};
  var i=DB.exp.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var copia=DB.exp[i];
  var n=nParc(copia);
  DB.exp.splice(i,1);
  if(!salvar()){
    DB.exp.splice(i,0,copia);
    if(opts.pulou)reativarComp(opts.pulou.r,opts.pulou.comp);
    return;
  }
  render();
  toast(opts.pulou?('Excluído e '+mesLabel(opts.pulou.comp).split(' de ')[0]+' pulado')
                  :(n>1?('Compra excluída · '+n+' parcelas'):'Lançamento excluído'),
    'R$ '+brl(copia.v)+' · '+nomeSub(copia.cat,copia.sub),'Desfazer',function(){
    DB.exp.splice(i,0,copia);
    if(opts.pulou)reativarComp(opts.pulou.r,opts.pulou.comp);
    salvar();render();});
}
/* edição abre um formulário único: o assistente de 3 telas é para criar, não para corrigir */
function editarLancamento(o){
  /* edita sempre o registro da COMPRA, mesmo quando se chegou aqui por uma parcela */
  var e=compraDe(o)||o;
  var tmp={cat:e.cat,sub:e.sub,parc:nParc(e)};
  folha(nParc(e)>1?(eEntrada(e.cat)?'Editar a venda':'Editar a compra'):'Editar lançamento',function(b){
    /* v12: era um <input inputmode="decimal">, que abria o teclado do SISTEMA —
       outro app dentro do app, sem os somadores, sem o ±, sem o visor. E, por ser
       texto livre, era a porta por onde entrava o que a tela de registro proíbe
       (o grave 1.4 da revisão v2). Virou uma linha tocável que abre o teclado
       do app; o valor vive em `tmp.v`, não no DOM. */
    tmp.v=e.v;
    var fv=el('<button class="field row tap"><span><span class="k">Valor</span>'+
      '<span class="v tnum"></span></span>'+ICO.chev+'</button>');
    var fvv=fv.querySelector('.v');
    function pintaValor(){
      fvv.textContent=(tmp.v<0?'− R$ ':'R$ ')+brl(Math.abs(tmp.v));
      fvv.classList.toggle('vneg',tmp.v<0);
    }
    fv.onclick=function(){
      /* v21 (item 27): venda parcelada era chamada de compra. O parcelamento
         existe nos dois lados; o nome não pode presumir um deles. */
      folhaValor(nParc(e)>1?(eEntrada(tmp.cat)?'Valor total da venda':'Valor total da compra'):'Valor',tmp.v,
        {ent:eEntrada(tmp.cat)},function(v){tmp.v=v;pintaValor();pintaParc();});
    };
    pintaValor();
    b.appendChild(fv);
    var fc=el('<button class="field row"><span><span class="k">Categoria</span><span class="v"></span></span>'+ICO.chev+'</button>');
    var fs=el('<button class="field row"><span><span class="k">Sub-categoria</span><span class="v"></span></span>'+ICO.chev+'</button>');
    /* v26 (item 50): data e pagamento eram um <input type="date"> e um <select>,
       ou seja, a EDIÇÃO abria os controles do iOS exatamente onde o REGISTRO
       abre os do app. O sintoma que te fez notar foi a língua: o seletor nativo
       segue o idioma do aparelho e mostrava "September 2026 / SUN MON TUE",
       enquanto o calendário do app é fixo em pt-BR. Agora os dois caminhos
       chegam na mesma folha. */
    tmp.d=e.d; tmp.pay=e.pay||null;
    var fd=el('<button class="field row"><span><span class="k">Data</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    var fp=el('<button class="field row"><span><span class="k">Pagamento</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    var ft=el('<div class="field"><div class="k">Descrição</div><input type="text" maxlength="80" value="'+esc(e.desc||'')+'"></div>');
    function pintaData(){fd.querySelector('.v').textContent=porExtenso(tmp.d);}
    function pintaPag(){
      var pg=null;
      PAGTOS.forEach(function(x){if(x[0]===tmp.pay)pg=x;});
      fp.querySelector('.v').textContent=pg?(pg[1]+' '+pg[0]):'opcional';
    }
    fd.onclick=function(){
      folhaData({sobre:true,valor:tmp.d,titulo:'Data do lançamento',
        aoEscolher:function(d){tmp.d=d;pintaData();pintaParc();}});
    };
    fp.onclick=function(){
      folhaPagto({sobre:true,valor:tmp.pay,ent:eEntrada(tmp.cat),
        aoEscolher:function(v){tmp.pay=v;pintaPag();}});
    };
    function pinta(){
      fc.querySelector('.v').textContent=nomeCat(tmp.cat);
      var c=cat(tmp.cat);
      fs.querySelector('.v').textContent=tmp.sub?nomeSub(tmp.cat,tmp.sub):(c&&c.subs.length?'escolher':'sem sub-categorias');
    }
    /* trocar categoria/sub atualiza os rótulos no próprio formulário,
       sem fechar e reabrir a folha (o que perderia o que já foi digitado) */
    var sub2=el('<div class="optwrap" style="margin:-3px 0 9px"></div>');
    sub2.hidden=true;
    function escolhaEmLinha(itens,corDe,onPick){
      sub2.innerHTML='';sub2.hidden=false;
      itens.forEach(function(it){
        var o=el('<button class="opt" style="--c:'+corDe(it)+'"><span class="ic">'+it.e+'</span><span class="nm">'+esc(it.n)+'</span><span></span></button>');
        o.onclick=function(){onPick(it);sub2.hidden=true;sub2.innerHTML='';pinta();};
        sub2.appendChild(o);
      });
      sub2.scrollIntoView({block:'nearest'});
    }
    fc.onclick=function(){
      escolhaEmLinha(catsOrdenadas(true),function(c){return c.c;},function(c){tmp.cat=c.id;tmp.sub=null;});
    };
    fs.onclick=function(){
      var c=cat(tmp.cat);
      if(!c||!c.subs.length)return;
      escolhaEmLinha(c.subs,function(){return c.c;},function(s){tmp.sub=s.id;});
    };
    pinta();
    var fx=el('<button class="field row"><span><span class="k">Parcelas</span>'+
      '<span class="v"></span></span>'+ICO.chev+'</button>');
    var fxAviso=el('<div class="hint" hidden></div>');
    function pintaParc(){
      /* v12: a tela de registro desliga as parcelas quando o valor fica
         negativo; aqui o valor negativo passava e o parcelamento era descartado
         em silêncio no Salvar. Agora a folha diz isso ANTES, em vez de o app
         jogar fora o que a pessoa escolheu. */
      if((tmp.v||0)<0){
        tmp.parc=1;
        fx.disabled=true;fx.classList.add('off');
        fx.querySelector('.v').textContent='à vista';
        fxAviso.innerHTML='Estorno não é parcelado — o valor é negativo.';
        fxAviso.hidden=false;
        return;
      }
      fx.disabled=false;fx.classList.remove('off');
      var n=tmp.parc||1,v=tmp.v||0;
      fx.querySelector('.v').textContent=(n===1?'à vista':(n+'×'));
      if(n>1&&v>0){
        fxAviso.innerHTML='<b>'+n+'× de R$ '+brl(fatiar(v,n)[0])+'</b>, de '+
          mesLabel(mkey(tmp.d)).split(' de ')[0]+' a '+mesLabel(mkey(addMesData(tmp.d,n-1))).split(' de ')[0]+'.';
        fxAviso.hidden=false;
      }else{fxAviso.hidden=true;}
    }
    fx.onclick=function(){
      folhaParcelas({sobre:true,valor:tmp.parc,total:tmp.v||0,data:tmp.d,
        aoEscolher:function(n){tmp.parc=n;pintaParc();}});
    };
    pintaData();pintaPag();

    b.appendChild(fc);b.appendChild(fs);b.appendChild(sub2);b.appendChild(fd);b.appendChild(fp);b.appendChild(ft);
    b.appendChild(fx);b.appendChild(fxAviso);
    pintaParc();
    var ok=el('<button class="btnfull">Salvar</button>');
    ok.onclick=function(){
      var v=tmp.v;
      /* O teclado do app já impede zero (o "Confirmar" fica desabilitado), mas a
         folha pode ter sido cancelada sem nunca ser aberta num registro vindo de
         um CSV estranho. A trava fica. Valor negativo É válido aqui — edita-se um
         estorno; o que não pode é negativo COM parcelas. */
      if(!v){alerta('Valor inválido','Toque em Valor e informe um número diferente de zero.');return;}
      var antes=JSON.parse(JSON.stringify(e));
      e.v=v;e.cat=tmp.cat;e.sub=tmp.sub;e.d=tmp.d||e.d;
      e.pay=tmp.pay||null;e.desc=ft.querySelector('input').value||'';
      var np=tmp.parc||1;
      if(np>1&&np<=MAXPARC&&v>0)e.par=np;else delete e.par;
      if(!salvar()){
        for(var k in antes)e[k]=antes[k];
        if(antes.par===undefined)delete e.par;
        return;
      }
      fecharFolhas();render();
      toast(nParc(e)>1?'Compra atualizada':'Lançamento atualizado',
        (nParc(e)>1?(nParc(e)+'× de R$ '+brl(fatiar(e.v,nParc(e))[0])):('R$ '+brl(e.v)))+
        ' · '+nomeSub(e.cat,e.sub),'Desfazer',function(){
        for(var k2 in antes)e[k2]=antes[k2];
        if(antes.par===undefined)delete e.par;
        salvar();render();});
    };
    b.appendChild(ok);
    var del=el('<button class="btnfull dan">'+(nParc(e)>1?
      (eEntrada(e.cat)?'Excluir a venda inteira':'Excluir a compra inteira'):'Excluir lançamento')+'</button>');
    del.onclick=function(){fecharFolhas();excluirLancamento(o);};
    b.appendChild(del);
  });
}

/* ============================================================
   PLANEJAR  (v18)
   ============================================================
   O que vale para o FUTURO em reais: moldes recorrentes e metas de gasto.
   A fronteira com Ajustes é essa, e ela precisa ser dita porque a próxima
   dúvida é sempre a mesma: "Categorias e sub-categorias" PARECE planejamento,
   mas é o vocabulário que o app inteiro usa para nomear as coisas — se a
   taxonomia vier para cá, a fronteira vira discussão a cada item novo. */
function telaPlanejar(){
  var s=el('<section class="screen"><div class="scroll pad-top"></div></section>');
  var b=s.firstElementChild;

  /* v36: saíram daqui a frase de abertura ("O que você decidiu de antemão…") e
     os dois sub-textos das linhas. Eram 167 caracteres de explicação para DUAS
     linhas de menu, e os três só repetiam o título: quem está na aba Planejar
     não precisa que lhe digam o que é "Recorrentes" nem o que é "Orçamento".
     O que cada linha tem a dizer de útil já está do lado direito, e é ESTADO —
     quantas existem, quantas a confirmar, quantas com meta. */
  b.appendChild(el('<div class="glabel">Compromissos</div>'));
  var g1=el('<div class="group"></div>');
  var nRec=(DB.rec||[]).length,nPend=pendentes().length;
  var rr=el('<button class="grow tap"><div><div class="r1">Recorrentes</div></div>'+
    '<div class="right"><span>'+(nRec?(nRec+(nPend?(' · '+nPend+' a confirmar'):'')):'nenhum')+
    '</span>'+ICO.chev+'</div></button>');
  rr.onclick=folhaRecorrentes;g1.appendChild(rr);
  b.appendChild(g1);

  b.appendChild(el('<div class="glabel">Metas</div>'));
  var g2=el('<div class="group"></div>');
  var mkA=mkey(hoje()),nM=comMeta(mkA),nC=0;
  catsOrdenadas(false).forEach(function(c){if(!eEntrada(c.id))nC++;});
  var ro=el('<button class="grow tap"><div><div class="r1">Orçamento</div></div>'+
    '<div class="right"><span>'+(nM?(nM+' de '+nC+' com meta'):'nenhuma')+
    '</span>'+ICO.chev+'</div></button>');
  ro.onclick=folhaMetas;g2.appendChild(ro);
  b.appendChild(g2);

  return s;
}

/* ---------------- orçamento (v18) ---------------- */
/* A tela de metas. Cada categoria traz a MÉDIA dos meses fechados ao lado,
   porque é a única âncora honesta para escolher um número — e a média
   reaparece na folha de definir, que é onde a decisão acontece. */
function folhaMetas(){
  var mk=mkey(hoje());
  folha('Orçamento',function(b){
    b.appendChild(el('<div class="hint" style="margin:2px 0 12px">A meta vale '+
      '<b>do mês corrente em diante</b>. Meses já fechados continuam com a meta '+
      'que valia neles.</div>'));
    var w=el('<div class="optwrap"></div>');
    catsOrdenadas(false).forEach(function(c){
      if(eEntrada(c.id))return;
      var m=metaDe(c.id,mk),md=mediaCat(c.id,mk,6);
      /* média zero é verdade — a categoria não teve gasto — mas escrita como
         "R$ 0,00" parece defeito. Dizer o fato é mais claro que imprimir o
         número. */
      var sub=!md?'ainda sem mês fechado para comparar'
              :(md.v===0?('sem gasto nos últimos '+md.n+(md.n===1?' mês':' meses'))
                        :('média de '+md.n+(md.n===1?' mês':' meses')+': R$ '+brl(md.v)));
      var o=el('<button class="opt" style="--c:'+c.c+'">'+
        '<span class="ic">'+c.e+'</span>'+
        '<span class="nm">'+esc(c.n)+'<small>'+sub+'</small></span>'+
        '<span class="tag tnum '+(m?'tem':'def')+'">'+(m?('R$ '+brl(m)):'definir')+
        '</span></button>');
      o.onclick=function(){folhaMeta(c,mk,md);};
      w.appendChild(o);
    });
    b.appendChild(w);
  },{cancelar:'Fechar'});
}
/* A folha de definir. Zerar o valor É remover a meta: a primeira versão tinha
   um "Remover a meta" em vermelho logo acima do teclado, na zona do polegar e
   encostado no 7-8-9 — destrutivo em lugar de errar. Sem controle novo, sem
   alvo perigoso: o visor em zero já muda a caixa de vigência e o botão. */
function folhaMeta(c,mk,md){
  var atual=metaDe(c.id,mk)||0;
  var antes=metaDe(c.id,addMes(mk,-1));
  var cx=el('<div class="vigbox"></div>');
  var pinta=function(cents){
    var quando='<b>Vale a partir de '+esc(mesLabel(mk))+'.</b>';
    var pass='';
    if(antes!==null&&antes!==cents)
      pass='<span class="av">'+esc(mesCurto(addMes(mk,-1)))+' e antes continuam com R$ '+
           brl(antes)+'.</span>';
    if(!cents)quando='<b>Sem meta a partir de '+esc(mesLabel(mk))+'.</b>';
    var anc=md?('<span class="av">Média de '+md.n+(md.n===1?' mês':' meses')+
                ': R$ '+brl(md.v)+'.</span>'):'';
    cx.innerHTML=quando+pass+anc;
  };
  pinta(atual);
  /* v20: remover deixou de ser "apague o número até zerar".
     Aquilo pedia que você descobrisse sozinho que um botão muda de texto ao
     chegar em zero — e chegava a uma ação destrutiva por um gesto de correção.
     Agora é um "Remover" no cabeçalho, visível só quando já existe meta, longe
     do polegar; e zerar volta a ser inválido, como em todo o resto do app. */
  var f=folhaValor('Meta de '+c.n,atual,{
    rotulo:'Meta mensal de '+c.n,
    semSinal:true,
    aviso:cx,
    okTxt:'Salvar a meta',
    acao:atual>0?{txt:'Remover',fn:function(){
      confirmar2('Remover a meta de '+c.n+'?',
        'A partir de '+mesLabel(mk)+' esta categoria fica sem meta. Os meses já '+
        'fechados continuam com a meta que valia neles.','Remover',true,function(){
        definirMeta(c.id,0,mk);salvar();render();folhaMetas();
        toast('Meta removida',c.n+' · sem meta a partir de '+mesCurto(mk),'',null);
      });
    }}:null,
    onUpd:function(st,r){
      var t=centsDe(st)*(st.sinal<0?-1:1);
      if(t<0)t=0;
      pinta(t);
    }
  },function(v){
    definirMeta(c.id,Math.max(0,v),mk);
    salvar();fecharFolhas();render();
    folhaMetas();
    toast('Meta salva',c.n+' · R$ '+brl(v)+' a partir de '+mesCurto(mk),'',null);
  });
  return f;
}

  var rd=el('<button class="grow tap danger"><div><div class="r1">Apagar todos os dados</div>'+
    '<div class="r2">Confirmação dupla. Não tem volta.</div></div></button>');
  rd.onclick=apagarTudo;g4.appendChild(rd);

function arrastarOrdem(row,host,corte){
  var hnd=row.querySelector('.hnd');
  hnd.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    var rows=Array.prototype.slice.call(host.querySelectorAll('.rrow'));
    var h=row.getBoundingClientRect().height;
    var i0=rows.indexOf(row),y0=ev.clientY,dy=0,alvo=i0;
    row.classList.add('drag');
    hnd.setPointerCapture(ev.pointerId);
    function mv(e2){
      dy=e2.clientY-y0;
      row.style.transform='translateY('+dy+'px)';
      var novo=Math.max(0,Math.min(rows.length-1,i0+Math.round(dy/h)));
      if(novo!==alvo){
        alvo=novo;
        rows.forEach(function(r,i){
          if(r===row)return;
          var d=0;
          if(i0<alvo&&i>i0&&i<=alvo)d=-h;
          else if(i0>alvo&&i<i0&&i>=alvo)d=h;
          r.style.transform='translateY('+d+'px)';
        });
      }
    }
    function up(){
      hnd.removeEventListener('pointermove',mv);
      hnd.removeEventListener('pointerup',up);
      hnd.removeEventListener('pointercancel',up);
      rows.forEach(function(r){r.style.transform='';});
      row.classList.remove('drag');
      if(alvo!==i0){
        var ids=rows.map(function(r){return r.dataset.id;});
        var m=ids.splice(i0,1)[0];ids.splice(alvo,0,m);
        DB.ordem=ids;salvar();
      }
      desenharOrdem(host,corte);
    }
    hnd.addEventListener('pointermove',mv);
    hnd.addEventListener('pointerup',up);
    hnd.addEventListener('pointercancel',up);
  });
}
/* v27 (item 51): o critério da linha de frequência, medido sobre o DADO.
   Devolve quantos lançamentos e por quantas categoriasexistem nos últimos 60
   dias — é isso que diz se um ranking significa alguma coisa. */
function baseFrequencia(){
  var lim=new Date();lim.setDate(lim.getDate()-60);var limS=ymd(lim);
  var n=0,cs={};
  DB.exp.forEach(function(e){if(e.d>=limS){n++;cs[e.cat]=1;}});
  return {n:n,cats:Object.keys(cs).length};
}

function folhaEditarEtiqueta(t){

      '<input type="text" maxlength="28" value="'+esc(t.n)+'"></div>');

    ok.onclick=function(){
      var n=f.querySelector('input').value.trim().replace(/\s+/g,' ');
      if(!n){alerta('Nome obrigatório','Toda etiqueta precisa de um nome.');return;}
      var ja=acharEtq(n);

        alerta('Já existe','Outra etiqueta já se chama "'+ja.n+'". Dois nomes iguais '+
          'quebrariam o filtro.');return;}
      var antes=t.n;t.n=n;
      if(!salvar()){t.n=antes;return;}
      fechar();fecharFolhas();render();folhaGerirEtiquetas();
    };
    b.appendChild(ok);
    /* v31: arquivar, entre Salvar e Excluir, exatamente onde a categoria põe o
       dela — e com a mesma palavra. Excluir apaga o rótulo de todo mundo;
       arquivar só tira da lista de escolha. São coisas diferentes e o desenho
       diz isso: o secundário no meio, o destrutivo no fim. */
    var arq=el('<button class="btnfull sec">'+(t.arq?'Reativar etiqueta':'Arquivar etiqueta')+'</button>');
    arq.onclick=function(){
      var antes=!!t.arq;
      t.arq=!antes;
      if(!salvar()){t.arq=antes;return;}
      fechar();fecharFolhas();render();folhaGerirEtiquetas();
      toast(antes?'Etiqueta reativada':'Etiqueta arquivada',
        t.n+(antes?' voltou para a lista de escolha.':
          (u?(' · continua em '+u+(u===1?' lançamento':' lançamentos')):' · sem uso')),
        'Desfazer',function(){t.arq=antes;salvar();render();});
    };
    b.appendChild(arq);

        (u?('Os '+u+(u===1?' lançamento continua':' lançamentos continuam')+' com ela, e você '):
            'Você ')+'pode reativar aqui a qualquer momento.')+'</div>'));
    /* Excluir NÃO é bloqueado quando há uso, como acontece com categoria —
       tirar a etiqueta de três lançamentos é inofensivo: o lançamento continua
       inteiro, só perde um rótulo. O que ela precisa é dizer o número e ter
       volta. */
    var del=el('<button class="btnfull dan">Excluir etiqueta</button>');
    del.onclick=function(){
      confirmar2('Excluir "'+t.n+'"?',
        u?('Ela sai de '+u+(u===1?' lançamento':' lançamentos')+
           '. Os lançamentos continuam inteiros — só perdem este rótulo.')
         :'Nenhum lançamento usa esta etiqueta.','Excluir',true,function(){
        var antesL=(DB.etq||[]).slice();
        var antesE=DB.exp.map(function(e){return e.etq?e.etq.slice():null;});
        DB.etq=DB.etq.filter(function(x){return x.id!==t.id;});
        DB.exp.forEach(function(e){
          if(!e.etq)return;
          e.etq=e.etq.filter(function(i){return i!==t.id;});
          if(!e.etq.length)delete e.etq;

    };
    b.appendChild(del);
  },{cancelar:'Cancelar'});

  var rank=catsOrdenadas(true).map(function(c){return {c:c,n:cnt[c.id]||0};})

/* ============================================================
   BUSCAR ATUALIZAÇÃO (v29)
   ============================================================
   Antes: apagava o cache, matava o service worker e recarregava ÀS CEGAS.
   Você voltava para a tela inicial sem saber se atualizou, se já estava
   atualizado, ou se nem houve rede — e, sem rede, o botão era a única forma
   de transformar um app que funciona num app que não abre, porque apagava
   justamente o cache que o faz abrir offline.

   Agora ele PERGUNTA ANTES. Busca o próprio index.html no servidor ignorando
   o cache (`cache:'reload'`), lê o carimbo da build que veio e compara com a
   que está rodando. Só apaga e recarrega se for diferente.

   O limite honesto, que está escrito na frase da tela: "o servidor está na
   build X" não é a mesma coisa que "não existe versão nova". Se o CDN do
   GitHub Pages ainda estiver servindo a página antiga — o que acontece por
   alguns minutos depois de cada publicação — a resposta está certa sobre o
   servidor e errada sobre o mundo. Por isso a frase nomeia o servidor.

   ATU é estado de tela e mora fora do DB: nada disto entra no backup. */
var ATU=null;
var ATU_CHAVE='despesas.atu';
function estadoAtualizacao(){return ATU;}
function limparCacheERecarregar(){
  var fim=function(){location.reload();};
  var tarefas=[];
  try{
    if(window.caches&&caches.keys)tarefas.push(caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){return caches.delete(k);}));}));
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)
      tarefas.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.unregister();}));}));
  }catch(e){}
  if(!tarefas.length)return fim();
  Promise.all(tarefas).then(fim,fim);
  setTimeout(fim,2500);
}
function buscarAtualizacao(){
  if(ATU&&ATU.cls==='busca')return;          /* dois toques não viram duas buscas */
  ATU={cls:'busca',ic:'⏳',t:'Consultando o servidor…',
       s:'Buscando a versão publicada, sem usar o cache.'};
  renderNoLugar();
  var morto=false;
  var expira=setTimeout(function(){
    if(morto||!ATU||ATU.cls!=='busca')return;
    morto=true;
    ATU={cls:'err',ic:'⚠︎',t:'O servidor não respondeu',
         s:'A consulta passou de 10 segundos. Nada foi alterado no app.'};
    renderNoLugar();
  },10000);
  fetch(location.pathname,{cache:'reload'}).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.text();
  }).then(function(txt){
    if(morto)return;
    clearTimeout(expira);
    var m=/var BUILD='([^']+)'/.exec(txt);
    if(!m)throw new Error('sem carimbo');
    if(m[1]===BUILD){
      ATU={cls:'ok',ic:'✓',t:'Você já está na versão mais recente',
           s:'O servidor está na build <b>'+esc(BUILD)+'</b>, a mesma que está aqui. '+
             'Nada foi recarregado.'};
      renderNoLugar();return;
    }
    ATU={cls:'ok',ic:'↻',t:'Versão nova encontrada',
         s:'Baixando a build <b>'+esc(m[1])+'</b>…'};
    renderNoLugar();
    try{localStorage.setItem(ATU_CHAVE,JSON.stringify({de:BUILD,para:m[1]}));}catch(e){}
    limparCacheERecarregar();
  }).catch(function(){
    if(morto)return;
    clearTimeout(expira);morto=true;
    ATU={cls:'err',ic:'⚠︎',t:'Não consegui falar com o servidor',
         s:'Você parece estar sem conexão. O app continua funcionando normalmente — '+
           'ele não depende da rede para nada além disto.'};
    renderNoLugar();
  });
}
/* Depois do recarregamento: conta o que aconteceu e volta para Ajustes.
   Roda uma vez, no boot, e a chave é apagada na leitura — a frase é sobre
   ESTE recarregamento, não sobre todos os próximos. */
function retomarAtualizacao(){
  var cru=null;
  try{cru=localStorage.getItem(ATU_CHAVE);localStorage.removeItem(ATU_CHAVE);}catch(e){}
  if(!cru)return;
  var r=null;try{r=JSON.parse(cru);}catch(e){}
  if(!r||!r.de)return;
  /* Depois de um recarregamento de verdade a tela nasce no topo e não há
     rolagem a preservar — o que precisa é a mensagem entrar na vista. */
  if(BUILD!==r.de){
    ATU={cls:'ok',ic:'↻',t:'Atualizado',
         s:'Da build <b>'+esc(r.de)+'</b> para a <b>'+esc(BUILD)+'</b>. '+
           'Seus lançamentos não foram tocados.'};
  }else{
    /* O caso chato e real: o servidor anunciou a build nova, o recarregamento
       trouxe a antiga. Quase sempre é o CDN ainda publicando. Dizer
       "atualizado" aqui seria mentir sobre o que está rodando. */
    ATU={cls:'err',ic:'⚠︎',t:'A atualização não veio',
         s:'O servidor anunciou a build <b>'+esc(r.para||'nova')+'</b>, mas o app voltou '+
           'na <b>'+esc(BUILD)+'</b>. Costuma ser o servidor ainda publicando: '+
           'tente de novo em alguns minutos.'};
  }
  ATU.rolar=true;
  S.aba='cfg';
}

function nomeArquivo(ext){
  return 'despesas-'+hoje()+'.'+ext;
}
function baixar(nome,texto,mime){
  var blob=new Blob([texto],{type:mime||'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=nome;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1200);
}
/* Devolve uma PROMESSA quando a folha do iOS entra em cena, e null quando o
   arquivo foi baixado direto (aí já acabou). Quem precisa saber se deu certo
   espera a promessa — cancelar a folha rejeita, e cancelar não é backup. */
function partilhar(nome,texto,mime){
  var f=null;
  try{f=new File([texto],nome,{type:mime});}catch(e){f=null;}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&navigator.share){
    return navigator.share({files:[f],title:nome});
  }
  baixar(nome,texto,mime);
  return null;
}
function pacoteJSON(){
  return JSON.stringify({
    app:'despesas',schemaVersion:SCHEMA,exportadoEm:new Date().toISOString(),
    /* v18: `metas` entra AQUI e em restaurarJSON(). Estes dois lugares montam
       o objeto campo a campo, então coleção nova não entra sozinha — sem esta
       linha, exportar e restaurar apagaria as metas em silêncio: lançamentos
       voltam, categorias voltam, metas não. */
    cats:DB.cats,ordem:DB.ordem,exp:DB.exp,rec:DB.rec||[],metas:DB.metas||[],
    /* v27: `etq` entra AQUI e em restaurarJSON(), pelo mesmo motivo escrito
       acima para `metas`. É a terceira coleção a passar por esta armadilha. */
    etq:DB.etq||[],prefs:DB.prefs
  },null,1);
}
function compartilharJSON(){
  var txt=pacoteJSON();
  var pr=partilhar(nomeArquivo('json'),txt,'application/json');
  function marcar(){
    DB.prefs.ultBackup=hoje();
    DB.prefs.bannerOff=mkey(hoje());
    salvar();render();
    toast('Backup guardado',diaLabel(hoje()).split(' · ')[0],'',null);
  }
  /* null = baixou direto, então terminou. Promessa = folha do iOS aberta: só
     marca se ela resolver. Cancelar rejeita, e aí NADA é marcado — a faixa de
     cobrança continua, que é o comportamento honesto. */
  if(!pr){marcar();return;}
  pr.then(marcar).catch(function(){});
}
function csvCampo(v){
  v=String(v==null?'':v);
  return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
/* Uma linha por PARCELA, não por compra: numa planilha o que se quer é somar a
   coluna de valor e fechar com o gasto do período. As colunas de parcela e o
   id_compra permitem reagrupar quando for preciso. */
function exportarCSV(){
  /* As duas últimas colunas existem para a volta: sem elas, reimportar apaga o
     vínculo com a recorrência e o app recobra meses já confirmados. Entram no
     FIM para não quebrar planilha de quem já usa as anteriores. */
  var l=['id;id_compra;data;tipo;categoria;subcategoria;valor;parcela;parcelas;valor_compra;data_compra;pagamento;descricao;recorrencia;competencia;etiquetas'];
  ocorrencias().sort(function(a,b){return a.d<b.d?-1:(a.d>b.d?1:0);}).forEach(function(e){
    l.push([e.id,e.oid,e.d,(eEntrada(e.cat)?'entrada':'saida'),
            nomeCat(e.cat),nomeSub(e.cat,e.sub),brl(e.v),
            e.pi,e.pn,brl(e.vt),e.dc,e.pay||'',e.desc||'',
            e.rec||'',e.comp||'',
            /* v27: pelos NOMES, separados por vírgula. O id não serve a
               ninguém fora do app, e é o nome que faz a coluna ser útil numa
               planilha — que é para isso que o CSV existe. A volta recria a
               etiqueta pelo nome, com a mesma normalização da criação. */
            etqsDe(e).map(function(t){return t.n;}).join(', ')]
      .map(csvCampo).join(';'));
  });
  partilhar(nomeArquivo('csv'),'﻿'+l.join('\r\n'),'text/csv');
}
function escolherArquivo(accept,cb){
  var i=document.createElement('input');
  i.type='file';i.accept=accept;i.style.display='none';
  i.onchange=function(){
    var f=i.files&&i.files[0];if(!f){i.remove();return;}
    var r=new FileReader();
    r.onload=function(){cb(String(r.result),f.name);i.remove();};
    r.onerror=function(){alerta('Não consegui ler','O arquivo não pôde ser aberto.');i.remove();};
    r.readAsText(f,'utf-8');
  };
  document.body.appendChild(i);i.click();
}
function restaurarJSON(){
  escolherArquivo('.json,application/json',function(txt){
    var d;

    if(!d||!Array.isArray(d.exp)||!Array.isArray(d.cats)){
      alerta('Arquivo inválido','Este JSON não parece um backup do app.');return;}
    var sv=d.schemaVersion||d.v||1;
    if(sv>SCHEMA){
      alerta('Backup mais novo que o app','O arquivo foi gerado pela versão de formato '+sv+
        ', e este app entende até a '+SCHEMA+'. Atualize o app antes de restaurar — importar pela metade seria pior.');
      return;
    }
    var nRec=Array.isArray(d.rec)?d.rec.length:0;
    confirmar2('Restaurar backup?','Entram '+d.exp.length+' lançamentos, '+d.cats.length+
      ' categorias'+(nRec?(' e '+nRec+(nRec===1?' recorrente':' recorrentes')):'')+
      '. Saem os '+DB.exp.length+' lançamentos atuais deste aparelho. A substituição é total.','Restaurar',true,function(){
      DB=migrar({v:SCHEMA,cats:d.cats,ordem:d.ordem,exp:d.exp,rec:d.rec||[],
                 metas:d.metas||[],etq:d.etq||[],prefs:d.prefs||{}});
      salvar();S.aba='list';S.periodo='tudo';render();
      toast('Backup restaurado',d.exp.length+' lançamentos carregados.','',null);
    });
  });
}
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');
  var linhas=[],campo='',linha=[],aspas=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt[i];
    if(aspas){
      if(ch==='"'){if(txt[i+1]==='"'){campo+='"';i++;}else aspas=false;}
      else campo+=ch;
    }else if(ch==='"')aspas=true;
    else if(ch===';'){linha.push(campo);campo='';}
    else if(ch==='\n'){linha.push(campo);campo='';linhas.push(linha);linha=[];}
    else if(ch!=='\r')campo+=ch;
  }
  if(campo!==''||linha.length){linha.push(campo);linhas.push(linha);}
  return linhas.filter(function(l){return l.length>1||l[0]!=='';});
}
function importarCSV(){
  escolherArquivo('.csv,text/csv',function(txt){
    var linhas=parseCSV(txt);
    if(linhas.length<2){alerta('Planilha vazia','Não encontrei linhas de dados.');return;}
    var head=linhas[0].map(function(h){return h.trim().toLowerCase();});
    var col=function(n){return head.indexOf(n);};
    var iD=col('data'),iC=col('categoria'),iS=col('subcategoria'),iV=col('valor');
    if(iD<0||iC<0||iV<0){
      alerta('Colunas não encontradas','A planilha precisa ter pelo menos as colunas data, categoria e valor, separadas por ponto e vírgula.');
      return;}
    var iId=col('id'),iP=col('pagamento'),iT=col('descricao');
    /* O CSV é UMA LINHA POR PARCELA: as linhas de uma compra em 6× são dado
       DERIVADO da compra, não seis lançamentos. Importar linha a linha devolvia
       seis à vista e o "Comprometido à frente" sumia. Aqui elas são colapsadas
       de volta numa compra só, usando as colunas que o export sempre trouxe. */
    var iOid=col('id_compra'),iNP=col('parcelas'),iVT=col('valor_compra'),
        iDC=col('data_compra'),iRec=col('recorrencia'),iComp=col('competencia'),
        iEtq=col('etiquetas');
    var porNome={};DB.cats.forEach(function(c){porNome[c.n.toLowerCase()]={c:c,subs:{}};
      c.subs.forEach(function(s){porNome[c.n.toLowerCase()].subs[s.n.toLowerCase()]=s;});});
    var novos=[],faltando={},invalidas=0,vistos={},colapsadas=0,vinculadas=0;
    /* v27: as etiquetas voltam pelo NOME. A coluna é opcional — planilha de
       outra origem simplesmente não a tem. Nome que não existe vira etiqueta
       nova; nome que já existe (sem acento, sem caixa) reaproveita a que há,
       pela mesma normalização que a criação usa. Nada é criado antes de a
       importação ser confirmada. */
    var etqNovas=[],etqPorNome={};
    function etqDaPlanilha(txt){
      var out=[];
      String(txt||'').split(',').forEach(function(n){
        n=n.trim().replace(/\s+/g,' ');
        if(!n)return;
        var k=normEtq(n);
        if(!k)return;
        var ja=acharEtq(n);
        if(ja){if(out.indexOf(ja.id)<0)out.push(ja.id);return;}
        if(!etqPorNome[k]){etqPorNome[k]={id:uid('q'),n:n};etqNovas.push(etqPorNome[k]);}
        if(out.indexOf(etqPorNome[k].id)<0)out.push(etqPorNome[k].id);
      });
      return out;
    }
    for(var i=1;i<linhas.length;i++){
      var L=linhas[i];
      var data=(L[iD]||'').trim();
      var cn=(L[iC]||'').trim(),sn=(iS>=0?(L[iS]||'').trim():'');
      var v=lerValor(L[iV]);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||!v){invalidas++;continue;}
      var ref=porNome[cn.toLowerCase()];
      if(!ref){faltando[cn]=(faltando[cn]||0)+1;continue;}
      var s=sn?ref.subs[sn.toLowerCase()]:null;
      var oid=(iOid>=0&&L[iOid])?String(L[iOid]).trim():null;
      var np=(iNP>=0)?(parseInt(L[iNP],10)||1):1;
      var vt=(iVT>=0)?lerValor(L[iVT]):null;
      var dc=(iDC>=0)?String(L[iDC]||'').trim():'';
      /* Só colapsa quando a planilha traz TUDO que descreve a compra. Um CSV de
         outra origem, sem essas colunas, continua entrando linha a linha. */
      var ehParcela=!!(oid&&np>1&&vt&&/^\d{4}-\d{2}-\d{2}$/.test(dc));
      if(ehParcela){
        if(vistos[oid]){continue;}       /* as outras parcelas são derivadas */
        vistos[oid]=1;
        var reP={id:oid,d:dc,cat:ref.c.id,sub:s?s.id:null,v:vt,par:np,
          pay:(iP>=0?(L[iP]||'').trim():'')||null,desc:(iT>=0?(L[iT]||'').trim():''),
          ts:Date.now(),_oid:oid};
        var tP=(iEtq>=0)?etqDaPlanilha(L[iEtq]):[];
        if(tP.length)reP.etq=tP;
        novos.push(reP);
        colapsadas+=np;
        continue;
      }
      var reg={id:(iId>=0&&L[iId])?L[iId]:uid('e'),d:data,cat:ref.c.id,sub:s?s.id:null,
        v:v,pay:(iP>=0?(L[iP]||'').trim():'')||null,desc:(iT>=0?(L[iT]||'').trim():''),ts:Date.now(),
        _oid:oid};
      /* o vínculo só volta se o molde existir NESTE aparelho; apontar para um
         molde que não está aqui seria pior que não apontar para nada */
      var rid=(iRec>=0)?String(L[iRec]||'').trim():'';
      var cp=(iComp>=0)?String(L[iComp]||'').trim():'';
      if(rid&&/^\d{4}-\d{2}$/.test(cp)&&rec(rid)){reg.rec=rid;reg.comp=cp;vinculadas++;}
      var tg=(iEtq>=0)?etqDaPlanilha(L[iEtq]):[];
      if(tg.length)reg.etq=tg;
      novos.push(reg);
    }
    var faltaNomes=Object.keys(faltando);
    folha('Importar planilha',function(b){
      /* Com o colapso das parcelas, "linhas lidas" e "lançamentos a criar"
         deixaram de ser o mesmo número. O rótulo tem de dizer qual dos dois é. */
      b.appendChild(el('<div class="hero" style="margin-bottom:12px"><div class="k">Lançamentos a importar</div>'+
        '<div class="big tnum">'+novos.length+'</div>'+
        '<div class="delta flat">'+(invalidas?invalidas+' linha(s) ignorada(s) por data ou valor inválido':'nenhuma linha com problema')+'</div></div>'));
      if(colapsadas||vinculadas){
        var av=[];
        if(colapsadas)av.push(colapsadas+' linha(s) de parcela reunidas nas compras de origem');
        if(vinculadas)av.push(vinculadas+' lançamento(s) religados à recorrência de origem');
        b.appendChild(el('<div class="hint" style="padding-top:0">'+esc(av.join(' · '))+'.</div>'));
      }
      if(faltaNomes.length){
        b.appendChild(el('<div class="glabel">Categorias que não existem aqui</div>'));
        var w=el('<div class="optwrap"></div>');
        faltaNomes.forEach(function(n){
          w.appendChild(el('<div class="opt"><span class="ic">⚠️</span><span class="nm">'+esc(n)+
            '</span><span class="tag">'+faltando[n]+' linha(s)</span></div>'));
        });
        b.appendChild(w);
        b.appendChild(el('<div class="hint">Estas linhas serão ignoradas. Crie as categorias com o mesmo nome em Ajustes e importe de novo, se quiser trazê-las.</div>'));
      }
      if(!novos.length){
        b.appendChild(el('<div class="hint">Nada para importar.</div>'));return;
      }
      var m=el('<button class="btnfull">Mesclar ('+novos.length+(novos.length===1?' lançamento':' lançamentos')+')</button>');
      m.onclick=function(){
        var tem={};DB.exp.forEach(function(e){tem[e.id]=1;});
        /* uma linha já existe se o id dela bate com um lançamento OU se ela veio
           de uma compra que já está aqui (o caso das parcelas) */
        var add=novos.filter(function(e){return !tem[e.id]&&!(e._oid&&tem[e._oid]);});
        add.forEach(function(e){delete e._oid;});
        gravarEtqNovas(etqNovas,add);
        DB.exp=add.concat(DB.exp);
        ordenarExp();salvar();fecharFolhas();S.aba='list';S.periodo='tudo';render();
        toast('Importação concluída',add.length+' novos · '+(novos.length-add.length)+' já existiam','',null);
      };
      b.appendChild(m);
      var r=el('<button class="btnfull dan">Substituir os lançamentos ('+novos.length+')</button>');
      r.onclick=function(){
        confirmar2('Substituir lançamentos?','Os '+DB.exp.length+' lançamentos atuais serão apagados e trocados pelos '+
          novos.length+' da planilha. As categorias não mudam.',
          'Substituir',true,function(){
          novos.forEach(function(e){delete e._oid;});
          gravarEtqNovas(etqNovas,novos);
          DB.exp=novos.slice();ordenarExp();salvar();S.aba='list';S.periodo='tudo';render();
          toast('Lançamentos substituídos',novos.length+' importados.','',null);
        });
      };
      b.appendChild(r);
    });
  });
}
/* v27: as etiquetas que a planilha trouxe só passam a existir quando a
   importação é confirmada — e só as que ficaram em pelo menos uma linha
   realmente importada. Criar antes deixaria etiqueta órfã na base de quem
   olhou a prévia e desistiu. */
function gravarEtqNovas(novas,entrando){
  if(!novas||!novas.length)return;
  var usados={};
  entrando.forEach(function(e){(e.etq||[]).forEach(function(id){usados[id]=1;});});
  DB.etq=DB.etq||[];
  novas.forEach(function(t){if(usados[t.id])DB.etq.push(t);});
}
function ordenarExp(){DB.exp.sort(function(a,b){return a.d<b.d?1:(a.d>b.d?-1:(b.ts||0)-(a.ts||0));});}
